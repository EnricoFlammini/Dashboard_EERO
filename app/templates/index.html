<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eero Custom Dashboard & Management Suite</title>
  
  <!-- Favicon / SVG Icon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.55a11 11 0 0 1 14.08 0'/><path d='M1.42 9a16 16 0 0 1 21.16 0'/><path d='M8.53 16.11a6 6 0 0 1 6.95 0'/><line x1='12' y1='20' x2='12.01' y2='20'/></svg>">
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
            },
            dark: {
              900: '#0b0f17',
              800: '#111827',
              700: '#1e293b',
              600: '#334155',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/static/css/styles.css">

  <!-- Chart.js CDN & Alpine.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- App Logic -->
  <script src="/static/js/app.js"></script>
</head>
<body class="bg-[#0b0f17] text-slate-100 min-h-screen antialiased flex flex-col" x-data="eeroApp">

  <!-- ===================================================================== -->
  <!-- TOP APP BAR -->
  <!-- ===================================================================== -->
  <header class="sticky top-0 z-40 bg-[#111827]/80 backdrop-blur-xl border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path>
          </svg>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-lg font-bold tracking-tight text-white">eero <span class="text-sky-400 font-medium">Dashboard</span></h1>
            <button 
              @click="openChangelogModal()" 
              class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/20 hover:border-sky-500/40 transition flex items-center space-x-1 cursor-pointer" 
              :title="t('header.changelog_title') + ' v1.01.00'">
              <span>v1.01.00</span>
              <svg class="w-3 h-3 text-sky-400/80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </button>

            <!-- Language Selector (i18n) -->
            <div class="relative flex items-center">
              <select 
                x-model="currentLanguage" 
                @change="setLanguage($event.target.value)"
                class="text-[11px] font-medium bg-slate-900/90 hover:bg-slate-800 text-slate-300 border border-slate-700/80 hover:border-slate-600 rounded-xl px-2 py-0.5 transition cursor-pointer focus:outline-none focus:ring-1 focus:ring-sky-500"
                title="Select Language / Seleziona Lingua">
                <option value="it">🇮🇹 IT</option>
                <option value="en">🇬🇧 EN</option>
              </select>
            </div>
          </div>
          <p class="text-xs text-slate-400 font-medium" x-text="network.name || t('mesh_infra')"></p>
        </div>
      </div>

      <!-- Center Indicator: Health Score -->
      <div class="hidden md:flex items-center space-x-6">
        <!-- Health Score Badge -->
        <div class="flex items-center space-x-2">
          <div class="relative w-8 h-8 flex items-center justify-center">
            <svg class="w-8 h-8 -rotate-90">
              <circle cx="16" cy="16" r="13" stroke="rgba(255,255,255,0.1)" stroke-width="3" fill="none"></circle>
              <circle cx="16" cy="16" r="13" :stroke="healthScore > 80 ? '#10b981' : healthScore > 50 ? '#f59e0b' : '#f43f5e'" stroke-width="3" fill="none" :stroke-dasharray="81.68" :stroke-dashoffset="81.68 - (81.68 * healthScore / 100)" stroke-linecap="round"></circle>
            </svg>
            <span class="absolute text-[10px] font-bold" x-text="healthScore"></span>
          </div>
          <div class="text-left">
            <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold" x-text="t('dashboard.health_score')"></div>
            <div class="text-xs font-bold text-emerald-400" x-show="healthScore >= 90" x-text="t('header.optimal')"></div>
            <div class="text-xs font-bold text-amber-400" x-show="healthScore < 90 && healthScore >= 70" x-text="t('header.good')"></div>
            <div class="text-xs font-bold text-rose-400" x-show="healthScore < 70" x-text="t('header.warning')"></div>
          </div>
        </div>
      </div>

      <!-- Right Actions: Refresh, Focus Mode, Help, Logout -->
      <div class="flex items-center space-x-3">
        
        <!-- Refresh Button -->
        <button 
          @click="manualRefresh()"
          :disabled="isRefreshing"
          class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/30 transition-all active:scale-95 disabled:opacity-50"
          :title="t('header.refresh_title')">
          <svg class="w-4 h-4" :class="isRefreshing ? 'animate-spin' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          <span class="hidden sm:inline" x-text="isRefreshing ? t('header.refreshing') : t('header.refresh')"></span>
        </button>

        <!-- Demo Mode Badge -->
        <template x-if="isDemoMode">
          <span class="hidden sm:inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/30">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-400 mr-1.5 animate-ping"></span> <span x-text="t('demo_mode')"></span>
          </span>
        </template>

        <!-- Focus Mode One-Click Button -->
        <button 
          @click="toggleFocusMode()"
          :class="focusModeActive ? 'bg-rose-500 text-white shadow-lg shadow-rose-500/30' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'"
          class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all"
          :title="t('header.gaming_tooltip')">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span x-text="focusModeActive ? t('header.gaming_active') : t('header.gaming_mode')"></span>
        </button>

        <!-- Context Help Trigger -->
        <button 
          @click="openContextHelp('intro')"
          class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-sky-400 transition"
          :title="t('header.quick_help')">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </button>
      </div>

    </div>
  </header>

  <!-- ===================================================================== -->
  <!-- NAVIGATION TABS -->
  <!-- ===================================================================== -->
  <nav class="bg-[#111827]/50 border-b border-slate-800/80 sticky top-16 z-30 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex space-x-1 sm:space-x-4 overflow-x-auto py-2.5 no-scrollbar">
        
        <button 
          @click="setTab('overview')"
          :class="currentTab === 'overview' ? 'bg-sky-500/10 text-sky-400 border-sky-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border-transparent'"
          class="flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold border transition whitespace-nowrap">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
          <span x-text="t('nav.dashboard')"></span>
        </button>

        <button 
          @click="setTab('devices')"
          :class="currentTab === 'devices' ? 'bg-sky-500/10 text-sky-400 border-sky-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border-transparent'"
          class="flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold border transition whitespace-nowrap">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          <span><span x-text="t('nav.devices')"></span> (<span x-text="devices.length"></span>)</span>
        </button>


        <button 
          @click="setTab('speedtest')"
          :class="currentTab === 'speedtest' ? 'bg-sky-500/10 text-sky-400 border-sky-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border-transparent'"
          class="flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold border transition whitespace-nowrap">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
          <span x-text="t('nav.speedtest')"></span>
        </button>

        <button 
          @click="setTab('automations')"
          :class="currentTab === 'automations' ? 'bg-sky-500/10 text-sky-400 border-sky-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border-transparent'"
          class="flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold border transition whitespace-nowrap">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
          <span x-text="t('nav.controls')"></span>
        </button>

        <button 
          @click="setTab('manual')"
          :class="currentTab === 'manual' ? 'bg-indigo-500/10 text-indigo-400 border-indigo-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border-transparent'"
          class="flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold border transition whitespace-nowrap">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
          <span x-text="t('nav.manual')"></span>
        </button>

      </div>
    </div>
  </nav>

  <!-- ===================================================================== -->
  <!-- MAIN CONTENT CONTAINER -->
  <!-- ===================================================================== -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- =================================================================== -->
    <!-- TAB 1: OVERVIEW & MESH TOPOLOGY -->
    <!-- =================================================================== -->
    <div x-show="currentTab === 'overview'" class="space-y-6 animate-fade-in">
      
      <!-- WAN Status & Summary Cards Grid -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        
        <!-- WAN Card -->
        <div class="glass-panel rounded-2xl p-5 relative overflow-hidden">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400" x-text="t('dashboard.wan_status')"></span>
            <span class="w-2.5 h-2.5 rounded-full" :class="['online', 'green'].includes(network.status) ? 'bg-emerald-400 shadow-lg shadow-emerald-500/50' : 'bg-rose-500 shadow-lg shadow-rose-500/50'"></span>
          </div>
          <div class="text-2xl font-bold text-white tracking-tight" x-text="['online', 'green'].includes(network.status) ? t('devices.status_online') : t('devices.status_offline')"></div>
          <div class="mt-2 text-xs font-mono text-slate-400 flex items-center space-x-1">
            <span x-text="t('dashboard.wan_ip')"></span>
            <span class="text-sky-400 font-semibold" x-text="network.public_ip || '0.0.0.0'"></span>
          </div>
          <div class="mt-1 text-[11px] text-slate-500 truncate" x-text="network.isp || t('dashboard.isp_connected')"></div>
        </div>

        <!-- Gateway Node Card -->
        <div class="glass-panel rounded-2xl p-5">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400" x-text="t('dashboard.node_gateway')"></span>
            <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
          </div>
          <div class="text-xl font-bold text-white tracking-tight truncate" x-text="(eeros.find(e => e.is_gateway) || eeros[0] || {}).name || t('dashboard.node_gateway')"></div>
          <div class="mt-2 text-xs font-mono text-slate-400 flex items-center space-x-1">
            <span x-text="t('dashboard.lan_ip')"></span>
            <span class="text-slate-200" x-text="(eeros.find(e => e.is_gateway) || eeros[0] || {}).ip || network.gateway_ip || '192.168.4.1'"></span>
          </div>
          <div class="mt-1 text-[11px] text-slate-500">DNS: <span x-text="Array.isArray(network.dns_servers) ? network.dns_servers.join(', ') : (typeof network.dns_servers === 'object' && network.dns_servers !== null && network.dns_servers.ips ? network.dns_servers.ips.join(', ') : (network.dns_servers || '192.168.4.104, 1.1.1.1'))"></span></div>
        </div>

        <!-- Connected Clients Count -->
        <div class="glass-panel rounded-2xl p-5">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400" x-text="t('dashboard.connected_devices')"></span>
            <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
          </div>
          <div class="text-3xl font-extrabold text-white tracking-tight" x-text="devices.filter(d=>d.connected).length || realtimeMetrics.connected_clients_count"></div>
          <div class="mt-2 text-xs text-slate-400" x-text="t('dashboard.active_in_mesh')"></div>
        </div>

        <!-- Last Speedtest Preview -->
        <div class="glass-panel rounded-2xl p-5">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400" x-text="t('dashboard.last_speedtest')"></span>
            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
          </div>
          <div class="flex items-baseline space-x-2">
            <span class="text-2xl font-bold text-sky-400 font-mono" x-text="Number(latestSpeedtest.download_mbps || 0).toFixed(0)"></span>
            <span class="text-xs text-slate-400">↓ Mbps</span>
            <span class="text-slate-600">/</span>
            <span class="text-lg font-bold text-emerald-400 font-mono" x-text="Number(latestSpeedtest.upload_mbps || 0).toFixed(0)"></span>
            <span class="text-xs text-slate-400">↑ Mbps</span>
          </div>
          <div class="mt-2 text-xs text-slate-400">Ping: <span class="text-amber-400 font-semibold" x-text="Number(latestSpeedtest.ping_ms || 0).toFixed(0) + ' ms'"></span></div>
        </div>

      </div>

      <!-- Quick Actions Header & Topology -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pt-2">
        <div class="flex items-center space-x-2">
          <h2 class="text-lg font-bold text-white"><span x-text="t('dashboard.mesh_topology')"></span> (<span x-text="eeros.length"></span>)</h2>
          <button @click="openContextHelp('dashboard-mesh')" class="text-slate-500 hover:text-sky-400" :title="t('dashboard.mesh_topology_sub')">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </button>
        </div>
        
        <!-- Global Actions -->
        <div class="flex items-center space-x-3">
          <button 
            @click="rebootNetwork()"
            class="px-3 py-1.5 rounded-lg bg-rose-600/20 hover:bg-rose-600/30 text-xs font-semibold text-rose-400 border border-rose-500/30 transition flex items-center space-x-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            <span x-text="t('dashboard.restart_network_btn')"></span>
          </button>
        </div>
      </div>

      <!-- Mesh Nodes Cards Grid -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <template x-for="eero in eeros" :key="eero.id || eero.serial">
          <div class="glass-panel rounded-2xl p-5 border border-slate-800 hover-glow transition-all flex flex-col justify-between">
            <div>
              <!-- Node Header -->
              <div class="flex items-start justify-between">
                <div>
                  <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full" :class="['online', 'green'].includes(eero.status) ? 'bg-emerald-400' : 'bg-rose-500'"></span>
                    <h3 class="font-bold text-white text-base" x-text="eero.name"></h3>
                  </div>
                  <p class="text-xs text-slate-400 mt-0.5" x-text="eero.model"></p>
                </div>
                <template x-if="eero.is_gateway">
                  <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-sky-500/20 text-sky-400 border border-sky-500/30 uppercase tracking-wider">Gateway</span>
                </template>
              </div>

              <!-- Node Specs & Info -->
              <div class="mt-4 space-y-2 border-t border-b border-slate-800/80 py-3 text-xs">
                <div class="flex justify-between text-slate-400">
                  <span x-text="t('dashboard.ip_address')"></span>
                  <span class="font-mono text-slate-200" x-text="eero.ip || 'DHCP'"></span>
                </div>
                <div class="flex justify-between text-slate-400">
                  <span x-text="t('dashboard.backhaul')"></span>
                  <span class="font-semibold text-emerald-400" x-text="formatBackhaul(eero)"></span>
                </div>
                <div class="flex justify-between text-slate-400">
                  <span x-text="t('dashboard.connected_clients')"></span>
                  <span class="font-bold text-white" x-text="eero.connected_clients_count !== undefined ? eero.connected_clients_count : ((devices.filter(d => d.connected && (d.connected_eero_id === eero.id || d.connected_eero_name === eero.name)).length) || 0)"></span>
                </div>
                <div class="flex justify-between text-slate-400">
                  <span x-text="t('dashboard.status')"></span>
                  <span class="text-emerald-400 font-medium" x-text="formatNodeStatus(eero)"></span>
                </div>
                <div class="flex justify-between text-slate-400">
                  <span x-text="t('dashboard.firmware')"></span>
                  <span class="font-mono text-slate-300 text-[11px]" x-text="eero.os_version || t('dashboard.updated')"></span>
                </div>
              </div>
            </div>

            <!-- Node Controls -->
            <div class="mt-4 flex items-center justify-between pt-2">
              <span class="text-[11px] text-slate-500 flex items-center space-x-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                <span x-text="t('dashboard.mesh_active')"></span>
              </span>

              <button 
                @click="rebootEero(eero)"
                class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-rose-950/40 text-xs font-semibold text-slate-400 hover:text-rose-400 border border-slate-700 transition flex items-center space-x-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span x-text="t('dashboard.restart_node_btn')"></span>
              </button>
            </div>

          </div>
        </template>
      </div>

    </div>

    <!-- =================================================================== -->
    <!-- TAB 2: DEVICE MANAGEMENT -->
    <!-- =================================================================== -->
    <div x-show="currentTab === 'devices'" class="space-y-6 animate-fade-in" style="display: none;">
      
      <!-- Filters and Search Bar -->
      <div class="glass-panel rounded-2xl p-5 space-y-4">
        <div class="flex flex-col md:flex-row items-center justify-between gap-4">
          
          <!-- Search Input -->
          <div class="relative w-full md:w-96">
            <svg class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input 
              type="text" 
              x-model="deviceSearchQuery"
              :placeholder="t('devices.search_placeholder')"
              class="glass-input w-full pl-10 pr-4 py-2 rounded-xl text-sm">
          </div>

          <!-- Quick Filters: Band, Node, Category -->
          <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
            
            <!-- Band Filter -->
            <select x-model="selectedBandFilter" class="glass-input px-3 py-2 rounded-xl text-xs">
              <option value="all" x-text="t('devices.filter_all_bands')"></option>
              <option value="6GHz" x-text="t('devices.filter_band_6ghz')"></option>
              <option value="5GHz" x-text="t('devices.filter_band_5ghz')"></option>
              <option value="2.4GHz" x-text="t('devices.filter_band_24ghz')"></option>
              <option value="wired" x-text="t('devices.filter_band_wired')"></option>
            </select>

            <!-- Node Filter -->
            <select x-model="selectedNodeFilter" class="glass-input px-3 py-2 rounded-xl text-xs">
              <option value="all" x-text="t('devices.filter_all_nodes')"></option>
              <template x-for="e in eeros" :key="e.id || e.serial">
                <option :value="e.id" x-text="e.name"></option>
              </template>
            </select>

            <!-- Category Filter -->
            <select x-model="selectedCategoryFilter" class="glass-input px-3 py-2 rounded-xl text-xs">
              <option value="all" x-text="t('devices.filter_all_categories')"></option>
              <option value="favorites" x-text="t('devices.filter_favorites')"></option>
              <option value="Computer" x-text="t('devices.cat_computer')"></option>
              <option value="Mobile" x-text="t('devices.cat_mobile')"></option>
              <option value="Smart Home" x-text="t('devices.cat_smarthome')"></option>
              <option value="Intrattenimento" x-text="t('devices.cat_entertainment')"></option>
              <option value="Gaming" x-text="t('devices.cat_gaming')"></option>
              <option value="Server/Rete" x-text="t('devices.cat_server')"></option>
              <option value="Altro" x-text="t('devices.cat_other')"></option>
            </select>

            <!-- Profile Filter -->
            <select x-model="selectedProfileFilter" class="glass-input px-3 py-2 rounded-xl text-xs">
              <option value="all" x-text="t('devices.filter_all_profiles')"></option>
              <option value="unassigned" x-text="t('devices.filter_unassigned')"></option>
              <template x-for="prof in profiles" :key="prof.id">
                <option :value="prof.id" x-text="'👤 ' + prof.name"></option>
              </template>
            </select>

            <!-- IP Type Filter (Statico / DHCP) -->
            <select x-model="selectedIpTypeFilter" class="glass-input px-3 py-2 rounded-xl text-xs">
              <option value="all" x-text="t('devices.filter_all_assignments')"></option>
              <option value="static" x-text="t('devices.filter_only_static')"></option>
              <option value="dhcp" x-text="t('devices.filter_only_dhcp')"></option>
            </select>

            <!-- Connected Only Toggle -->
            <label class="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer select-none">
              <input type="checkbox" x-model="showConnectedOnly" class="rounded bg-slate-900 border-slate-700 text-sky-500 focus:ring-0">
              <span x-text="t('devices.filter_connected_only')"></span>
            </label>

            <!-- Quick Refresh Dispositivi -->
            <button 
              @click="manualRefresh()"
              :disabled="isRefreshing"
              class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-sky-400 border border-slate-700 transition"
              :title="t('devices.refresh_title')">
              <svg class="w-4 h-4" :class="isRefreshing ? 'animate-spin' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
              </svg>
            </button>

          </div>

        </div>
      </div>

      <!-- Devices Table -->
      <div class="glass-panel rounded-2xl overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="border-b border-slate-800 bg-slate-900/80 text-slate-400 uppercase tracking-wider font-semibold">
                <th class="py-3.5 px-4" x-text="t('devices.col_device')"></th>
                <th class="py-3.5 px-4" x-text="t('devices.col_ip_mac')"></th>
                <th class="py-3.5 px-4" x-text="t('devices.col_profile')"></th>
                <th class="py-3.5 px-4" x-text="t('devices.col_node')"></th>
                <th class="py-3.5 px-4" x-text="t('devices.col_band')"></th>
                <th class="py-3.5 px-4" x-text="t('devices.col_signal')"></th>
                <th class="py-3.5 px-4 text-center" x-text="t('devices.col_status')"></th>
                <th class="py-3.5 px-4 text-right" x-text="t('devices.col_actions')"></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800/60">
              <template x-for="dev in filteredDevices" :key="dev.mac || dev.mac_address">
                <tr class="hover:bg-slate-800/30 transition-colors">
                  
                  <!-- Name & Icon -->
                  <td class="py-3 px-4">
                    <div class="flex items-center space-x-3">
                      <div class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-sky-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                      </div>
                      <div>
                        <div class="flex items-center space-x-1.5">
                          <div class="font-bold text-white text-sm" x-text="dev.custom_name || dev.nickname || dev.hostname || 'Device'"></div>
                          <template x-if="dev.is_favorite">
                            <span class="text-amber-400 text-xs" :title="t('devices.filter_favorites')">⭐</span>
                          </template>
                          <template x-if="dev.is_low_latency_target">
                            <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-400 border border-rose-500/30" :title="t('devices.badge_gaming_target')" x-text="t('devices.badge_gaming_target')"></span>
                          </template>
                        </div>
                        <div class="text-[11px] text-slate-500" x-text="dev.category || t('devices.cat_other')"></div>
                      </div>
                    </div>
                  </td>

                  <!-- IP & MAC with Static / DHCP badge -->
                  <td class="py-3 px-4 font-mono">
                    <div class="flex items-center space-x-2">
                      <span class="text-slate-200 font-semibold text-xs" x-text="dev.ip || '---'"></span>
                      <template x-if="dev.is_static">
                        <span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 tracking-wider inline-flex items-center" :title="t('devices.badge_static')">
                          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block mr-1"></span><span x-text="t('devices.badge_static')"></span>
                        </span>
                      </template>
                      <template x-if="!dev.is_static">
                        <span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-slate-800/90 text-slate-400 border border-slate-700/80 tracking-wider inline-flex items-center" :title="t('devices.badge_dhcp')">
                          <span class="w-1.5 h-1.5 rounded-full bg-slate-500 inline-block mr-1"></span><span x-text="t('devices.badge_dhcp')"></span>
                        </span>
                      </template>
                    </div>
                    <div class="text-[10px] text-slate-500 mt-0.5" x-text="dev.mac || dev.mac_address"></div>
                  </td>

                  <!-- Profile / User -->
                  <td class="py-3 px-4 whitespace-nowrap">
                    <template x-if="dev.profile_name">
                      <span class="inline-flex items-center space-x-1 px-2.5 py-1 rounded-lg text-xs font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/20">
                        <span>👤</span>
                        <span x-text="dev.profile_name"></span>
                      </span>
                    </template>
                    <template x-if="!dev.profile_name">
                      <span class="text-[11px] text-slate-500 italic" x-text="t('profiles.total_unassigned')"></span>
                    </template>
                  </td>

                  <!-- Connected eero -->
                  <td class="py-3 px-4 text-slate-300">
                    <span class="font-medium" x-text="dev.connected_eero_name || 'Gateway'"></span>
                  </td>

                  <!-- Band / Channel -->
                  <td class="py-3 px-4">
                    <div class="flex items-center space-x-2">
                      <span 
                        class="px-2 py-0.5 rounded text-[10px] font-mono font-bold"
                        :class="{
                          'bg-sky-500/20 text-sky-400 border border-sky-500/30': dev.wireless_band === '6GHz' || dev.frequency_band === '6 GHz',
                          'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30': dev.wireless_band === '5GHz' || dev.frequency_band === '5 GHz' || (dev.channel && dev.channel >= 32),
                          'bg-amber-500/20 text-amber-400 border border-amber-500/30': dev.wireless_band === '2.4GHz' || dev.frequency_band === '2.4 GHz' || (dev.channel && dev.channel >= 1 && dev.channel <= 14),
                          'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30': dev.connection_type === 'wired' || !dev.wireless || dev.frequency_band === 'Cablato'
                        }"
                        x-text="dev.connection_type === 'wired' || !dev.wireless || dev.frequency_band === 'Cablato' ? 'Ethernet' : (dev.frequency_band || dev.wireless_band || (dev.channel && dev.channel <= 14 ? '2.4 GHz' : '5 GHz'))">
                      </span>
                      <template x-if="dev.channel">
                        <span class="text-[10px] font-mono text-slate-400">CH <span x-text="dev.channel"></span></span>
                      </template>
                    </div>
                  </td>

                  <!-- Signal & PHY Link Speed (Real Eero API data) -->
                  <td class="py-3 px-4 font-mono text-xs">
                    <template x-if="dev.signal_rssi">
                      <div class="text-slate-300 font-semibold" x-text="dev.signal_rssi + ' dBm'"></div>
                    </template>
                    <template x-if="dev.connectivity && dev.connectivity.rx_bitrate">
                      <div class="text-[10px] text-slate-500" x-text="'PHY: ' + dev.connectivity.rx_bitrate"></div>
                    </template>
                    <template x-if="!dev.signal_rssi && (!dev.connectivity || !dev.connectivity.rx_bitrate)">
                      <div class="text-[10px] text-slate-500" x-text="dev.wireless ? 'Wi-Fi' : 'GbE 1.0 Gbps'"></div>
                    </template>
                  </td>

                  <!-- Status (Online/Offline/Paused) -->
                  <td class="py-3 px-4 text-center">
                    <template x-if="dev.paused">
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30" x-text="t('devices.status_paused')"></span>
                    </template>
                    <template x-if="!dev.paused && dev.connected">
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30" x-text="t('devices.status_online')"></span>
                    </template>
                    <template x-if="!dev.paused && !dev.connected">
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-slate-500 border border-slate-700" x-text="t('devices.status_offline')"></span>
                    </template>
                  </td>

                  <!-- Action Buttons -->
                  <td class="py-3 px-4 text-right space-x-2 whitespace-nowrap">
                    <!-- Pause/Unpause -->
                    <button 
                      @click="toggleDevicePause(dev)"
                      :class="dev.paused ? 'text-emerald-400 hover:bg-emerald-500/10' : 'text-slate-400 hover:text-amber-400 hover:bg-amber-500/10'"
                      class="p-1.5 rounded-lg transition"
                      :title="dev.paused ? t('devices.resume_access') : t('devices.pause_access')">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </button>
                    <!-- Detail Modal Trigger -->
                    <button 
                      @click="openDeviceModal(dev)"
                      class="p-1.5 rounded-lg text-slate-400 hover:text-sky-400 hover:bg-sky-500/10 transition"
                      :title="t('devices.edit_rules')">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    </button>
                  </td>

                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

    </div>


    <!-- =================================================================== -->
    <!-- TAB 4: SPEED TEST & DIAGNOSTICS -->
    <!-- =================================================================== -->
    <div x-show="currentTab === 'speedtest'" class="space-y-6 animate-fade-in" style="display: none;">
      
      <!-- Big Gauge & Action Trigger -->
      <div class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center text-center relative overflow-hidden">
        <div class="max-w-md w-full">
          
          <h2 class="text-xl font-bold text-white mb-1" x-text="t('speedtest.title')"></h2>
          <p class="text-xs text-slate-400 mb-6" x-text="t('speedtest.subtitle')"></p>

          <!-- Action Button / Progress -->
          <div class="flex flex-col items-center">
            <button 
              @click="runSpeedtest()"
              :disabled="speedtestRunning"
              class="w-40 h-40 rounded-full bg-gradient-to-tr from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-extrabold text-lg shadow-2xl shadow-sky-500/30 flex flex-col items-center justify-center space-y-1 transition-transform active:scale-95 disabled:opacity-50">
              <svg class="w-8 h-8" :class="speedtestRunning ? 'animate-spin' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
              <span x-text="speedtestRunning ? t('speedtest.running_btn') : t('speedtest.run_btn')"></span>
            </button>

            <!-- Progress Bar -->
            <div x-show="speedtestRunning" class="w-full bg-slate-800 rounded-full h-2 mt-6 overflow-hidden">
              <div class="bg-gradient-to-r from-sky-400 to-emerald-400 h-2 transition-all duration-300" :style="`width: ${speedtestProgress}%`"></div>
            </div>
          </div>

          <!-- Latest Result Badge -->
          <div class="mt-8 grid grid-cols-3 gap-4 p-4 rounded-xl bg-slate-900/80 border border-slate-800">
            <div>
              <div class="text-[10px] text-slate-400 uppercase font-semibold" x-text="t('speedtest.download')"></div>
              <div class="text-lg font-bold text-sky-400 font-mono" x-text="Number(latestSpeedtest.download_mbps || 0).toFixed(1) + ' Mbps'"></div>
            </div>
            <div>
              <div class="text-[10px] text-slate-400 uppercase font-semibold" x-text="t('speedtest.upload')"></div>
              <div class="text-lg font-bold text-emerald-400 font-mono" x-text="Number(latestSpeedtest.upload_mbps || 0).toFixed(1) + ' Mbps'"></div>
            </div>
            <div>
              <div class="text-[10px] text-slate-400 uppercase font-semibold" x-text="t('speedtest.ping_latency')"></div>
              <div class="text-lg font-bold text-amber-400 font-mono" x-text="Number(latestSpeedtest.ping_ms || 0).toFixed(0) + ' ms'"></div>
            </div>
          </div>

        </div>
      </div>

      <!-- Historical Speedtest Chart & Stats -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Chart -->
        <div class="lg:col-span-2 glass-panel rounded-2xl p-6">
          <h3 class="text-base font-bold text-white mb-4" x-text="t('speedtest.chart_title')"></h3>
          <div style="position: relative; height: 280px; width: 100%; min-height: 280px;">
            <canvas id="speedtestHistoryChart" style="width: 100%; height: 100%; display: block;"></canvas>
          </div>
        </div>

        <!-- Performance Stats Cards -->
        <div class="glass-panel rounded-2xl p-6 space-y-4 flex flex-col justify-between">
          <h3 class="text-base font-bold text-white" x-text="t('speedtest.stats_title')"></h3>
          
          <div class="space-y-3 text-xs">
            <div class="flex justify-between p-3 rounded-xl bg-slate-900/60 border border-slate-800">
              <span class="text-slate-400" x-text="t('speedtest.avg_download')"></span>
              <span class="font-bold text-sky-400 font-mono" x-text="(speedtestStats.avg_download || 0) + ' Mbps'"></span>
            </div>
            <div class="flex justify-between p-3 rounded-xl bg-slate-900/60 border border-slate-800">
              <span class="text-slate-400" x-text="t('speedtest.max_download')"></span>
              <span class="font-bold text-sky-300 font-mono" x-text="(speedtestStats.max_download || 0) + ' Mbps'"></span>
            </div>
            <div class="flex justify-between p-3 rounded-xl bg-slate-900/60 border border-slate-800">
              <span class="text-slate-400" x-text="t('speedtest.avg_upload')"></span>
              <span class="font-bold text-emerald-400 font-mono" x-text="(speedtestStats.avg_upload || 0) + ' Mbps'"></span>
            </div>
            <div class="flex justify-between p-3 rounded-xl bg-slate-900/60 border border-slate-800">
              <span class="text-slate-400" x-text="t('speedtest.avg_ping')"></span>
              <span class="font-bold text-amber-400 font-mono" x-text="(speedtestStats.avg_ping || 0) + ' ms'"></span>
            </div>
            <div class="flex justify-between p-3 rounded-xl bg-slate-900/60 border border-slate-800">
              <span class="text-slate-400" x-text="t('speedtest.total_tests')"></span>
              <span class="font-bold text-white font-mono" x-text="speedtestStats.total_tests || 0"></span>
            </div>
          </div>

          <div class="text-[11px] text-slate-500 text-center" x-text="t('speedtest.schedule_info')"></div>
        </div>

      </div>

    </div>

    <!-- =================================================================== -->
    <!-- TAB 5: CONTROLS, QR GUEST, AUTOMATIONS & NOTIFICATIONS -->
    <!-- =================================================================== -->
    <div x-show="currentTab === 'automations'" class="space-y-6 animate-fade-in" style="display: none;">
      
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- Smart Guest Wi-Fi & Dynamic QR Code -->
        <div class="glass-panel rounded-2xl p-6 space-y-5">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
              <h3 class="text-base font-bold text-white" x-text="t('controls.guest_title')"></h3>
              <button @click="openContextHelp('automations')" class="text-slate-500 hover:text-sky-400" :title="t('header.quick_help')">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              </button>
            </div>
            <button 
              @click="toggleGuestNetwork()"
              :class="guestNetwork.enabled ? 'bg-emerald-500 text-white' : 'bg-slate-800 text-slate-400'"
              class="px-3 py-1 rounded-full text-xs font-bold transition">
              <span x-text="guestNetwork.enabled ? t('controls.enabled') : t('controls.disabled')"></span>
            </button>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-center">
            <!-- QR Code Display -->
            <div class="flex flex-col items-center justify-center p-4 rounded-xl bg-slate-900/80 border border-slate-800">
              <template x-if="guestQrCodeUrl">
                <img :src="guestQrCodeUrl" alt="WiFi QR Code" class="w-44 h-44 rounded-lg shadow-md border border-slate-700">
              </template>
              <template x-if="!guestQrCodeUrl">
                <div class="w-44 h-44 rounded-lg bg-slate-800 flex items-center justify-center text-xs text-slate-500 text-center p-2" x-text="t('controls.qr_disabled')">

              <p class="text-[11px] text-slate-400" x-text="t('device_modal.forwards_desc', {ip: (selectedDevice ? (selectedDevice.ip || 'IP') : 'IP')})"></p>
            </div>
          </div>

          <!-- Tabella Porte Aperte -->
          <div class="rounded-xl border border-slate-800 overflow-hidden bg-slate-900/40">
            <table class="w-full text-left text-xs border-collapse">
              <thead>
                <tr class="bg-slate-900/80 text-slate-400 border-b border-slate-800 text-[11px] uppercase font-semibold">
                  <th class="py-2.5 px-3" x-text="t('device_modal.col_desc')"></th>
                  <th class="py-2.5 px-3" x-text="t('device_modal.col_wan_port')"></th>
                  <th class="py-2.5 px-3" x-text="t('device_modal.col_lan_port')"></th>
                  <th class="py-2.5 px-3" x-text="t('device_modal.col_protocol')"></th>
                  <th class="py-2.5 px-3 text-right" x-text="t('device_modal.col_action')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800/60 font-mono">
                <template x-for="fwd in deviceForwards" :key="fwd.id">
                  <tr class="hover:bg-slate-800/30">
                    <td class="py-2.5 px-3 font-sans text-slate-200" x-text="fwd.description || 'Custom'"></td>
                    <td class="py-2.5 px-3 text-sky-400 font-bold" x-text="fwd.port_from"></td>
                    <td class="py-2.5 px-3 text-slate-300" x-text="fwd.port_to"></td>
                    <td class="py-2.5 px-3">
                      <span class="px-1.5 py-0.5 rounded text-[10px] uppercase font-bold bg-slate-800 text-indigo-400 border border-indigo-500/20" x-text="fwd.protocol || 'tcp'"></span>
                    </td>
                    <td class="py-2.5 px-3 text-right font-sans">
                      <button 
                        @click="deleteDevicePortForward(fwd.id)"
                        class="p-1 rounded text-slate-400 hover:text-rose-400 hover:bg-rose-950/40 transition"
                        :title="t('device_modal.delete_forward_title')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                      </button>
                    </td>
                  </tr>
                </template>
                <template x-if="deviceForwards.length === 0">
                  <tr>
                    <td colspan="5" class="py-4 text-center text-slate-500 font-sans text-xs" x-text="t('device_modal.no_forwards')"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- Form Nuova Regola -->
          <div class="p-3.5 rounded-xl bg-slate-900/60 border border-slate-800 space-y-3">
            <div class="font-bold text-white text-xs" x-text="t('device_modal.add_forward_title')"></div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
              <div>
                <label class="block text-slate-400 text-[11px] mb-1" x-text="t('device_modal.wan_port_label')"></label>
                <input type="number" x-model="newPortForward.port_from" placeholder="es. 8080" class="glass-input w-full px-2.5 py-1.5 rounded-lg font-mono text-xs">
              </div>
              <div>
                <label class="block text-slate-400 text-[11px] mb-1" x-text="t('device_modal.lan_port_label')"></label>
                <input type="number" x-model="newPortForward.port_to" placeholder="es. 80" class="glass-input w-full px-2.5 py-1.5 rounded-lg font-mono text-xs">
              </div>
              <div>
                <label class="block text-slate-400 text-[11px] mb-1" x-text="t('device_modal.protocol_label')"></label>
                <select x-model="newPortForward.protocol" class="glass-input w-full px-2 py-1.5 rounded-lg text-xs">
                  <option value="tcp">TCP</option>
                  <option value="udp">UDP</option>
                  <option value="both">Both (TCP/UDP)</option>
                </select>
              </div>
              <div>
                <label class="block text-slate-400 text-[11px] mb-1" x-text="t('device_modal.service_label')"></label>
                <input type="text" x-model="newPortForward.description" :placeholder="t('device_modal.service_placeholder')" class="glass-input w-full px-2.5 py-1.5 rounded-lg text-xs">
              </div>
            </div>
            <button 
              @click="addDevicePortForward()"
              :disabled="!newPortForward.port_from || !newPortForward.port_to"
              class="w-full py-2 rounded-xl bg-sky-600 hover:bg-sky-500 disabled:opacity-40 text-white text-xs font-bold transition shadow-md shadow-sky-600/20"
              x-text="t('device_modal.create_forward_btn')">
            </button>
          </div>

        </div>

      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-between pt-3 border-t border-slate-800">
        <button @click="showDeviceModal = false" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300" x-text="t('device_modal.close_btn')"></button>
        <template x-if="deviceDetailTab === 'general'">
          <button @click="saveDeviceMetadata()" class="px-5 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-xs font-bold text-white shadow-lg shadow-sky-600/30" x-text="t('device_modal.save_metadata_btn')"></button>
        </template>
      </div>

    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- MODAL: CONTEXTUAL HELP & QUICK MANUAL POPUP -->
  <!-- ===================================================================== -->
  <div 
    x-show="showHelpModal" 
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm"
    style="display: none;"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100">
    
    <div @click.away="showHelpModal = false" class="glass-panel-elevated w-full max-w-2xl rounded-2xl p-6 space-y-4 max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-sky-400" x-text="helpModalTitle"></h3>
        <button @click="showHelpModal = false" class="text-slate-400 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="overflow-y-auto manual-content text-xs pr-2" x-html="helpModalContent"></div>
      <div class="pt-3 border-t border-slate-800 flex justify-end">
        <button @click="showHelpModal = false" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300" x-text="t('manual.close_guide')"></button>
      </div>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- LOGIN & 2FA OTP MODAL (WHEN NOT AUTHENTICATED) -->
  <!-- ===================================================================== -->
  <template x-if="!isAuthenticated">
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
      <div class="glass-panel-elevated w-full max-w-md rounded-3xl p-8 space-y-6 text-center border border-sky-500/20">
        
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 mx-auto flex items-center justify-center shadow-xl shadow-sky-500/30">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>

        <div>
          <h2 class="text-xl font-bold text-white" x-text="t('auth.title')"></h2>
          <p class="text-xs text-slate-400 mt-1" x-text="t('auth.subtitle')"></p>
        </div>

        <!-- Step 1: Email/Phone Input -->
        <div x-show="!otpSent" class="space-y-4 text-left">
          <div>
            <label class="block text-xs text-slate-400 mb-1" x-text="t('auth.identifier_label')"></label>
            <input 
              type="text" 
              x-model="loginIdentifier" 
              :placeholder="t('auth.identifier_placeholder')" 
              class="glass-input w-full px-4 py-3 rounded-xl text-sm font-medium">
          </div>
          <button 
            @click="requestOtp()"
            :disabled="authLoading || !loginIdentifier"
            class="w-full py-3 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-sm shadow-lg shadow-sky-600/30 transition disabled:opacity-50">
            <span x-text="authLoading ? t('auth.sending_otp') : t('auth.send_otp')"></span>
          </button>
        </div>

        <!-- Step 2: OTP Verification Input -->
        <div x-show="otpSent" class="space-y-4 text-left" style="display: none;">
          <div>
            <label class="block text-xs text-slate-400 mb-1" x-text="t('auth.otp_label')"></label>
            <input 
              type="text" 
              x-model="otpCode" 
              placeholder="123456" 
              maxlength="8"
              class="glass-input w-full px-4 py-3 rounded-xl text-center text-lg font-mono tracking-widest font-bold">
          </div>
          <button 
            @click="verifyOtp()"
            :disabled="authLoading || !otpCode"
            class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-lg shadow-emerald-600/30 transition disabled:opacity-50">
            <span x-text="authLoading ? t('auth.verifying_otp') : t('auth.verify_otp')"></span>
          </button>
          <button @click="otpSent = false" class="w-full text-center text-xs text-slate-400 hover:text-white">← Modifica numero o email</button>
        </div>

        <!-- Demo Mode Quick Start Button -->
        <div class="pt-4 border-t border-slate-800">
          <button 
            @click="startDemoSession()"
            class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-amber-400 border border-amber-500/20 transition">
            ✨ <span x-text="t('demo_mode')"></span>
          </button>
        </div>

      </div>
    </div>
  </template>

  <!-- ===================================================================== -->
  <!-- TOAST ALERTS NOTIFICATIONS -->
  <!-- ===================================================================== -->
  <div class="fixed bottom-6 right-6 z-50 space-y-2 pointer-events-none">
    <template x-for="toast in toasts" :key="toast.id">
      <div 
        class="pointer-events-auto max-w-sm rounded-xl p-4 shadow-2xl border backdrop-blur-xl flex items-start space-x-3 transition-all animate-fade-in"
        :class="{
          'bg-emerald-950/90 border-emerald-500/40 text-emerald-100': toast.type === 'success',
          'bg-rose-950/90 border-rose-500/40 text-rose-100': toast.type === 'error',
          'bg-amber-950/90 border-amber-500/40 text-amber-100': toast.type === 'warning',
          'bg-slate-900/90 border-sky-500/40 text-slate-100': toast.type === 'info'
        }">
        <div class="flex-1">
          <div class="text-xs font-bold" x-text="toast.title"></div>
          <div class="text-xs mt-0.5 opacity-90" x-text="toast.message"></div>
        </div>
      </div>
    </template>
  </div>

  <!-- ===================================================================== -->
  <!-- MODAL: CHANGELOG & RELEASE NOTES POPUP -->
  <!-- ===================================================================== -->
  <div 
    x-show="showChangelogModal" 
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm"
    style="display: none;"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100">
    
    <div @click.away="showChangelogModal = false" class="glass-panel-elevated w-full max-w-2xl rounded-2xl p-6 space-y-4 max-h-[85vh] flex flex-col border border-sky-500/30 shadow-2xl shadow-sky-950/50">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center space-x-2.5">
          <div class="p-2 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 text-white shadow-md shadow-sky-500/20">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          </div>
          <div>
            <h3 class="text-base font-bold text-white" x-text="t('changelog_modal.title')"></h3>
            <span class="text-[11px] text-slate-400">Release Notes & Version History</span>
          </div>
        </div>
        <button @click="showChangelogModal = false" class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      
      <div x-show="changelogLoading" class="py-12 text-center text-slate-400">
        <svg class="w-6 h-6 animate-spin mx-auto mb-2 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        Loading...
      </div>

      <div x-show="!changelogLoading" class="overflow-y-auto manual-content text-xs pr-2 space-y-2 select-text" x-html="changelogContent"></div>
      
      <div class="pt-3 border-t border-slate-800 flex justify-between items-center">
        <span class="text-[11px] text-slate-500">Version: <strong class="text-sky-400 font-mono" x-text="'v' + changelogVersion"></strong></span>
        <button @click="showChangelogModal = false" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 transition" x-text="t('changelog_modal.close')"></button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="mt-auto border-t border-slate-800/80 py-4 px-4 bg-[#0b0f17]/80">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between text-[11px] text-slate-500 font-medium gap-2">
      <div x-text="t('footer.text')"></div>
      <div class="flex items-center space-x-3">
        <button @click="openChangelogModal()" class="text-sky-400 hover:text-sky-300 font-mono transition flex items-center space-x-1 cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          <span>v1.02.01 <span x-text="t('footer.changelog')"></span></span>
        </button>
      </div>
    </div>
  </footer>

</body>
</html>
