  <!-- ===================================================================== -->
  <!-- MODAL: AUTO-UPDATE (1-CLICK & TERMINAL GUIDE - v1.04.00) -->
  <!-- ===================================================================== -->
  <div 
    x-show="showUpdateModal" 
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md"
    style="display: none;"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 scale-100"
    x-transition:leave-end="opacity-0 scale-95">
    
    <div @click.away="!isTriggeringUpdate && (showUpdateModal = false)" class="glass-panel-elevated w-full max-w-2xl rounded-2xl p-6 space-y-5 border border-amber-500/30 shadow-2xl shadow-amber-950/30 flex flex-col relative overflow-hidden">
      
      <!-- Live Progress Overlay during Update -->
      <div 
        x-show="isTriggeringUpdate" 
        class="absolute inset-0 z-20 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center space-y-4"
        style="display: none;">
        <div class="relative flex items-center justify-center">
          <div class="w-16 h-16 rounded-full border-4 border-amber-500/20 border-t-amber-400 animate-spin"></div>
          <span class="absolute text-2xl">⚡</span>
        </div>
        <div>
          <h4 class="text-base font-bold text-white mb-1" x-text="t('update_modal.updating_title')"></h4>
          <p class="text-xs text-amber-300/90 font-mono" x-text="updateProgressMsg"></p>
        </div>
        <p class="text-[11px] text-slate-400 max-w-sm" x-text="t('update_modal.updating_desc')"></p>
      </div>

      <!-- Modal Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3 gap-3">
        <div class="flex items-center space-x-3 min-w-0">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg shrink-0 transition"
               :class="updateInfo.update_available ? 'bg-amber-500/20 border border-amber-500/30 text-amber-500 dark:text-amber-400' : 'bg-emerald-500/20 border border-emerald-500/30 text-emerald-500 dark:text-emerald-400'">
            <span x-text="updateInfo.update_available ? '🚀' : '✨'"></span>
          </div>
          <div class="min-w-0">
            <h3 class="text-base font-bold text-slate-900 dark:text-white flex items-center space-x-2">
              <span x-text="updateInfo.update_available ? t('update_modal.title') : t('update_modal.title_up_to_date')"></span>
              <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold font-mono whitespace-nowrap shrink-0 transition"
                    :class="updateInfo.update_available ? 'bg-amber-50 text-amber-700 border border-amber-200 dark:bg-amber-500/20 dark:text-amber-300 dark:border-amber-500/30' : 'bg-emerald-50 text-emerald-700 border border-emerald-200 dark:bg-emerald-500/20 dark:text-emerald-300 dark:border-emerald-500/30'"
                    x-text="'v' + (updateInfo.update_available ? (updateInfo.latest_full_version || updateInfo.latest_version || fullVersion) : fullVersion)"></span>
            </h3>
            <p class="text-xs text-slate-500 dark:text-slate-400" x-text="updateInfo.update_available ? t('update_modal.subtitle') : t('update_modal.subtitle_up_to_date')"></p>
          </div>
        </div>
        <div class="flex items-center space-x-2 self-end sm:self-auto shrink-0">
          <button 
            @click="checkForUpdates(true)" 
            :disabled="isCheckingUpdate || isTriggeringUpdate"
            class="px-2.5 py-1 rounded-lg bg-white hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-transparent text-xs font-semibold flex items-center space-x-1 shadow-sm dark:shadow-none transition disabled:opacity-40 cursor-pointer"
            :title="t('settings_updates.recheck_title')">
            <svg class="w-3.5 h-3.5" :class="isCheckingUpdate ? 'animate-spin text-amber-500' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            <span x-text="isCheckingUpdate ? t('settings_updates.checking') : t('settings_updates.recheck_short')"></span>
          </button>
          <button 
            @click="showUpdateModal = false" 
            :disabled="isTriggeringUpdate"
            class="text-slate-500 hover:text-slate-900 dark:hover:text-white p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition disabled:opacity-30 cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      </div>

      <!-- Up to Date Status Banner (when no newer version is needed) -->
      <template x-if="!updateInfo.update_available">
        <div class="p-3.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-xs flex items-center space-x-3">
          <span class="text-emerald-500 dark:text-emerald-400 text-xl">✅</span>
          <div class="space-y-0.5">
            <span class="font-bold text-emerald-800 dark:text-emerald-300 block" x-text="t('settings_updates.up_to_date_title')"></span>
            <p class="text-slate-600 dark:text-slate-400 leading-relaxed" x-text="t('settings_updates.up_to_date_desc', { installed: fullVersion, latest: (updateInfo.latest_full_version || updateInfo.latest_version || fullVersion) })"></p>
          </div>
        </div>
      </template>

      <!-- Version Diff Box -->
      <div class="grid grid-cols-2 gap-3 p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 text-xs">
        <div>
          <span class="text-slate-500 dark:text-slate-400 block text-[11px]" x-text="t('update_modal.current_version')"></span>
          <span class="font-mono text-slate-900 dark:text-slate-300 font-bold text-sm" x-text="'v' + fullVersion"></span>
        </div>
        <div>
          <span class="text-slate-500 dark:text-slate-400 block text-[11px]" x-text="updateInfo.update_available ? t('update_modal.new_version') : t('update_modal.latest_release')"></span>
          <span class="font-mono font-bold text-sm"
                :class="updateInfo.update_available ? 'text-amber-600 dark:text-amber-400' : 'text-slate-700 dark:text-slate-300'"
                x-text="'v' + (updateInfo.latest_full_version || updateInfo.latest_version || fullVersion)"></span>
        </div>
      </div>

      <!-- Condensed Changelog Highlights in Modal -->
      <template x-if="updateInfo.condensed_changelog && updateInfo.condensed_changelog.length">
        <div class="space-y-2 p-3.5 rounded-xl bg-amber-500/10 border border-amber-500/25">
          <div class="flex items-center justify-between">
            <label class="block text-amber-900 dark:text-amber-300 text-xs font-bold uppercase tracking-wider flex items-center space-x-1.5">
              <span x-text="t('update_modal.condensed_changelog_title')"></span>
            </label>
            <button 
              @click="toggleFullReleaseNotes()" 
              class="text-[11px] text-amber-700 dark:text-amber-300 hover:underline font-medium cursor-pointer"
              x-text="showFullReleaseNotes ? t('update_modal.hide_full_notes') : t('update_modal.show_full_notes')">
            </button>
          </div>
          <div class="grid grid-cols-1 gap-1.5 text-xs">
            <template x-for="(item, idx) in updateInfo.condensed_changelog" :key="idx">
              <div class="flex items-start space-x-2 text-slate-800 dark:text-slate-200">
                <span class="text-amber-500 dark:text-amber-400 font-bold shrink-0">•</span>
                <span class="leading-snug" x-text="item"></span>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Release Notes Box (Collapsible or Fallback) -->
      <template x-if="(updateInfo.release_notes || updateInfo.release_title) && (showFullReleaseNotes || !updateInfo.condensed_changelog || !updateInfo.condensed_changelog.length)">
        <div class="space-y-1.5">
          <div class="flex items-center justify-between">
            <label class="block text-slate-700 dark:text-slate-400 text-xs font-semibold" x-text="updateInfo.update_available ? t('update_modal.release_notes') : t('update_modal.latest_notes_title')"></label>
            <template x-if="updateInfo.condensed_changelog && updateInfo.condensed_changelog.length">
              <button 
                @click="toggleFullReleaseNotes()" 
                class="text-[11px] text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 hover:underline font-medium cursor-pointer"
                x-text="t('update_modal.hide_full_notes')">
              </button>
            </template>
          </div>
          <div class="max-h-36 overflow-y-auto p-3 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 text-xs text-slate-800 dark:text-slate-300 font-mono whitespace-pre-wrap leading-relaxed" x-text="updateInfo.release_notes || updateInfo.release_title"></div>
        </div>
      </template>

      <!-- Supported Methods & Environment Detection -->
      <div class="space-y-3 pt-2 border-t border-slate-200 dark:border-slate-800">
        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400" x-text="t('update_modal.methods_title')"></h4>

        <!-- Method 1: Docker Socket Detected -->
        <template x-if="updateInfo.docker_socket_available">
          <div class="flex items-start space-x-3 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30">
            <span class="text-emerald-500 dark:text-emerald-400 text-base">🟢</span>
            <div class="text-xs space-y-0.5">
              <span class="font-bold text-emerald-800 dark:text-emerald-300" x-text="t('update_modal.socket_detected')"></span>
              <p class="text-slate-600 dark:text-slate-400 leading-relaxed" x-text="t('update_modal.socket_desc')"></p>
            </div>
          </div>
        </template>

        <!-- Method 2: Watchtower Configured -->
        <template x-if="updateInfo.watchtower_configured && !updateInfo.docker_socket_available">
          <div class="flex items-start space-x-3 p-3 rounded-xl bg-sky-500/10 border border-sky-500/30">
            <span class="text-sky-500 dark:text-sky-400 text-base">🛰️</span>
            <div class="text-xs space-y-0.5">
              <span class="font-bold text-sky-800 dark:text-sky-300" x-text="t('update_modal.watchtower_detected')"></span>
              <p class="text-slate-600 dark:text-slate-400 leading-relaxed" x-text="t('update_modal.watchtower_desc')"></p>
            </div>
          </div>
        </template>

        <!-- Method 3: Manual Terminal Command -->
        <div class="space-y-1.5">
          <span class="text-[11px] text-slate-600 dark:text-slate-400 font-medium" x-text="t('update_modal.manual_title')"></span>
          <div class="flex items-center space-x-2">
            <code class="flex-1 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-amber-800 dark:text-amber-300 px-3 py-2 rounded-xl font-mono text-xs select-all overflow-x-auto" x-text="updateInfo.cli_command || 'docker compose pull && docker compose up -d'"></code>
            <button 
              @click="copyCliCommand()" 
              class="px-3 py-2 rounded-xl bg-white hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-transparent shadow-sm dark:shadow-none text-xs font-semibold transition flex items-center space-x-1 shrink-0 cursor-pointer"
              :class="copiedCliCommand ? 'text-emerald-600 dark:text-emerald-400' : ''">
              <span x-text="copiedCliCommand ? '✓ ' + t('update_modal.copied') : t('update_modal.copy_command')"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Modal Actions -->
      <div class="pt-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <a 
          :href="updateInfo.release_url || 'https://github.com/EnricoFlammini/Dashboard_EERO/releases'" 
          target="_blank" 
          rel="noopener" 
          class="text-xs text-sky-600 hover:text-sky-700 dark:text-sky-400 dark:hover:text-sky-300 font-medium flex items-center space-x-1">
          <span>GitHub Releases</span>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
        </a>

        <div class="flex items-center space-x-3">
          <button 
            @click="showUpdateModal = false" 
            class="px-4 py-2 rounded-xl bg-white hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-transparent shadow-sm dark:shadow-none transition cursor-pointer"
            x-text="t('update_modal.cancel')">
          </button>

          <template x-if="updateInfo.can_auto_install && currentUser && (currentUser.is_admin || currentUser.role === 'admin')">
            <button 
              @click="triggerAutoUpdate()" 
              :disabled="isTriggeringUpdate"
              class="px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-xs font-bold text-slate-950 shadow-lg shadow-amber-500/20 transition flex items-center space-x-1.5 active:scale-95 disabled:opacity-50 cursor-pointer">
              <span x-text="updateInfo.update_available ? t('update_modal.install_now_btn') : t('settings_updates.repull_btn')"></span>
            </button>
          </template>
        </div>
      </div>

    </div>
  </div>
