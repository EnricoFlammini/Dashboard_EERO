  <!-- ===================================================================== -->
  <!-- MODAL: DATA USAGE ESTIMATION & EXPLANATION POPUP -->
  <!-- ===================================================================== -->
  <div 
    x-show="showUsageInfoModal" 
    class="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm"
    style="display: none;"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100">
    
    <div @click.away="showUsageInfoModal = false" class="glass-panel-elevated w-full max-w-lg rounded-2xl p-6 space-y-4 max-h-[85vh] flex flex-col border border-sky-500/30 shadow-2xl shadow-sky-950/40 text-slate-800 dark:text-slate-200">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
        <div class="flex items-center space-x-2">
          <span class="w-7 h-7 rounded-xl bg-sky-500/10 text-sky-500 flex items-center justify-center border border-sky-500/20">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </span>
          <h3 class="text-sm font-bold text-slate-900 dark:text-white" x-text="t('device_modal.usage_info_modal_title')"></h3>
        </div>
        <button @click="showUsageInfoModal = false" class="text-slate-400 hover:text-slate-700 dark:hover:text-white p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="overflow-y-auto space-y-3 text-xs pr-1 leading-relaxed">
        
        <div class="p-3 rounded-xl bg-sky-50 dark:bg-sky-950/40 border border-sky-200 dark:border-sky-800/60">
          <div class="font-bold text-sky-700 dark:text-sky-300 mb-1" x-text="t('device_modal.usage_info_p1_title')"></div>
          <p class="text-slate-600 dark:text-slate-400" x-text="t('device_modal.usage_info_p1_desc')"></p>
        </div>

        <div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60">
          <div class="font-bold text-amber-700 dark:text-amber-300 mb-1" x-text="t('device_modal.usage_info_p2_title')"></div>
          <p class="text-slate-600 dark:text-slate-400" x-text="t('device_modal.usage_info_p2_desc')"></p>
        </div>

        <div class="p-3 rounded-xl bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800/60">
          <div class="font-bold text-indigo-700 dark:text-indigo-300 mb-1" x-text="t('device_modal.usage_info_p3_title')"></div>
          <p class="text-slate-600 dark:text-slate-400" x-text="t('device_modal.usage_info_p3_desc')"></p>
        </div>

        <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/60">
          <div class="font-bold text-slate-800 dark:text-slate-200 mb-1" x-text="t('device_modal.usage_info_p4_title')"></div>
          <p class="text-slate-600 dark:text-slate-400" x-text="t('device_modal.usage_info_p4_desc')"></p>
        </div>

        <div class="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60">
          <div class="font-bold text-emerald-700 dark:text-emerald-300 mb-1" x-text="t('device_modal.usage_info_p5_title')"></div>
          <p class="text-slate-600 dark:text-slate-400" x-text="t('device_modal.usage_info_p5_desc')"></p>
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end">
        <button 
          @click="showUsageInfoModal = false" 
          class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-xs font-bold text-white shadow-md shadow-sky-600/30 transition cursor-pointer" 
          x-text="t('device_modal.usage_info_close_btn')">
        </button>
      </div>

    </div>
  </div>
