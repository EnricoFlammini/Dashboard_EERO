  <!-- ===================================================================== -->
  <!-- MODAL: LOCAL RBAC LOGIN (Module 3) -->
  <!-- ===================================================================== -->
  <div 
    x-show="showLocalLoginModal" 
    x-cloak
    @click.self="showLocalLoginModal = false"
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm"
    style="display: none;"
    role="dialog"
    aria-modal="true">
    
    <div class="glass-panel-elevated w-full max-w-md rounded-2xl p-6 space-y-5 border border-slate-200 dark:border-slate-800 shadow-2xl">
      <!-- Modal Header -->
      <div class="flex items-center justify-between border-b border-black/[0.06] dark:border-white/5 pb-3">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#0067c0] to-indigo-600 flex items-center justify-center text-white shadow-md shadow-sky-500/20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          </div>
          <div>
            <h3 class="text-base font-bold text-slate-900 dark:text-white" x-text="t('auth_local.login_title')"></h3>
            <p class="text-xs text-slate-500 dark:text-slate-400" x-text="t('auth_local.login_subtitle')"></p>
          </div>
        </div>
        <button @click="showLocalLoginModal = false" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-black/[0.05] dark:hover:bg-white/[0.05] transition cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Login Form -->
      <form @submit.prevent="performLocalLogin()" class="space-y-4 text-xs" autocomplete="off">
        <div>
          <label class="block text-slate-700 dark:text-slate-300 font-semibold mb-1" x-text="t('auth_local.username')"></label>
          <input type="text" x-model="localLoginData.username" required placeholder="" class="glass-input w-full px-3 py-2 rounded-xl font-medium focus:outline-none" autocomplete="off">
        </div>

        <div>
          <label class="block text-slate-700 dark:text-slate-300 font-semibold mb-1" x-text="t('auth_local.password')"></label>
          <input type="password" x-model="localLoginData.password" required placeholder="" class="glass-input w-full px-3 py-2 rounded-xl font-medium focus:outline-none" autocomplete="new-password">
        </div>

        <div class="flex items-center space-x-2 pt-1">
          <input type="checkbox" id="localLoginRememberMe" x-model="localLoginData.remember_me" class="rounded border-slate-300 dark:border-slate-700 text-[#0067c0] focus:ring-sky-500 w-4 h-4 cursor-pointer">
          <label for="localLoginRememberMe" class="text-slate-700 dark:text-slate-300 select-none cursor-pointer font-medium" x-text="t('auth_local.remember_me')"></label>
        </div>

        <template x-if="localLoginData.error">
          <div class="p-2.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-600 dark:text-rose-400 text-xs font-semibold" x-text="localLoginData.error"></div>
        </template>

        <div class="pt-2 flex items-center justify-end space-x-2">
          <button type="button" @click="showLocalLoginModal = false" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 font-semibold text-slate-700 dark:text-slate-300 transition cursor-pointer" x-text="t('users_modal.cancel')"></button>
          <button type="submit" :disabled="isLocalAuthChecking" class="px-5 py-2 rounded-xl bg-[#0067c0] hover:bg-[#005299] text-white font-bold transition shadow-md shadow-sky-500/20 cursor-pointer disabled:opacity-50 flex items-center space-x-1.5">
            <span x-show="isLocalAuthChecking" class="animate-spin text-xs">⏳</span>
            <span x-text="isLocalAuthChecking ? t('auth_local.logging_in') : t('auth_local.login_btn')"></span>
          </button>
        </div>
      </form>
    </div>
  </div>
