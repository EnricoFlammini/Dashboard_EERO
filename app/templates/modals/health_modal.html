  <!-- ===================================================================== -->
  <!-- MODAL: HEALTH SCORE BREAKDOWN & DIAGNOSTICS (Issue #15) -->
  <!-- ===================================================================== -->
  <div 
    x-show="showHealthModal" 
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm"
    style="display: none;"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100">
    
    <div @click.away="showHealthModal = false" class="glass-panel-elevated w-full max-w-2xl rounded-2xl p-6 space-y-5 max-h-[90vh] flex flex-col border border-slate-300 dark:border-slate-700/80 shadow-2xl shadow-slate-950/40">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
        <div class="flex items-center space-x-3">
          <div class="p-2 rounded-xl text-white shadow-md"
               :class="healthScore >= 90 ? 'bg-gradient-to-tr from-emerald-600 to-teal-500 shadow-emerald-500/20' : (healthScore >= 70 ? 'bg-gradient-to-tr from-amber-600 to-yellow-500 shadow-amber-500/20' : 'bg-gradient-to-tr from-rose-600 to-red-500 shadow-rose-500/20')">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
          </div>
          <div>
            <h3 class="text-base font-bold text-slate-900 dark:text-white" x-text="t('health_modal.title')"></h3>
            <span class="text-[11px] text-slate-500 dark:text-slate-400" x-text="t('health_modal.subtitle')"></span>
          </div>
        </div>
        <button @click="showHealthModal = false" class="text-slate-400 hover:text-slate-700 dark:hover:text-white p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- Modal Body (Scrollable) -->
      <div class="overflow-y-auto pr-1 space-y-5 text-xs select-text">
        
        <!-- Score Hero Card -->
        <div class="p-4 rounded-2xl border flex flex-col sm:flex-row items-center sm:items-stretch justify-between gap-4"
             :class="healthScore >= 90 ? 'bg-emerald-500/10 border-emerald-500/30' : (healthScore >= 70 ? 'bg-amber-500/10 border-amber-500/30' : 'bg-rose-500/10 border-rose-500/30')">
          <div class="flex items-center space-x-4">
            <!-- Circular Gauge -->
            <div class="relative w-16 h-16 flex items-center justify-center shrink-0">
              <svg class="w-16 h-16 -rotate-90">
                <circle cx="32" cy="32" r="26" class="text-slate-200 dark:text-slate-800" stroke="currentColor" stroke-width="5" fill="none"></circle>
                <circle cx="32" cy="32" r="26" :stroke="healthScore >= 90 ? '#10b981' : (healthScore >= 70 ? '#f59e0b' : '#f43f5e')" stroke-width="5" fill="none" :stroke-dasharray="163.36" :stroke-dashoffset="163.36 - (163.36 * healthScore / 100)" stroke-linecap="round"></circle>
              </svg>
              <div class="absolute flex flex-col items-center justify-center">
                <span class="text-lg font-extrabold tracking-tight text-slate-900 dark:text-white" x-text="healthScore"></span>
                <span class="text-[9px] font-bold uppercase text-slate-400 -mt-1">/100</span>
              </div>
            </div>
            <div>
              <div class="flex items-center space-x-2">
                <span class="text-sm font-bold text-slate-900 dark:text-white" x-text="t('health_modal.score_label')"></span>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-wider"
                      :class="healthScore >= 90 ? 'bg-emerald-100 dark:bg-emerald-950/80 text-emerald-700 dark:text-emerald-400 border border-emerald-300 dark:border-emerald-600' : (healthScore >= 70 ? 'bg-amber-100 dark:bg-amber-950/80 text-amber-700 dark:text-amber-400 border border-amber-300 dark:border-amber-600' : 'bg-rose-100 dark:bg-rose-950/80 text-rose-700 dark:text-rose-400 border border-rose-300 dark:border-rose-600')"
                      x-text="healthScore >= 90 ? t('health_modal.status_optimal') : (healthScore >= 70 ? t('health_modal.status_good') : (healthScore >= 50 ? t('health_modal.status_warning') : t('health_modal.status_critical')))">
                </span>
              </div>
              <p class="text-[11px] text-slate-600 dark:text-slate-300 mt-1"
                 x-text="(healthDetails && healthDetails.status === 'optimal' && (!healthDetails.penalties || healthDetails.penalties.length === 0)) ? t('health_modal.no_penalties_desc') : t('health_modal.penalties_active_desc')">
              </p>
            </div>
          </div>
          <div class="flex items-center sm:self-center">
            <button 
              @click="refreshHealthDiagnostics()"
              :disabled="isRefreshing"
              class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-white/80 dark:bg-slate-800/80 hover:bg-white dark:hover:bg-slate-750 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 transition flex items-center space-x-1.5 cursor-pointer shadow-sm">
              <svg class="w-3.5 h-3.5" :class="isRefreshing ? 'animate-spin' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
              <span x-text="t('health_modal.refresh_diagnostics')"></span>
            </button>
          </div>
        </div>

        <!-- AI Network Diagnostics & Natural Language Summary (v1.6.0 Modulo 1) -->
        <template x-if="healthDetails && (healthDetails.ai_summary || (healthDetails.roaming_advisor && healthDetails.roaming_advisor.sticky_count > 0) || (healthDetails.iot_anomalies && healthDetails.iot_anomalies.length > 0))">
          <div class="p-4 rounded-2xl bg-gradient-to-br from-sky-500/10 via-indigo-500/5 to-purple-500/10 border border-sky-500/25 dark:border-sky-500/30 space-y-3.5 shadow-xs">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-2">
                <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-sky-500/20 text-sky-700 dark:text-sky-300 border border-sky-400/40 flex items-center space-x-1.5">
                  <svg class="w-3 h-3 shrink-0 text-sky-600 dark:text-sky-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.286L13 21l-2.286-6.857L5 12l5.714-2.286L13 3z"/></svg>
                  <span x-text="t('health_modal.ai_diagnostics_badge')"></span>
                </span>
                <h4 class="text-xs font-bold text-slate-900 dark:text-white" x-text="t('health_modal.ai_analysis_title')"></h4>
              </div>
            </div>

            <!-- Discursive Narrative -->
            <div class="space-y-2 text-[11px] leading-relaxed text-slate-700 dark:text-slate-300">
              <p class="font-medium" x-text="localized(healthDetails?.ai_summary, 'overview')"></p>
              <template x-if="localized(healthDetails?.ai_summary, 'narrative')">
                <div class="p-3 rounded-xl bg-black/5 dark:bg-white/5 border border-black/5 dark:border-white/5 text-[11px] space-y-1">
                  <div x-html="renderSimpleMarkdown(localized(healthDetails?.ai_summary, 'narrative'))"></div>
                </div>
              </template>
            </div>

            <!-- Roaming Advisor Highlight Card (Issue #43) -->
            <template x-if="healthDetails?.roaming_advisor && healthDetails.roaming_advisor.sticky_count > 0">
              <div class="p-3 rounded-xl bg-amber-500/10 border border-amber-500/25 space-y-2 text-amber-900 dark:text-amber-200">
                <div class="flex items-center justify-between text-xs font-bold">
                  <div class="flex items-center space-x-1.5">
                    <svg class="w-3.5 h-3.5 shrink-0 text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span x-text="t('health_modal.roaming_advisor_title')"></span>
                  </div>
                  <span class="px-2 py-0.5 rounded-full text-[10px] bg-amber-500/20 text-amber-800 dark:text-amber-300 font-bold font-mono" x-text="healthDetails.roaming_advisor.sticky_count + ' ' + t('common.devices')"></span>
                </div>
                <div class="space-y-1.5">
                  <template x-for="stk in (healthDetails.roaming_advisor.devices || [])" :key="stk.mac">
                    <div class="p-2 rounded-lg bg-white/60 dark:bg-slate-900/60 border border-amber-500/20 text-[11px] flex flex-col sm:flex-row sm:items-center justify-between gap-1.5">
                      <div>
                        <span class="font-bold text-slate-900 dark:text-white" x-text="stk.name"></span>
                        <span class="text-slate-500 dark:text-slate-400"> (</span><span class="font-mono text-rose-600 dark:text-rose-400 font-bold" x-text="stk.current_rssi + ' dBm'"></span><span class="text-slate-500 dark:text-slate-400" x-text="t('health_modal.rssi_on_node')"></span><span class="font-medium text-slate-700 dark:text-slate-300" x-text="stk.connected_eero_name"></span><span class="text-slate-500 dark:text-slate-400">)</span>
                      </div>
                      <div class="flex items-center space-x-1 text-emerald-700 dark:text-emerald-400 text-[10px] font-semibold">
                        <span x-text="t('health_modal.suggested_label')"></span>
                        <span class="font-bold text-slate-900 dark:text-white" x-text="(stk.suggested_eero_name_i18n && stk.suggested_eero_name_i18n[currentLanguage]) || stk.suggested_eero_name"></span>
                        <span class="text-emerald-600 dark:text-emerald-400 font-mono font-bold" x-text="'(+~' + stk.estimated_delta_dbm + ' dBm)'"></span>
                      </div>
                    </div>
                  </template>
                </div>
                <p class="text-[10px] opacity-80 italic" x-text="t('health_modal.force_roaming_tip')"></p>
              </div>
            </template>

            <!-- Night IoT Anomalies Alert Card -->
            <template x-if="healthDetails?.iot_anomalies && healthDetails.iot_anomalies.length > 0">
              <div class="p-3 rounded-xl bg-purple-500/10 border border-purple-500/25 space-y-2 text-purple-900 dark:text-purple-200">
                <div class="flex items-center justify-between text-xs font-bold">
                  <div class="flex items-center space-x-1.5">
                    <svg class="w-3.5 h-3.5 shrink-0 text-purple-600 dark:text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <span x-text="t('health_modal.iot_anomalies_title')"></span>
                  </div>
                  <span class="px-2 py-0.5 rounded-full text-[10px] bg-purple-500/20 text-purple-800 dark:text-purple-300 font-bold font-mono" x-text="healthDetails.iot_anomalies.length + ' ' + t('common.anomalies')"></span>
                </div>
                <div class="space-y-1.5">
                  <template x-for="anom in healthDetails.iot_anomalies" :key="anom.mac_address + anom.timestamp">
                    <div class="p-2 rounded-lg bg-white/60 dark:bg-slate-900/60 border border-purple-500/20 text-[11px] flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                      <div>
                        <span class="font-bold text-slate-900 dark:text-white" x-text="anom.hostname"></span>:
                        <span class="text-slate-600 dark:text-slate-300" x-text="localized(anom, 'description')"></span>
                      </div>
                      <span class="px-1.5 py-0.5 rounded font-mono font-bold text-[9px] uppercase self-start sm:self-auto shrink-0"
                            :class="anom.severity === 'critical' ? 'bg-rose-500/20 text-rose-700 dark:text-rose-400' : 'bg-amber-500/20 text-amber-700 dark:text-amber-400'"
                            x-text="anom.severity"></span>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <!-- Actionable Remediation Checklist -->
            <template x-if="healthDetails?.action_checklist && healthDetails.action_checklist.length > 0">
              <div class="space-y-2 pt-1 border-t border-sky-500/15 dark:border-sky-500/20">
                <div class="flex items-center justify-between">
                  <h5 class="text-[11px] font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200 flex items-center space-x-1.5">
                    <svg class="w-3.5 h-3.5 shrink-0 text-sky-600 dark:text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                    <span x-text="t('health_modal.action_checklist_title')"></span>
                  </h5>
                </div>
                <div class="grid grid-cols-1 gap-2">
                  <template x-for="item in healthDetails.action_checklist" :key="item.id">
                    <div class="p-2.5 rounded-xl bg-white/80 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 flex items-start space-x-2.5 text-[11px]">
                      <span class="px-1.5 py-0.5 rounded font-mono font-bold text-[9px] uppercase shrink-0 mt-0.5"
                            :class="{
                               'bg-rose-500/15 text-rose-700 dark:text-rose-400 border border-rose-400/30': item.priority === 'critical',
                               'bg-amber-500/15 text-amber-700 dark:text-amber-400 border border-amber-400/30': item.priority === 'high',
                               'bg-sky-500/15 text-sky-700 dark:text-sky-400 border border-sky-400/30': item.priority === 'medium',
                               'bg-emerald-500/15 text-emerald-700 dark:text-emerald-400 border border-emerald-400/30': item.priority === 'low'
                            }"
                            x-text="item.priority === 'critical' ? t('health_modal.priority_critical') : (item.priority === 'high' ? t('health_modal.priority_high') : (item.priority === 'medium' ? t('health_modal.priority_medium') : t('health_modal.priority_low')))">
                      </span>
                      <div class="space-y-0.5">
                        <div class="font-bold text-slate-900 dark:text-white" x-text="localized(item, 'title')"></div>
                        <div class="text-slate-600 dark:text-slate-400 text-[10.5px]" x-text="localized(item, 'description')"></div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>

          </div>
        </template>

        <!-- Section 1: Active Penalties / Impact Factors (Issue #15 Core) -->
        <div class="space-y-2.5">
          <div class="flex items-center justify-between">
            <h4 class="text-[11px] font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 flex items-center space-x-1.5">
              <svg class="w-3.5 h-3.5 shrink-0 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
              <span x-text="t('health_modal.penalties_title')"></span>
            </h4>
            <span class="text-[10px] text-slate-500" x-text="healthDetails && healthDetails.penalties ? healthDetails.penalties.length + ' ' + t('health_modal.detected') : '0'"></span>
          </div>

          <!-- If No Penalties -->
          <template x-if="!healthDetails || !healthDetails.penalties || healthDetails.penalties.length === 0">
            <div class="p-3.5 rounded-xl bg-emerald-500/10 border border-emerald-500/25 flex items-center space-x-3 text-emerald-800 dark:text-emerald-300">
              <div class="w-6 h-6 rounded-lg bg-emerald-500/20 flex items-center justify-center shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              </div>
              <div>
                <div class="font-bold text-xs" x-text="t('health_modal.no_penalties_title')"></div>
                <div class="text-[11px] opacity-80" x-text="t('health_modal.no_penalties_desc')"></div>
              </div>
            </div>
          </template>

          <!-- If Penalties Exist -->
          <div class="space-y-2" x-show="healthDetails && healthDetails.penalties && healthDetails.penalties.length > 0">
            <template x-for="p in (healthDetails?.penalties || [])" :key="p.id">
              <div class="p-3.5 rounded-xl border flex flex-col space-y-2 transition"
                   :class="p.severity === 'critical' ? 'bg-rose-50 dark:bg-rose-950/30 border-rose-300 dark:border-rose-700/50 text-rose-900 dark:text-rose-200' : (p.severity === 'warning' ? 'bg-amber-50 dark:bg-amber-950/30 border-amber-300 dark:border-amber-700/50 text-amber-900 dark:text-amber-200' : 'bg-sky-50 dark:bg-sky-950/30 border-sky-300 dark:border-sky-700/50 text-sky-900 dark:text-sky-200')">
                <div class="flex items-center justify-between">
                  <div class="flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full shrink-0"
                          :class="p.severity === 'critical' ? 'bg-rose-500 ring-2 ring-rose-500/20' : (p.severity === 'warning' ? 'bg-amber-500 ring-2 ring-amber-500/20' : 'bg-sky-500 ring-2 ring-sky-500/20')">
                    </span>
                    <span class="font-bold text-xs" x-text="getHealthPenaltyTitle(p)"></span>
                  </div>
                  <span class="px-2 py-0.5 rounded-md font-mono text-[11px] font-bold"
                        :class="p.severity === 'critical' ? 'bg-rose-200 dark:bg-rose-900 text-rose-800 dark:text-rose-200' : (p.severity === 'warning' ? 'bg-amber-200 dark:bg-amber-900 text-amber-800 dark:text-amber-200' : 'bg-sky-200 dark:bg-sky-900 text-sky-800 dark:text-sky-200')"
                        x-text="p.impact + ' ' + t('health_modal.points')">
                  </span>
                </div>
                <div class="text-[11px] text-slate-700 dark:text-slate-300" x-text="getHealthPenaltyDesc(p)"></div>
                
                <!-- Affected items tags -->
                <template x-if="(p.affected_items_i18n && p.affected_items_i18n[currentLanguage]) || (p.affected_items && p.affected_items.length > 0)">
                  <div class="flex flex-wrap gap-1.5 pt-1">
                    <template x-for="(item, idx) in ((p.affected_items_i18n && p.affected_items_i18n[currentLanguage]) || p.affected_items)" :key="idx">
                      <span class="px-2 py-0.5 rounded-md bg-black/5 dark:bg-white/10 font-mono text-[10px] text-slate-800 dark:text-slate-200 border border-black/10 dark:border-white/10" x-text="item"></span>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>

        <!-- Section 2: Health Pillars (4 Pilastri) -->
        <div class="space-y-2.5">
          <h4 class="text-[11px] font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 flex items-center space-x-1.5">
            <svg class="w-3.5 h-3.5 shrink-0 text-slate-500 dark:text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            <span x-text="t('health_modal.pillars_title')"></span>
          </h4>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            
            <!-- Pillar 1: Mesh Topology -->
            <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/70 border border-slate-200 dark:border-slate-800 space-y-2">
              <div class="flex items-center justify-between">
                <span class="font-bold text-slate-900 dark:text-white flex items-center space-x-1.5">
                  <svg class="w-3.5 h-3.5 shrink-0 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                  <span x-text="t('health_modal.pillar_mesh')"></span>
                </span>
                <span class="font-mono font-bold text-xs" :class="(healthDetails?.pillars?.mesh_topology?.score || 40) >= 35 ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-400'" x-text="(healthDetails?.pillars?.mesh_topology?.score ?? 40) + ' / ' + (healthDetails?.pillars?.mesh_topology?.max_score ?? 40)"></span>
              </div>
              <div class="w-full bg-slate-200 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                <div class="h-2 rounded-full transition-all duration-500"
                     :class="(healthDetails?.pillars?.mesh_topology?.score || 40) >= 35 ? 'bg-emerald-500' : ((healthDetails?.pillars?.mesh_topology?.score || 40) >= 20 ? 'bg-amber-500' : 'bg-rose-500')"
                     :style="'width: ' + (((healthDetails?.pillars?.mesh_topology?.score ?? 40) / (healthDetails?.pillars?.mesh_topology?.max_score ?? 40)) * 100) + '%'"></div>
              </div>
              <div class="text-[11px] text-slate-600 dark:text-slate-400" x-text="getHealthPillarSummary('mesh_topology')"></div>
            </div>

            <!-- Pillar 2: WAN Gateway -->
            <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/70 border border-slate-200 dark:border-slate-800 space-y-2">
              <div class="flex items-center justify-between">
                <span class="font-bold text-slate-900 dark:text-white flex items-center space-x-1.5">
                  <svg class="w-3.5 h-3.5 shrink-0 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                  <span x-text="t('health_modal.pillar_wan')"></span>
                </span>
                <span class="font-mono font-bold text-xs" :class="(healthDetails?.pillars?.wan_gateway?.score || 30) >= 25 ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-400'" x-text="(healthDetails?.pillars?.wan_gateway?.score ?? 30) + ' / ' + (healthDetails?.pillars?.wan_gateway?.max_score ?? 30)"></span>
              </div>
              <div class="w-full bg-slate-200 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                <div class="h-2 rounded-full transition-all duration-500"
                     :class="(healthDetails?.pillars?.wan_gateway?.score || 30) >= 25 ? 'bg-emerald-500' : ((healthDetails?.pillars?.wan_gateway?.score || 30) >= 15 ? 'bg-amber-500' : 'bg-rose-500')"
                     :style="'width: ' + (((healthDetails?.pillars?.wan_gateway?.score ?? 30) / (healthDetails?.pillars?.wan_gateway?.max_score ?? 30)) * 100) + '%'"></div>
              </div>
              <div class="text-[11px] text-slate-600 dark:text-slate-400" x-text="getHealthPillarSummary('wan_gateway')"></div>
            </div>

            <!-- Pillar 3: Client Signal -->
            <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/70 border border-slate-200 dark:border-slate-800 space-y-2">
              <div class="flex items-center justify-between">
                <span class="font-bold text-slate-900 dark:text-white flex items-center space-x-1.5">
                  <svg class="w-3.5 h-3.5 shrink-0 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path></svg>
                  <span x-text="t('health_modal.pillar_signal')"></span>
                </span>
                <span class="font-mono font-bold text-xs" :class="(healthDetails?.pillars?.client_signal?.score || 20) >= 18 ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-400'" x-text="(healthDetails?.pillars?.client_signal?.score ?? 20) + ' / ' + (healthDetails?.pillars?.client_signal?.max_score ?? 20)"></span>
              </div>
              <div class="w-full bg-slate-200 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                <div class="h-2 rounded-full transition-all duration-500"
                     :class="(healthDetails?.pillars?.client_signal?.score || 20) >= 18 ? 'bg-emerald-500' : ((healthDetails?.pillars?.client_signal?.score || 20) >= 10 ? 'bg-amber-500' : 'bg-rose-500')"
                     :style="'width: ' + (((healthDetails?.pillars?.client_signal?.score ?? 20) / (healthDetails?.pillars?.client_signal?.max_score ?? 20)) * 100) + '%'"></div>
              </div>
              <div class="text-[11px] text-slate-600 dark:text-slate-400" x-text="getHealthPillarSummary('client_signal')"></div>
            </div>

            <!-- Pillar 4: Channels & Frequency -->
            <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/70 border border-slate-200 dark:border-slate-800 space-y-2">
              <div class="flex items-center justify-between">
                <span class="font-bold text-slate-900 dark:text-white flex items-center space-x-1.5">
                  <svg class="w-3.5 h-3.5 shrink-0 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.636 18.364a9 9 0 010-12.728m12.728 0a9 9 0 010 12.728m-9.9-2.828a5 5 0 010-7.072m7.072 0a5 5 0 010 7.072M13 12a1 1 0 11-2 0 1 1 0 012 0z"></path></svg>
                  <span x-text="t('health_modal.pillar_channels')"></span>
                </span>
                <span class="font-mono font-bold text-xs" :class="(healthDetails?.pillars?.channel_density?.score || 10) >= 8 ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-400'" x-text="(healthDetails?.pillars?.channel_density?.score ?? 10) + ' / ' + (healthDetails?.pillars?.channel_density?.max_score ?? 10)"></span>
              </div>
              <div class="w-full bg-slate-200 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                <div class="h-2 rounded-full transition-all duration-500"
                     :class="(healthDetails?.pillars?.channel_density?.score || 10) >= 8 ? 'bg-emerald-500' : 'bg-amber-500'"
                     :style="'width: ' + (((healthDetails?.pillars?.channel_density?.score ?? 10) / (healthDetails?.pillars?.channel_density?.max_score ?? 10)) * 100) + '%'"></div>
              </div>
              <div class="text-[11px] text-slate-600 dark:text-slate-400" x-text="getHealthPillarSummary('channel_density')"></div>
            </div>

          </div>
        </div>

        <!-- Section 3: Smart Recommendations -->
        <div class="space-y-2" x-show="healthDetails && healthDetails.recommendations && healthDetails.recommendations.length > 0">
          <h4 class="text-[11px] font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 flex items-center space-x-1.5">
            <svg class="w-3.5 h-3.5 shrink-0 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
            <span x-text="t('health_modal.recommendations_title')"></span>
          </h4>
          <div class="p-3.5 rounded-xl bg-sky-50/70 dark:bg-sky-950/20 border border-sky-200 dark:border-sky-500/20 space-y-1.5">
            <template x-for="(rec, idx) in (healthDetails?.recommendations || [])" :key="idx">
              <div class="flex items-start space-x-2 text-[11px] text-slate-700 dark:text-slate-300">
                <span class="text-sky-500 font-bold shrink-0">•</span>
                <span x-text="getHealthRecommendationText(rec, idx)"></span>
              </div>
            </template>
          </div>
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-end pt-3 border-t border-slate-200 dark:border-slate-800">
        <button @click="showHealthModal = false" class="px-5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-transparent transition shadow-sm dark:shadow-none cursor-pointer" x-text="t('health_modal.close')"></button>
      </div>

    </div>
  </div>
