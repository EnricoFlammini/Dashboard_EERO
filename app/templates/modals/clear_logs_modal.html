  <!-- ===================================================================== -->
  <!-- MODAL: CLEAR SYSTEM LOGS CONFIRMATION (Module 4) -->
  <!-- ===================================================================== -->
  <div 
    x-show="showClearLogsModal" 
    x-cloak
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm"
    style="display: none;"
    role="dialog"
    aria-modal="true"
    aria-labelledby="clear-logs-modal-title">
    
    <div @click.away="if (!isClearingLogs) closeClearLogsModal()" class="glass-panel-elevated w-full max-w-md rounded-2xl p-6 space-y-5 border border-red-500/20 dark:border-red-500/30 shadow-2xl animate-in fade-in zoom-in duration-200">
      <!-- Modal Header -->
      <div class="flex items-center justify-between border-b border-black/[0.06] dark:border-white/5 pb-3">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-red-500/10 dark:bg-red-500/20 border border-red-500/30 flex items-center justify-center text-red-500 shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
          </div>
          <div>
            <h3 id="clear-logs-modal-title" class="text-base font-bold text-slate-900 dark:text-white" x-text="t('logs.clear_confirm_title')"></h3>
            <p class="text-xs text-slate-500 dark:text-slate-400" x-text="t('logs.management')"></p>
          </div>
        </div>
        <button 
          type="button" 
          @click="closeClearLogsModal()" 
          :disabled="isClearingLogs"
          class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-black/[0.05] dark:hover:bg-white/[0.05] transition cursor-pointer disabled:opacity-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="space-y-3 text-xs text-slate-600 dark:text-slate-300">
        <p class="leading-relaxed" x-text="t('logs.clear_confirm_desc')"></p>
        <div class="p-3 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-700 dark:text-amber-400 flex items-start space-x-2">
          <svg class="w-4 h-4 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <span class="text-[11px] font-medium leading-tight" x-text="t('logs.clear_warning')"></span>
        </div>
      </div>

      <!-- Modal Actions -->
      <div class="pt-3 border-t border-black/[0.06] dark:border-white/5 flex items-center justify-end space-x-2">
        <button 
          type="button" 
          @click="closeClearLogsModal()" 
          :disabled="isClearingLogs"
          class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 font-semibold text-slate-700 dark:text-slate-300 transition cursor-pointer disabled:opacity-50" 
          x-text="t('logs.cancel')">
        </button>
        <button 
          type="button" 
          @click="confirmClearLogs()" 
          :disabled="isClearingLogs"
          class="px-5 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold transition shadow-md shadow-red-500/20 cursor-pointer flex items-center space-x-2 disabled:opacity-50">
          <svg x-show="isClearingLogs" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span x-text="isClearingLogs ? t('logs.clearing') : t('logs.clear_confirm_action')"></span>
        </button>
      </div>
    </div>
  </div>
