  <!-- ===================================================================== -->
  <!-- MODAL: DEVICE DETAILS & METADATA -->
  <!-- ===================================================================== -->
  <div 
    x-show="showDeviceModal" 
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm"
    style="display: none;"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 scale-100"
    x-transition:leave-end="opacity-0 scale-95">
    
    <div @click.away="showDeviceModal = false" class="glass-panel-elevated w-full max-w-2xl rounded-2xl p-4 sm:p-6 space-y-4 sm:space-y-5 overflow-hidden max-h-[92vh] flex flex-col border border-slate-200 dark:border-slate-800 shadow-2xl">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between gap-2 border-b border-slate-200 dark:border-slate-800 pb-3">
        <div class="flex items-center space-x-3 min-w-0">
          <div class="w-10 h-10 rounded-xl bg-sky-500/20 border border-sky-500/30 flex items-center justify-center text-sky-400 shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
          </div>
          <div class="min-w-0">
            <h3 class="text-base font-bold text-slate-900 dark:text-white flex items-center space-x-2 min-w-0">
              <span class="min-w-0 truncate" x-text="selectedDevice ? (selectedDevice.custom_name || selectedDevice.nickname || selectedDevice.hostname) : t('device_modal.title')"></span>
              <template x-if="selectedDevice && selectedDevice.is_favorite">
                <span class="text-amber-400 text-sm shrink-0">⭐</span>
              </template>
            </h3>
            <div class="flex items-center space-x-2 text-xs text-slate-500 dark:text-slate-400 min-w-0">
              <span class="font-mono min-w-0 truncate" x-text="selectedDevice ? (selectedDevice.mac || selectedDevice.mac_address) : ''"></span>
              <span class="shrink-0">•</span>
              <span class="text-sky-500 dark:text-sky-400 font-mono shrink-0" x-text="selectedDevice ? (selectedDevice.ip || 'DHCP') : ''"></span>
            </div>
          </div>
        </div>
        <button @click="showDeviceModal = false" class="text-slate-500 hover:text-slate-900 dark:hover:text-white p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- Tab Navigation (Horizontally scrollable and touch-friendly on mobile) -->
      <div class="device-modal-tabs flex items-center border-b border-slate-200 dark:border-slate-800 space-x-1 sm:space-x-2 text-xs overflow-x-auto no-scrollbar shrink-0 pb-1 -mx-2 px-2 sm:mx-0 sm:px-0">
        <button 
          @click="deviceDetailTab = 'general'"
          class="pb-2.5 px-3 font-semibold transition border-b-2 flex items-center space-x-1.5 shrink-0 whitespace-nowrap cursor-pointer"
          :class="deviceDetailTab === 'general' ? 'text-sky-600 dark:text-sky-400 border-sky-600 dark:border-sky-400 font-bold' : 'text-slate-500 dark:text-slate-400 border-transparent hover:text-slate-900 dark:hover:text-slate-200'">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          <span x-text="t('device_modal.tab_general')"></span>
        </button>
        <button 
          @click="deviceDetailTab = 'static_ip'"
          class="pb-2.5 px-3 font-semibold transition border-b-2 flex items-center space-x-1.5 shrink-0 whitespace-nowrap cursor-pointer"
          :class="deviceDetailTab === 'static_ip' ? 'text-sky-600 dark:text-sky-400 border-sky-600 dark:border-sky-400 font-bold' : 'text-slate-500 dark:text-slate-400 border-transparent hover:text-slate-900 dark:hover:text-slate-200'">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path></svg>
          <span x-text="t('device_modal.tab_static_ip')"></span>
          <template x-if="deviceReservation">
            <span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
          </template>
        </button>
        <button 
          @click="deviceDetailTab = 'ports'"
          class="pb-2.5 px-3 font-semibold transition border-b-2 flex items-center space-x-1.5 shrink-0 whitespace-nowrap cursor-pointer"
          :class="deviceDetailTab === 'ports' ? 'text-sky-600 dark:text-sky-400 border-sky-600 dark:border-sky-400 font-bold' : 'text-slate-500 dark:text-slate-400 border-transparent hover:text-slate-900 dark:hover:text-slate-200'">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <span><span x-text="t('device_modal.tab_forwards')"></span> (<span x-text="deviceForwards.length"></span>)</span>
        </button>
        <button 
          @click="deviceDetailTab = 'usage'; loadDeviceUsage()"
          class="pb-2.5 px-3 font-semibold transition border-b-2 flex items-center space-x-1.5 shrink-0 whitespace-nowrap cursor-pointer"
          :class="deviceDetailTab === 'usage' ? 'text-sky-600 dark:text-sky-400 border-sky-600 dark:border-sky-400 font-bold' : 'text-slate-500 dark:text-slate-400 border-transparent hover:text-slate-900 dark:hover:text-slate-200'">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
          <span x-text="t('device_modal.tab_usage')"></span>
        </button>
      </div>

      <!-- Modal Body (Scrollable) -->
      <div class="overflow-y-auto space-y-4 pr-1 text-xs min-h-[260px]">
        
        <!-- ==================== TAB 1: GENERALE ==================== -->
        <div x-show="deviceDetailTab === 'general'" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 items-start">
            <div class="flex flex-col">
              <label class="block text-slate-700 dark:text-slate-400 mb-1 font-semibold text-xs whitespace-nowrap truncate h-5 flex items-center" :title="t('device_modal.custom_name')" x-text="t('device_modal.custom_name')"></label>
              <input type="text" x-model="deviceMetadataForm.custom_name" class="glass-input w-full px-3 py-2 rounded-xl text-xs h-10">
            </div>
            <div class="flex flex-col">
              <label class="block text-slate-700 dark:text-slate-400 mb-1 font-semibold text-xs whitespace-nowrap truncate h-5 flex items-center" :title="t('device_modal.cloud_profile')" x-text="t('device_modal.cloud_profile')"></label>
              <select x-model="deviceSelectedProfileId" @change="changeDeviceProfile()" :disabled="!can('action_edit_devices') || profileChangeStatus.state === 'saving'" :title="t('device_modal.eero_cloud_synced_title')" class="glass-input w-full px-3 py-2 rounded-xl text-xs h-10 disabled:opacity-60">
                <option value="" x-text="t('profiles.total_unassigned')"></option>
                <template x-for="prof in (profiles || [])" :key="prof.id">
                  <option :value="prof.id" :selected="prof.id === deviceSelectedProfileId" x-text="'👤 ' + prof.name"></option>
                </template>
              </select>
              <div x-show="profileChangeStatus.state" x-cloak role="status" aria-live="polite"
                   class="mt-1.5 flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-[11px] font-semibold border"
                   :class="profileChangeStatus.state === 'success' ? 'bg-emerald-500/10 text-emerald-800 dark:text-emerald-300 border-emerald-500/30' : (profileChangeStatus.state === 'error' ? 'bg-rose-500/10 text-rose-800 dark:text-rose-300 border-rose-500/30' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-300 dark:border-slate-700')">
                <svg x-show="profileChangeStatus.state === 'success'" class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                <svg x-show="profileChangeStatus.state === 'error'" class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v4m0 4h.01M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
                <svg x-show="profileChangeStatus.state === 'saving'" class="w-3.5 h-3.5 shrink-0 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                <span class="min-w-0" x-text="profileChangeStatus.message"></span>
              </div>
            </div>
            <div class="flex flex-col sm:col-span-2">
              <label class="block text-slate-700 dark:text-slate-400 mb-1 font-semibold text-xs whitespace-nowrap truncate h-5 flex items-center" :title="t('device_modal.category')" x-text="t('device_modal.category')"></label>
              <!-- Device type: the category and its icon are one choice, so the card/table icon always matches what the device is -->
              <div class="grid grid-cols-4 sm:grid-cols-7 gap-2" role="radiogroup" :aria-label="t('device_modal.category')">
                <template x-for="opt in deviceTypeOptionsForForm()" :key="opt.category">
                  <button type="button" role="radio"
                          @click="selectDeviceType(opt)"
                          :aria-checked="deviceMetadataForm.category === opt.category"
                          :title="opt.label"
                          :class="deviceMetadataForm.category === opt.category ? 'border-sky-500 bg-sky-500/15 text-sky-700 dark:text-sky-300 ring-2 ring-sky-500/30' : 'border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/60 text-slate-600 dark:text-slate-400 hover:border-sky-400 hover:text-sky-600'"
                          class="flex flex-col items-center gap-1 px-1 py-2 rounded-xl border transition cursor-pointer min-w-0">
                    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" :d="getDeviceIconPath(opt.icon)"></path></svg>
                    <span class="text-[10px] font-semibold leading-tight text-center break-words line-clamp-2 max-w-full" x-text="opt.label"></span>
                  </button>
                </template>
              </div>
            </div>
          </div>

          <!-- Device Connection & Signal Info (Points 3, 4, 6) -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 shadow-xs">
            <div>
              <span class="text-slate-600 dark:text-slate-400 block text-[11px] font-medium" x-text="t('device_modal.current_ip')"></span>
              <span class="font-mono text-slate-900 dark:text-slate-200 font-bold" x-text="selectedDevice ? (selectedDevice.ip || 'DHCP') : '---'"></span>
            </div>
            <div>
              <span class="text-slate-600 dark:text-slate-400 block text-[11px] font-medium" x-text="t('device_modal.connected_node')"></span>
              <span class="text-slate-900 dark:text-slate-200 font-semibold" x-text="selectedDevice ? (selectedDevice.connected_eero_name || t('common.gateway')) : '---'"></span>
            </div>
            <div>
              <span class="text-slate-600 dark:text-slate-400 block text-[11px] font-medium" x-text="t('devices.col_band')"></span>
              <span class="font-mono text-slate-900 dark:text-slate-200 font-semibold" x-text="selectedDevice ? (selectedDevice.wireless ? (selectedDevice.wireless_band || selectedDevice.frequency_band || 'Wi-Fi') + (selectedDevice.channel ? ' (CH ' + selectedDevice.channel + ')' : '') : (selectedDevice.ethernet_speed || t('common.ethernet'))) : '---'"></span>
            </div>
            <div>
              <span class="text-slate-600 dark:text-slate-400 block text-[11px] font-medium" x-text="t('devices.col_signal')"></span>
              <span class="font-mono text-slate-900 dark:text-slate-200 font-semibold" x-text="selectedDevice ? (selectedDevice.wireless ? ((selectedDevice.signal_rssi ? selectedDevice.signal_rssi + ' dBm' : '') + (selectedDevice.phy_rate ? ' • ' + t('device_modal.phy_label') + ' ' + selectedDevice.phy_rate : (selectedDevice.connectivity && selectedDevice.connectivity.rx_bitrate ? ' • ' + selectedDevice.connectivity.rx_bitrate : ''))) : (selectedDevice.ethernet_speed ? selectedDevice.ethernet_speed + ' • Ethernet' : 'Ethernet')) : '---'"></span>
            </div>
          </div>

          <!-- Read-only device details -->
          <template x-if="selectedDevice">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 shadow-xs">
              <div>
                <span class="text-slate-600 dark:text-slate-400 block text-[11px] font-medium" x-text="t('devices.col_status')"></span>
                <span class="font-semibold" :class="selectedDevice.connected ? 'text-emerald-700 dark:text-emerald-400' : 'text-slate-500'" x-text="selectedDevice.connected ? t('devices.status_online') : t('devices.status_offline')"></span>
              </div>
              <div class="col-span-1">
                <span class="text-slate-600 dark:text-slate-400 block text-[11px] font-medium" x-text="t('device_modal.mac')"></span>
                <span class="font-mono text-slate-900 dark:text-slate-200 font-semibold select-all" x-text="selectedDevice.mac || selectedDevice.mac_address || '---'"></span>
              </div>
              <div class="col-span-2">
                <span class="text-slate-600 dark:text-slate-400 block text-[11px] font-medium" x-text="t('device_modal.hostname')"></span>
                <span class="font-mono text-slate-900 dark:text-slate-200 font-semibold break-all" x-text="selectedDevice.reported_hostname || '---'"></span>
              </div>
              <template x-if="deviceVendorLabel(selectedDevice)">
                <div class="col-span-2">
                  <span class="text-slate-600 dark:text-slate-400 block text-[11px] font-medium" x-text="t('device_modal.manufacturer') + ' / ' + t('device_modal.model')"></span>
                  <span class="text-slate-900 dark:text-slate-200 font-semibold" x-text="deviceVendorLabel(selectedDevice)"></span>
                </div>
              </template>
              <template x-if="selectedDevice.last_active">
                <div class="col-span-2">
                  <span class="text-slate-600 dark:text-slate-400 block text-[11px] font-medium" x-text="t('device_modal.last_active')"></span>
                  <span class="font-mono text-slate-900 dark:text-slate-200 font-semibold"><span x-text="formatFirstSeenFull(selectedDevice.last_active)"></span> <span class="text-[10px] text-slate-500 dark:text-slate-400 font-sans" x-text="'(' + formatFirstSeenRelative(selectedDevice.last_active) + ')'"></span></span>
                </div>
              </template>
              <template x-if="selectedDevice.wireless && (selectedDevice.phy_type || selectedDevice.channel_width)">
                <div class="col-span-2">
                  <span class="text-slate-600 dark:text-slate-400 block text-[11px] font-medium" x-text="t('device_modal.wifi_standard') + ' / ' + t('device_modal.channel_width')"></span>
                  <span class="font-mono text-slate-900 dark:text-slate-200 font-semibold" x-text="[selectedDevice.phy_type, selectedDevice.channel_width].filter(Boolean).join(' · ')"></span>
                </div>
              </template>
              <template x-if="selectedDevice.is_guest">
                <div class="col-span-2">
                  <span class="text-slate-600 dark:text-slate-400 block text-[11px] font-medium" x-text="t('device_modal.guest_network')"></span>
                  <span class="px-1.5 py-0.5 rounded text-[11px] font-bold bg-violet-100 dark:bg-violet-950/60 text-violet-800 dark:text-violet-300 border border-violet-300 dark:border-violet-500/30" x-text="t('devices.badge_guest')"></span>
                </div>
              </template>
              <div class="col-span-2">
                <span class="text-slate-600 dark:text-slate-400 block text-[11px] font-medium" x-text="t('devices.col_download')"></span>
                <span class="font-mono font-semibold text-sky-600 dark:text-sky-400"><span x-text="deviceRateLabel(selectedDevice.download_rate_mbps)"></span> · <span class="text-slate-600 dark:text-slate-400" x-text="formatBytes(selectedDevice.rx_bytes || 0)"></span></span>
              </div>
              <div class="col-span-2">
                <span class="text-slate-600 dark:text-slate-400 block text-[11px] font-medium" x-text="t('devices.col_upload')"></span>
                <span class="font-mono font-semibold text-emerald-600 dark:text-emerald-400"><span x-text="deviceRateLabel(selectedDevice.upload_rate_mbps)"></span> · <span class="text-slate-600 dark:text-slate-400" x-text="formatBytes(selectedDevice.tx_bytes || 0)"></span></span>
              </div>
            </div>
          </template>

          <!-- First Seen Information (Issue #60) -->
          <template x-if="selectedDevice && selectedDevice.first_seen">
            <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 text-xs">
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-emerald-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <span class="text-slate-600 dark:text-slate-400 font-medium" x-text="selectedDevice.is_baseline ? t('device_modal.tracked_since') : t('device_modal.first_seen')"></span>
                <template x-if="selectedDevice.is_new">
                  <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[9px] font-black uppercase tracking-wider bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border border-emerald-400/40 dark:border-emerald-500/40">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span x-text="t('devices.new_badge')"></span>
                  </span>
                </template>
                <template x-if="can('action_edit_devices') && (selectedDevice.is_new || selectedDevice.new_dismissed)">
                  <button
                    type="button"
                    @click="setDevicesSeen([selectedDevice.mac || selectedDevice.mac_address], Boolean(selectedDevice.is_new))"
                    class="px-2 py-0.5 rounded-lg text-[10px] font-semibold border transition cursor-pointer"
                    :class="selectedDevice.is_new ? 'bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-800 dark:text-emerald-300 border-emerald-500/30' : 'bg-black/[0.03] dark:bg-white/[0.05] hover:bg-black/[0.06] dark:hover:bg-white/[0.1] text-slate-600 dark:text-slate-300 border-slate-300 dark:border-slate-700'"
                    x-text="selectedDevice.is_new ? t('devices.mark_seen') : t('devices.mark_new')"></button>
                </template>
              </div>
              <div class="text-right">
                <span class="font-mono text-slate-800 dark:text-slate-200 font-bold block" x-text="formatFirstSeenFull(selectedDevice.first_seen)"></span>
                <span class="text-[10px] text-slate-500 dark:text-slate-400 block font-sans" x-show="formatFirstSeenRelative(selectedDevice.first_seen)" x-text="'(' + formatFirstSeenRelative(selectedDevice.first_seen) + ')'"></span>
              </div>
            </div>
          </template>

          <!-- IPv6 Addresses Section (Issue #43) -->
          <template x-if="selectedDevice && (selectedDevice.ipv6 || (selectedDevice.ipv6_all && selectedDevice.ipv6_all.length))">
            <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-slate-700 dark:text-slate-300 text-xs font-bold flex items-center space-x-1.5">
                  <svg class="w-3.5 h-3.5 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                  <span x-text="t('device_modal.ipv6_section_title')"></span>
                </span>
                <div class="flex items-center space-x-2">
                  <span class="text-[10px] text-slate-500 font-mono" x-text="((selectedDevice.ipv6_all || selectedDevice.ipv6_addresses) ? (selectedDevice.ipv6_all || selectedDevice.ipv6_addresses).length : 1) + ' ' + t('device_modal.ipv6_addresses_count')"></span>
                  <template x-if="can('action_edit_devices') && selectedDevice.ipv6_details && selectedDevice.ipv6_details.some(d => d.origin === 'ndp_discovered')">
                    <button 
                      @click="clearDeviceDiscoveredUla(selectedDevice)"
                      type="button"
                      :disabled="isClearingUla"

                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </button>

                </template>
              </div>
            </div>
          </template>

          <div>

              <input type="checkbox" x-model="deviceMetadataForm.is_favorite" class="rounded bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-700 text-sky-500">

            <label class="flex items-center space-x-2 text-slate-800 dark:text-slate-300 font-medium cursor-pointer">

            </label>
          </div>
        </div>

        <!-- ==================== TAB 2: IP STATICO (DHCP) ==================== -->

          </div>

                  <div class="p-2 rounded-lg bg-emerald-100 dark:bg-emerald-500/20 text-emerald-700 dark:text-emerald-400 mt-0.5">

                  <div>

                  x-text="t('device_modal.remove_static_btn')">
                </button>
              </div>
            </template>

            <template x-if="!deviceReservation">

                  <span class="font-bold" x-text="t('device_modal.dhcp_dynamic_title')"></span>

                <p class="text-xs text-slate-600 dark:text-slate-400 leading-relaxed" x-text="t('device_modal.dhcp_dynamic_desc', {ip: (selectedDevice ? (selectedDevice.ip || '---') : '---')})"></p>

                <!-- Input Indirizzo IP -->

                      class="glass-input flex-1 px-3 py-2 rounded-xl text-sm font-mono font-semibold">

                      @click="saveDeviceReservation()"

                      <span x-text="ipConflictInfo && ipConflictInfo.isReassign ? t('device_modal.reassign_btn') : t('device_modal.reserve_btn')"></span>
                    </button>
                  </div>
                </div>

                <!-- 1. Conflitto Bloccante (Gateway / Nodi / Errore sintassi) -->
                <template x-if="ipConflictInfo && ipConflictInfo.hasConflict">
                  <div class="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/60 border border-rose-300 dark:border-rose-500/40 text-rose-900 dark:text-rose-200 text-xs font-medium flex items-center space-x-2 shadow-sm dark:shadow-none">
                    <svg class="w-4 h-4 text-rose-600 dark:text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <span x-text="ipConflictInfo.message"></span>
                  </div>
                </template>

                <!-- 2. Riassegnazione da altra scheda o lease (Avviso informativo ma consentito) -->
                <template x-if="ipConflictInfo && !ipConflictInfo.hasConflict && ipConflictInfo.isReassign">
                  <div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-950/50 border border-amber-300 dark:border-amber-500/30 text-amber-900 dark:text-amber-200 text-xs font-medium flex items-center space-x-2 shadow-sm dark:shadow-none">
                    <svg class="w-4 h-4 text-amber-600 dark:text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <span x-text="ipConflictInfo.message"></span>
                  </div>
                </template>

                <!-- 3. Disponibile o già in uso dallo stesso host (Box da Screenshot 2) -->

                    <svg class="w-4 h-4 text-emerald-700 dark:text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                    <span x-text="ipConflictInfo.message"></span>
                  </div>
                </template>

              </div>

                      <span class="text-sky-700 dark:text-sky-400 font-bold" x-text="res.ip || res.ip_address"></span>
                      <span class="text-slate-700 dark:text-slate-400 font-sans font-medium" x-text="res.description || res.name || res.nickname || t('devices.generic_device')"></span>
                    </div>
                    <span class="text-slate-500 text-[10px]" x-text="res.mac || res.mac_address"></span>
                  </div>
                </template>
                <template x-if="allReservations.length === 0">
                  <div class="text-slate-500 text-xs py-2" x-text="t('device_modal.no_reservations')"></div>
                </template>
              </div>
            </div>

          </div>
        </div>

        <!-- ==================== TAB 3: PORT FORWARDING ==================== -->
        <div x-show="deviceDetailTab === 'ports'" class="space-y-4" style="display: none;">

              <h4 class="font-bold text-slate-900 dark:text-white text-xs" x-text="t('device_modal.forwards_title')"></h4>

          </div>

            <table class="w-full text-left text-xs border-collapse">
              <thead>
                <tr class="bg-slate-100 dark:bg-slate-900/80 text-slate-700 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800 text-[11px] uppercase font-semibold">
                  <th class="py-2.5 px-3" x-text="t('device_modal.col_desc')"></th>
                  <th class="py-2.5 px-3" x-text="t('device_modal.col_wan_port')"></th>
                  <th class="py-2.5 px-3" x-text="t('device_modal.col_lan_port')"></th>

                    <td class="py-2.5 px-3 text-sky-600 dark:text-sky-400 font-bold" x-text="fwd.port_from || fwd.gateway_port || fwd.external_port || fwd.port || '-'"></td>
                    <td class="py-2.5 px-3 text-slate-700 dark:text-slate-300" x-text="fwd.port_to || fwd.client_port || fwd.internal_port || fwd.port || fwd.port_from || '-'"></td>
                    <td class="py-2.5 px-3">
                      <span class="px-1.5 py-0.5 rounded text-[10px] uppercase font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 dark:bg-slate-800 dark:text-indigo-400 dark:border-indigo-500/20" x-text="fwd.protocol || 'tcp'"></span>
                    </td>
                    <td class="py-2.5 px-3 text-right font-sans">
                      <button 
                        x-show="can('action_manage_rules')"
                        @click="deleteDevicePortForward(fwd.id || (fwd.url ? fwd.url.split('/').pop() : ''))"

                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                      </button>
                    </td>

                </template>
                <template x-if="deviceForwards.length === 0">

                  </tr>

              </tbody>
            </table>

              x-text="t('device_modal.create_forward_btn')">
            </button>

                  @click="loadDeviceUsage(null, 'daily', 10)"

                  type="button"
                  @click="loadDeviceUsage(null, 'daily', 15)"
                  class="px-2 py-0.5 rounded transition cursor-pointer"
                  :class="deviceUsageResolution === 15 ? 'bg-sky-500 text-white shadow-xs font-bold' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'">
                  <span x-text="t('device_modal.resolution_minutes', { n: 15 })"></span>
                </button>
                <button 
                  type="button"
                  @click="loadDeviceUsage(null, 'daily', 20)"
                  class="px-2 py-0.5 rounded transition cursor-pointer"
                  :class="deviceUsageResolution === 20 ? 'bg-sky-500 text-white shadow-xs font-bold' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'">
                  <span x-text="t('device_modal.resolution_minutes', { n: 20 })"></span>
                </button>
                <button 
                  type="button"
                  @click="loadDeviceUsage(null, 'daily', 30)"
                  class="px-2 py-0.5 rounded transition cursor-pointer"
                  :class="deviceUsageResolution === 30 ? 'bg-sky-500 text-white shadow-xs font-bold' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'">
                  <span x-text="t('device_modal.resolution_minutes', { n: 30 })"></span>
                </button>
              </div>
            </div>
          </div>

          <!-- Loading State -->
          <div x-show="deviceUsageLoading" class="flex flex-col items-center justify-center py-10 space-y-2">
            <svg class="w-7 h-7 animate-spin text-sky-500" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
            <span class="text-xs text-slate-500 font-medium" x-text="t('device_modal.loading_usage')"></span>
          </div>

          <!-- Usage Metrics Overview Badges -->
          <div x-show="!deviceUsageLoading && deviceUsageData" class="space-y-3">
            <div class="flex items-center justify-between px-0.5">
              <div class="flex items-center space-x-1.5">
                <span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider" x-text="t('device_modal.usage_period_title')"></span>
                <span class="text-[9px] font-medium text-amber-700 dark:text-amber-300 bg-amber-500/10 dark:bg-amber-400/10 px-1.5 py-0.5 rounded-md border border-amber-500/20" x-text="'~ ' + t('device_modal.usage_estimated_badge')"></span>
              </div>
              <button 
                @click.stop="showUsageInfoModal = true" 
                type="button" 
                class="inline-flex items-center gap-1 text-[11px] font-semibold text-sky-600 dark:text-sky-400 hover:text-sky-700 dark:hover:text-sky-300 transition cursor-pointer" 
                :title="t('device_modal.usage_info_btn_title')">
                <span class="w-4 h-4 rounded-full bg-sky-500/10 border border-sky-500/30 text-sky-600 dark:text-sky-400 font-bold inline-flex items-center justify-center text-[10px]">?</span>
                <span class="hidden sm:inline" x-text="t('device_modal.usage_info_btn')"></span>
              </button>
            </div>

            <div class="grid grid-cols-3 gap-2">
              <div class="glass-card-subtle p-2.5 rounded-xl text-center border border-slate-200 dark:border-slate-800 relative group">
                <div class="flex items-center justify-center space-x-1 mb-0.5">
                  <span class="text-[10px] text-slate-500 font-semibold uppercase tracking-wider" x-text="t('device_modal.usage_download')"></span>
                  <button @click.stop="showUsageInfoModal = true" type="button" class="w-3.5 h-3.5 rounded-full bg-slate-200/80 dark:bg-slate-700/80 hover:bg-sky-500 hover:text-white text-slate-500 dark:text-slate-400 text-[9px] font-bold inline-flex items-center justify-center transition cursor-pointer" :title="t('device_modal.usage_info_btn_title')">?</button>
                </div>
                <div class="text-sm font-extrabold text-sky-500 font-mono" x-text="formatBytes(deviceUsageData ? deviceUsageData.summary.rx_bytes : 0)"></div>
              </div>
              <div class="glass-card-subtle p-2.5 rounded-xl text-center border border-slate-200 dark:border-slate-800 relative group">
                <div class="flex items-center justify-center space-x-1 mb-0.5">
                  <span class="text-[10px] text-slate-500 font-semibold uppercase tracking-wider" x-text="t('device_modal.usage_upload')"></span>
                  <button @click.stop="showUsageInfoModal = true" type="button" class="w-3.5 h-3.5 rounded-full bg-slate-200/80 dark:bg-slate-700/80 hover:bg-emerald-500 hover:text-white text-slate-500 dark:text-slate-400 text-[9px] font-bold inline-flex items-center justify-center transition cursor-pointer" :title="t('device_modal.usage_info_btn_title')">?</button>
                </div>
                <div class="text-sm font-extrabold text-emerald-500 font-mono" x-text="formatBytes(deviceUsageData ? deviceUsageData.summary.tx_bytes : 0)"></div>
              </div>
              <div class="glass-card-subtle p-2.5 rounded-xl text-center border border-slate-200 dark:border-slate-800 relative group">
                <div class="flex items-center justify-center space-x-1 mb-0.5">
                  <span class="text-[10px] text-slate-500 font-semibold uppercase tracking-wider" x-text="t('device_modal.usage_total')"></span>
                  <button @click.stop="showUsageInfoModal = true" type="button" class="w-3.5 h-3.5 rounded-full bg-slate-200/80 dark:bg-slate-700/80 hover:bg-indigo-500 hover:text-white text-slate-500 dark:text-slate-400 text-[9px] font-bold inline-flex items-center justify-center transition cursor-pointer" :title="t('device_modal.usage_info_btn_title')">?</button>
                </div>
                <div class="text-sm font-extrabold text-indigo-500 font-mono" x-text="formatBytes(deviceUsageData ? deviceUsageData.summary.total_bytes : 0)"></div>
              </div>
            </div>

            <!-- Chart Canvas Container -->
            <div class="glass-card p-3 rounded-xl border border-slate-200 dark:border-slate-800 relative">
              <div class="h-44 w-full relative">
                <canvas id="deviceUsageChartCanvas"></canvas>
              </div>
              <div class="mt-2 flex items-center justify-between text-[10px] text-slate-500">
                <span x-text="t('device_modal.usage_chart_hint') + (deviceUsagePeriod === 'daily' ? ' ' + t('device_modal.usage_resolution', { n: (deviceUsageData && deviceUsageData.resolution_minutes ? deviceUsageData.resolution_minutes : (deviceUsageResolution || 15)) }) : '')"></span>
                <span class="font-mono" x-text="deviceUsageData && deviceUsageData.period ? (t('device_modal.period_' + deviceUsageData.period) || deviceUsageData.period) : ''"></span>
              </div>
              <div class="mt-1.5 pt-1.5 border-t border-slate-100 dark:border-slate-800/60 text-[10px] text-slate-400 dark:text-slate-500 flex items-center justify-between">
                <span class="flex items-center gap-1.5">
                  <svg class="w-3.5 h-3.5 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                  <span x-text="t('device_modal.usage_realtime_counters_hint')"></span>
                </span>
                <button @click.stop="showUsageInfoModal = true" type="button" class="text-sky-500 dark:text-sky-400 hover:underline font-medium cursor-pointer" x-text="t('device_modal.usage_more_info_btn')"></button>
              </div>
            </div>

            <!-- Notice for Wired Devices without Hardware Packet Counters -->
            <div x-show="!deviceUsageLoading && deviceUsageData && (!deviceUsageData.summary || deviceUsageData.summary.total_bytes === 0) && activeDevice && !activeDevice.wireless" class="p-2.5 rounded-xl bg-sky-500/10 dark:bg-sky-950/30 border border-sky-500/20 text-sky-700 dark:text-sky-300 text-[11px] flex items-start gap-2">
              <svg class="w-4 h-4 shrink-0 mt-0.5 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              <span><strong x-text="t('devices.wired_modal_notice_title') + ' '"></strong><span x-text="t('devices.wired_modal_notice_desc')"></span></span>
            </div>
          </div>
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-between pt-3 border-t border-slate-200 dark:border-slate-800">
        <button @click="showDeviceModal = false" class="px-4 py-2 rounded-xl bg-white hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-transparent transition shadow-sm dark:shadow-none cursor-pointer" x-text="t('device_modal.close_btn')"></button>
        <template x-if="deviceDetailTab === 'general' && can('action_edit_devices')">
          <button @click="saveDeviceMetadata()" class="px-5 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-xs font-bold text-white shadow-lg shadow-sky-600/30 transition cursor-pointer" x-text="t('device_modal.save_metadata_btn')"></button>
        </template>
      </div>

    </div>
  </div>
