  <!-- ===================================================================== -->
  <!-- MODAL: CONFIGURAZIONE MQTT & HOME ASSISTANT (v1.6.1 - Modulo 2) -->
  <!-- ===================================================================== -->
  <div 
    x-show="showMqttModal" 
    x-cloak
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm"
    style="display: none;"
    role="dialog"
    aria-modal="true"
    aria-labelledby="mqtt-modal-title">
    
    <div @click.away="if (!mqttSaving && !mqttTesting) closeMqttModal()" class="glass-panel-elevated w-full max-w-xl rounded-2xl p-6 space-y-5 border border-sky-500/20 dark:border-sky-500/30 shadow-2xl animate-in fade-in zoom-in duration-200">
      <!-- Modal Header -->
      <div class="flex items-center justify-between border-b border-black/[0.06] dark:border-white/5 pb-3">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500/20 to-teal-500/20 border border-sky-500/30 flex items-center justify-center text-sky-600 dark:text-sky-400 shadow-sm shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          </div>
          <div>
            <h3 id="mqtt-modal-title" class="text-base font-bold text-slate-900 dark:text-white" x-text="t('controls.mqtt_modal_title')"></h3>
            <p class="text-xs text-slate-500 dark:text-slate-400" x-text="t('controls.mqtt_modal_desc')"></p>
          </div>
        </div>
        <button 
          type="button" 
          @click="closeMqttModal()" 
          :disabled="mqttSaving || mqttTesting"
          class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-black/[0.05] dark:hover:bg-white/[0.05] transition cursor-pointer disabled:opacity-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Modal Form Body -->
      <form @submit.prevent="saveMqttSettings()" class="space-y-4 text-xs text-slate-700 dark:text-slate-300">
        <!-- 1. Enable Toggle -->
        <div class="p-3 rounded-xl bg-sky-50 dark:bg-sky-500/10 border border-sky-200 dark:border-sky-500/20 flex items-center justify-between">
          <div class="flex items-center space-x-2.5">
            <input 
              id="mqtt-modal-enable"
              type="checkbox" 
              x-model="mqttModalForm.enabled" 
              class="rounded border-slate-300 dark:border-slate-700 text-sky-600 focus:ring-sky-500/30 bg-white dark:bg-slate-800 w-4 h-4 cursor-pointer">
            <label for="mqtt-modal-enable" class="font-bold text-slate-900 dark:text-white cursor-pointer select-none" x-text="t('controls.mqtt_enable_toggle')"></label>
          </div>
          <span class="text-[11px] font-mono px-2 py-0.5 rounded-md" :class="mqttModalForm.enabled ? 'bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 font-bold' : 'bg-slate-500/20 text-slate-500'" x-text="mqttModalForm.enabled ? t('controls.enabled') : t('controls.disabled')"></span>
        </div>

        <!-- 2. Host & Port -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="sm:col-span-2">
            <label class="block text-slate-700 dark:text-slate-300 font-semibold mb-1" x-text="t('controls.mqtt_broker_host')"></label>
            <input 
              type="text" 
              x-model="mqttModalForm.broker_host" 
              :placeholder="t('controls.mqtt_broker_host_placeholder')" 
              required
              class="glass-input w-full px-3 py-2 rounded-xl font-mono text-xs">
          </div>
          <div>
            <label class="block text-slate-700 dark:text-slate-300 font-semibold mb-1" x-text="t('controls.mqtt_broker_port')"></label>
            <input 
              type="number" 
              min="1" 
              max="65535" 
              x-model.number="mqttModalForm.broker_port" 
              placeholder="1883" 
              required
              class="glass-input w-full px-3 py-2 rounded-xl font-mono text-xs">
          </div>
        </div>

        <!-- 3. Username & Password -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-700 dark:text-slate-300 font-semibold mb-1" x-text="t('controls.mqtt_username')"></label>
            <input 
              type="text" 
              x-model="mqttModalForm.username" 
              :placeholder="t('controls.mqtt_username_placeholder')" 
              autocomplete="off"
              class="glass-input w-full px-3 py-2 rounded-xl text-xs">
          </div>
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="block text-slate-700 dark:text-slate-300 font-semibold" x-text="t('controls.mqtt_password')"></label>
              <button 
                type="button" 
                @click="showMqttPassword = !showMqttPassword" 
                class="text-[11px] text-sky-600 dark:text-sky-400 hover:underline cursor-pointer flex items-center space-x-1"
                :title="showMqttPassword ? t('controls.mqtt_hide_password') : t('controls.mqtt_show_password')">
                <span x-text="showMqttPassword ? t('controls.mqtt_hide_password') : t('controls.mqtt_show_password')"></span>
              </button>
            </div>
            <input 
              :type="showMqttPassword ? 'text' : 'password'" 
              x-model="mqttModalForm.password" 
              :placeholder="mqttModalForm.has_password ? t('controls.mqtt_password_unchanged') : t('controls.mqtt_password_placeholder')" 
              autocomplete="new-password"
              class="glass-input w-full px-3 py-2 rounded-xl text-xs font-mono">
          </div>
        </div>

        <!-- 4. Base Topic & Publish Interval -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-700 dark:text-slate-300 font-semibold mb-1" x-text="t('controls.mqtt_base_topic')"></label>
            <input 
              type="text" 
              x-model="mqttModalForm.base_topic" 
              placeholder="eero" 
              required
              class="glass-input w-full px-3 py-2 rounded-xl font-mono text-xs">
          </div>
          <div>
            <label class="block text-slate-700 dark:text-slate-300 font-semibold mb-1" x-text="t('controls.mqtt_publish_interval')"></label>
            <input 
              type="number" 
              min="10" 
              max="3600" 
              x-model.number="mqttModalForm.publish_interval" 
              placeholder="60" 
              required
              class="glass-input w-full px-3 py-2 rounded-xl font-mono text-xs">
          </div>
          <div class="col-span-2">
            <label class="block text-slate-700 dark:text-slate-300 font-semibold mb-1" x-text="t('controls.mqtt_live_interval')"></label>
            <input 
              type="number" 
              min="0" 
              max="300" 
              x-model.number="mqttModalForm.live_interval" 
              placeholder="0"
              class="glass-input w-full px-3 py-2 rounded-xl font-mono text-xs">
          </div>
        </div>

        <!-- 5. Home Assistant MQTT Auto-Discovery Group -->
        <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-black/[0.06] dark:border-white/10 space-y-3">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
              <input 
                id="mqtt-modal-ha"
                type="checkbox" 
                x-model="mqttModalForm.discovery_enabled" 
                class="rounded border-slate-300 dark:border-slate-700 text-teal-600 focus:ring-teal-500/30 bg-white dark:bg-slate-800 w-4 h-4 cursor-pointer">
              <label for="mqtt-modal-ha" class="font-bold text-slate-900 dark:text-white cursor-pointer select-none" x-text="t('controls.mqtt_discovery_enable')"></label>
            </div>
            <span class="text-xs">🏡</span>
          </div>

          <div x-show="mqttModalForm.discovery_enabled" class="space-y-2 pt-1 border-t border-black/[0.04] dark:border-white/5">
            <div>
              <label class="block text-[11px] text-slate-600 dark:text-slate-400 font-semibold mb-1" x-text="t('controls.mqtt_ha_prefix')"></label>
              <input 
                type="text" 
                x-model="mqttModalForm.discovery_prefix" 
                placeholder="homeassistant" 
                class="glass-input w-full px-3 py-1.5 rounded-lg font-mono text-xs">
            </div>
            <p class="text-[11px] text-slate-500 leading-relaxed" x-text="t('controls.mqtt_discovery_desc')"></p>
          </div>
        </div>

        <!-- Modal Actions Footer -->
        <div class="pt-3 border-t border-black/[0.06] dark:border-white/5 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
          <!-- Left: Test Connection Button -->
          <button 
            type="button" 
            @click="testMqttConnection(true)" 
            :disabled="mqttTesting || mqttSaving"
            class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 font-semibold text-slate-700 dark:text-slate-300 transition cursor-pointer flex items-center justify-center space-x-1.5 disabled:opacity-50 text-xs">
            <svg x-show="mqttTesting" class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
            <span x-text="mqttTesting ? t('controls.mqtt_testing') : t('controls.mqtt_test_btn')"></span>
          </button>

          <!-- Right: Cancel & Save Buttons -->
          <div class="flex items-center justify-end space-x-2">
            <button 
              type="button" 
              @click="closeMqttModal()" 
              :disabled="mqttSaving || mqttTesting"
              class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 font-semibold text-slate-700 dark:text-slate-300 transition cursor-pointer disabled:opacity-50 text-xs" 
              x-text="t('controls.mqtt_cancel')">
            </button>
            <button 
              type="submit" 
              :disabled="mqttSaving || mqttTesting"
              class="px-5 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold transition shadow-md shadow-sky-500/20 cursor-pointer flex items-center space-x-2 disabled:opacity-50 text-xs">
              <svg x-show="mqttSaving" class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
              <span x-text="mqttSaving ? t('controls.mqtt_saving') : t('controls.mqtt_save_btn')"></span>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="mt-auto mb-16 md:mb-0 border-t border-slate-200 dark:border-slate-800/80 py-4 px-4 bg-slate-100/90 dark:bg-[#0b0f17]/80 text-center">
    <div class="max-w-7xl mx-auto text-[11px] text-slate-600 dark:text-slate-500 font-medium" x-text="t('footer.text')"></div>
  </footer>
