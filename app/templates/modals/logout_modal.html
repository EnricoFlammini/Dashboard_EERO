  <!-- ===================================================================== -->
  <!-- MODAL: LOGOUT CONFIRMATION POPUP -->
  <!-- ===================================================================== -->
  <div 
    x-show="showLogoutModal" 
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm"
    style="display: none;"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100">
    
    <div @click.away="showLogoutModal = false" class="glass-panel-elevated w-full max-w-md rounded-2xl p-6 space-y-4 border border-rose-500/30 shadow-2xl shadow-rose-950/40">
      <div class="flex items-center space-x-3">
        <div class="p-2.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-500 dark:text-rose-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
        </div>
        <div>
          <h3 class="text-base font-bold text-slate-900 dark:text-white" x-text="t('logout_modal.title')"></h3>
          <p class="text-xs text-slate-500 dark:text-slate-400" x-text="t('logout_modal.subtitle')"></p>
        </div>
      </div>
      
      <div class="rounded-xl bg-amber-50 dark:bg-slate-900/80 p-3.5 border border-amber-200 dark:border-slate-800 text-xs text-slate-700 dark:text-slate-300 space-y-2">
        <p class="font-medium text-amber-700 dark:text-amber-300 flex items-center space-x-1.5">
          <svg class="w-4 h-4 text-amber-600 dark:text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span x-text="t('logout_modal.warning_title')"></span>
        </p>
        <p class="text-slate-600 dark:text-slate-400 leading-relaxed" x-text="t('logout_modal.warning_desc')"></p>
      </div>

      <div class="pt-2 flex items-center justify-end space-x-3">
        <button 
          @click="showLogoutModal = false" 
          class="px-4 py-2 rounded-xl bg-white hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-transparent shadow-sm dark:shadow-none transition cursor-pointer"
          x-text="t('logout_modal.cancel')">
        </button>
        <button 
          @click="showLogoutModal = false; logout()" 
          class="px-4 py-2 rounded-xl bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 text-xs font-bold text-white shadow-lg shadow-rose-500/20 transition flex items-center space-x-1.5 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
          <span x-text="t('logout_modal.confirm')"></span>
        </button>
      </div>
    </div>
  </div>
