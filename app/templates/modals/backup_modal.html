  <!-- ===================================================================== -->
  <!-- MODAL: BACKUP & RESTORE CONFIGURATION (Module 3) -->
  <!-- ===================================================================== -->
  <div 
    x-show="showBackupModal" 
    x-cloak
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm"
    style="display: none;"
    role="dialog"
    aria-modal="true">
    
    <div @click.away="showBackupModal = false" class="glass-panel-elevated w-full max-w-xl rounded-2xl p-6 space-y-5 border border-slate-200 dark:border-slate-800 shadow-2xl">
      <!-- Modal Header -->
      <div class="flex items-center justify-between border-b border-black/[0.06] dark:border-white/5 pb-3">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-sky-600 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          </div>
          <div>
            <h3 class="text-base font-bold text-slate-900 dark:text-white" x-text="t('backup_modal.title')"></h3>
            <p class="text-xs text-slate-500 dark:text-slate-400" x-text="t('backup_modal.subtitle')"></p>
          </div>
        </div>
        <button @click="showBackupModal = false" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-black/[0.05] dark:hover:bg-white/[0.05] transition cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Export Card -->
      <div class="p-4 rounded-xl bg-black/[0.02] dark:bg-white/[0.02] border border-slate-200 dark:border-slate-800 space-y-3 text-xs">
        <div class="flex items-center space-x-2">
          <span class="text-base">📦</span>
          <h4 class="font-bold text-slate-900 dark:text-white" x-text="t('backup_modal.export_title')"></h4>
        </div>
        <p class="text-slate-600 dark:text-slate-400 leading-relaxed" x-text="t('backup_modal.export_desc')"></p>
        <button 
          @click="downloadBackup()" 
          class="px-4 py-2 rounded-xl bg-[#0067c0] hover:bg-[#005299] text-white font-bold transition shadow-sm cursor-pointer flex items-center space-x-2">
          <span>⬇️</span>
          <span x-text="t('backup_modal.export_btn')"></span>
        </button>
      </div>

      <!-- Restore Card -->
      <div class="p-4 rounded-xl bg-amber-500/5 border border-amber-500/20 space-y-3 text-xs">
        <div class="flex items-center space-x-2">
          <span class="text-base">📥</span>
          <h4 class="font-bold text-amber-900 dark:text-amber-300" x-text="t('backup_modal.restore_title')"></h4>
        </div>
        <p class="text-slate-600 dark:text-slate-400 leading-relaxed" x-text="t('backup_modal.restore_desc')"></p>
        
        <div class="p-3 rounded-lg bg-amber-500/10 text-amber-800 dark:text-amber-200 text-[11px] font-medium" x-text="t('backup_modal.restore_warning')"></div>

        <div class="space-y-2">
          <label class="block text-slate-700 dark:text-slate-300 font-semibold" x-text="t('backup_modal.select_file')"></label>
          <input 
            type="file" 
            accept=".json" 
            @change="uploadBackup($event)"
            :disabled="backupLoading"
            class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-sky-50 file:text-[#0067c0] hover:file:bg-sky-100 dark:file:bg-sky-500/20 dark:file:text-sky-300 cursor-pointer disabled:opacity-50">
        </div>

        <template x-if="backupRestoreStatus">
          <div class="p-2.5 rounded-lg text-xs font-semibold"
               :class="backupRestoreIsError ? 'bg-rose-500/15 text-rose-700 dark:text-rose-400' : 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-400'"
               x-text="backupRestoreStatus"></div>
        </template>
      </div>

      <!-- Close Button -->
      <div class="pt-2 border-t border-black/[0.06] dark:border-white/5 flex justify-end">
        <button @click="showBackupModal = false" class="px-5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 font-semibold text-xs text-slate-700 dark:text-slate-300 transition cursor-pointer" x-text="t('backup_modal.close')"></button>
      </div>
    </div>
  </div>
