<!-- Maintenance overlay (Issue #117): startup or SQLite repair in progress; reloads itself when ready -->
<div x-show="maintenance" x-cloak x-transition.opacity
  class="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-100/90 dark:bg-slate-950/90 backdrop-blur-md"
  role="alertdialog" aria-modal="true" aria-labelledby="maintenance-title" aria-describedby="maintenance-stage">
  <div class="glass-panel-elevated w-full max-w-md rounded-2xl p-6 sm:p-8 text-center shadow-2xl border border-slate-200 dark:border-slate-800">
    <div class="mx-auto mb-5 w-14 h-14 rounded-full flex items-center justify-center"
      :class="maintenance && maintenance.stage === 'startup_failed' ? 'bg-rose-500/15 text-rose-600 dark:text-rose-400' : 'bg-sky-500/15 text-sky-600 dark:text-sky-400'">
      <svg x-show="!maintenance || maintenance.stage !== 'startup_failed'" class="w-7 h-7 animate-spin" style="animation-duration: 2.5s" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <svg x-show="maintenance && maintenance.stage === 'startup_failed'" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
    </div>
    <h2 id="maintenance-title" class="text-lg font-bold text-slate-900 dark:text-white" x-text="t('maintenance.title')"></h2>
    <p id="maintenance-stage" class="mt-2 text-sm text-slate-600 dark:text-slate-300" aria-live="polite"
      x-text="maintenance ? (t('maintenance.stage_' + maintenance.stage) || t('maintenance.stage_starting')) : ''"></p>
    <p x-show="maintenance && maintenance.stage !== 'startup_failed'" class="mt-4 text-xs text-slate-500 dark:text-slate-400" x-text="t('maintenance.auto_reload')"></p>
    <p x-show="maintenanceElapsed > 0" class="mt-1 text-[11px] font-mono text-slate-400 dark:text-slate-500" x-text="t('maintenance.elapsed', { seconds: maintenanceElapsed })"></p>
  </div>
</div>
