            <button 
              type="button" 
              @click="selectedBandFilter = '6GHz'"

                      <template x-if="dev.roaming_advisor && dev.roaming_advisor.is_sticky">
                        <span 
                          class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-amber-500/15 text-amber-700 dark:text-amber-400 border border-amber-300 dark:border-amber-500/30 flex items-center space-x-0.5 cursor-help"
                          :title="localized(dev.roaming_advisor, 'advice')">
                          <span>🔄</span>
                          <span x-text="t('devices.sticky_roaming_badge')"></span>
                        </span>
                      </template>
                    </div>
                  </td>

                  <!-- Band / Channel -->
                  <td x-show="isTableColumnVisible('band')" class="device-band-cell py-3 px-4" :data-label="t('devices.col_band')">
                    <div class="flex flex-col items-start gap-1">
                      <span 
                        class="px-2.5 py-0.5 rounded text-[10px] font-mono font-extrabold shadow-xs dark:shadow-none inline-block"
                        :class="{
                          'bg-cyan-100 dark:bg-cyan-950/60 text-cyan-950 dark:text-cyan-300 border border-cyan-400 dark:border-cyan-500/40': (dev.wireless_band === '6GHz' || dev.frequency_band === '6 GHz' || dev.frequency_band === '6GHz' || (dev.channel && dev.channel > 177)),
                          'bg-indigo-100 dark:bg-indigo-950/60 text-indigo-950 dark:text-indigo-300 border border-indigo-400 dark:border-indigo-500/40': (dev.wireless_band !== '6GHz' && dev.frequency_band !== '6 GHz' && dev.frequency_band !== '6GHz' && (!dev.channel || dev.channel <= 177) && (dev.wireless_band === '5GHz' || dev.frequency_band === '5 GHz' || dev.frequency_band === '5GHz' || (dev.channel && dev.channel >= 32))),
                          'bg-amber-100 dark:bg-amber-950/60 text-amber-950 dark:text-amber-300 border border-amber-400 dark:border-amber-500/40': (dev.wireless_band !== '6GHz' && dev.frequency_band !== '6 GHz' && dev.frequency_band !== '6GHz' && (dev.wireless_band === '2.4GHz' || dev.frequency_band === '2.4 GHz' || dev.frequency_band === '2.4GHz' || (dev.channel && dev.channel >= 1 && dev.channel <= 14))),
                          'bg-emerald-100 dark:bg-emerald-950/60 text-emerald-950 dark:text-emerald-300 border border-emerald-400 dark:border-emerald-500/40': (dev.wireless === false || dev.connection_type === 'wired' || dev.frequency_band === 'Ethernet' || dev.frequency_band === 'Cablato' || dev.frequency_band === 'Wired')
                        }"
                        x-text="(dev.wireless === false || dev.connection_type === 'wired' || dev.frequency_band === 'Ethernet' || dev.frequency_band === 'Cablato' || dev.frequency_band === 'Wired') ? t('common.ethernet') : (dev.frequency_band && dev.frequency_band !== 'Cablato' && dev.frequency_band !== 'Ethernet' ? dev.frequency_band : (dev.wireless_band || (dev.channel && dev.channel <= 14 ? '2.4 GHz' : (dev.channel && dev.channel > 177 ? '6 GHz' : '5 GHz'))))">
                      </span>
                      <template x-if="dev.channel">
                        <span class="text-[10px] font-mono font-bold text-slate-700 dark:text-slate-300">CH <span x-text="dev.channel"></span></span>
                      </template>
                    </div>
                  </td>

                  <!-- Signal & PHY Link Speed (Real Eero API data) -->
                  <td x-show="isTableColumnVisible('signal')" class="py-3 px-4 font-mono text-xs" :data-label="t('devices.col_signal')">
                    <template x-if="dev.wireless">
                      <div>
                        <template x-if="dev.signal_rssi">
                          <div class="text-slate-900 dark:text-slate-200 font-semibold" x-text="dev.signal_rssi + ' dBm'"></div>
                        </template>
                        <template x-if="dev.phy_rate || (dev.connectivity && dev.connectivity.rx_bitrate)">
                          <div class="text-[10px] text-slate-600 dark:text-slate-400" x-text="'PHY: ' + (dev.phy_rate || dev.connectivity.rx_bitrate)"></div>
                        </template>
                        <template x-if="!dev.signal_rssi && !dev.phy_rate && (!dev.connectivity || !dev.connectivity.rx_bitrate)">
                          <div class="text-[10px] text-slate-600 dark:text-slate-400" x-text="dev.connected ? 'Wi-Fi' : t('devices.status_offline')"></div>
                        </template>
                      </div>
                    </template>
                    <template x-if="!dev.wireless">
                      <div>
                        <div class="text-emerald-700 dark:text-emerald-400 font-bold" x-text="dev.ethernet_speed || t('dashboard.backhaul_wired')"></div>
                        <div class="text-[10px] text-slate-600 dark:text-slate-400" x-show="dev.ethernet_speed" x-text="t('dashboard.backhaul_wired')"></div>
                      </div>
                    </template>
                  </td>

                  <!-- Traffic (Download & Upload) -->
                  <td x-show="isTableColumnVisible('traffic')" class="device-traffic-cell py-2.5 px-2 font-mono whitespace-nowrap overflow-hidden" :data-label="t('devices.col_traffic')">
                    <template x-if="(dev.rx_bytes > 0 || dev.tx_bytes > 0 || dev.download_rate_mbps > 0.05 || dev.upload_rate_mbps > 0.05)">
                      <div class="flex flex-col leading-tight">
                        <span class="text-xs font-bold text-sky-600 dark:text-sky-400" :title="t('devices.traffic_dl_total') + ' ' + formatBytes(dev.tx_bytes || 0) + ' ' + t('devices.traffic_hw_estimate') + (dev.download_rate_mbps > 0.05 ? ' • ' + t('devices.traffic_realtime') + ' ' + dev.download_rate_mbps + ' Mbps' : '')">
                          ↓ <span x-text="formatBytes(dev.tx_bytes || 0)"></span>
                          <span x-show="dev.download_rate_mbps > 0.05" class="text-[10px] text-sky-500 dark:text-sky-400 font-medium ml-1" x-text="'(' + formatTrafficRate(dev.download_rate_mbps) + ')'"></span>
                        </span>
                        <span class="text-[10px] font-medium text-emerald-600 dark:text-emerald-400" :title="t('devices.traffic_ul_total') + ' ' + formatBytes(dev.rx_bytes || 0) + ' ' + t('devices.traffic_hw_estimate') + (dev.upload_rate_mbps > 0.05 ? ' • ' + t('devices.traffic_realtime') + ' ' + dev.upload_rate_mbps + ' Mbps' : '')">
                          ↑ <span x-text="formatBytes(dev.rx_bytes || 0)"></span>
                          <span x-show="dev.upload_rate_mbps > 0.05" class="text-[9px] text-emerald-500 dark:text-emerald-400 font-normal ml-1" x-text="'(' + formatTrafficRate(dev.upload_rate_mbps) + ')'"></span>
                        </span>
                      </div>
                    </template>
                    <template x-if="!(dev.rx_bytes > 0 || dev.tx_bytes > 0 || dev.download_rate_mbps > 0.05 || dev.upload_rate_mbps > 0.05) && !dev.wireless">
                      <div class="flex flex-col leading-tight cursor-help" :title="t('devices.wired_traffic_tooltip')">
                        <span class="text-xs font-semibold text-slate-400 dark:text-slate-500">
                          ↓ —
                        </span>
                        <span class="text-[10px] text-slate-400 dark:text-slate-500">
                          ↑ — <span class="text-[9px] text-slate-400/80 dark:text-slate-500/80 font-normal ml-0.5" x-text="'(' + t('devices.wired_tag') + ')'"></span>
                        </span>
                      </div>
                    </template>
                    <template x-if="!(dev.rx_bytes > 0 || dev.tx_bytes > 0 || dev.download_rate_mbps > 0.05 || dev.upload_rate_mbps > 0.05) && dev.wireless">
                      <div class="flex flex-col leading-tight">
                        <span class="text-xs font-bold text-sky-600/70 dark:text-sky-400/70" :title="t('devices.traffic_dl_total') + ' ' + formatBytes(dev.tx_bytes || 0) + ' ' + t('devices.traffic_hw_estimate')">
                          ↓ <span x-text="formatBytes(dev.tx_bytes || 0)"></span>
                        </span>
                        <span class="text-[10px] font-medium text-emerald-600/70 dark:text-emerald-400/70" :title="t('devices.traffic_ul_total') + ' ' + formatBytes(dev.rx_bytes || 0) + ' ' + t('devices.traffic_hw_estimate')">
                          ↑ <span x-text="formatBytes(dev.rx_bytes || 0)"></span>
                        </span>
                      </div>
                    </template>
                  </td>

                  <!-- First Seen (Issue #60) -->
                  <td x-show="isTableColumnVisible('first_seen')" class="device-first-seen-cell py-3 px-3 font-mono text-xs whitespace-nowrap" :data-label="t('devices.col_first_seen')">
                    <template x-if="dev.first_seen">
                      <div class="flex items-center space-x-1.5" :title="t('devices.first_seen_badge_tooltip') + ' ' + formatFirstSeenFull(dev.first_seen)">
                        <svg class="w-3.5 h-3.5 text-slate-400 dark:text-slate-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <span class="text-slate-700 dark:text-slate-300 font-medium" x-text="formatFirstSeenRelative(dev.first_seen)"></span>
                      </div>
                    </template>
                    <template x-if="!dev.first_seen">
                      <span class="text-slate-400 dark:text-slate-600 text-[11px]">—</span>
                    </template>
                  </td>

                  <!-- Status (Online/Offline) -->
                  <td x-show="isTableColumnVisible('status')" class="device-status-cell py-3 px-3 text-center whitespace-nowrap" :data-label="t('devices.col_status')">
                    <template x-if="dev.connected">
                      <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-100 dark:bg-emerald-950/60 text-emerald-950 dark:text-emerald-300 border border-emerald-400 dark:border-emerald-500/40 shadow-xs dark:shadow-none" x-text="t('devices.status_online')"></span>
                    </template>
                    <template x-if="!dev.connected">
                      <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-300 border border-slate-400 dark:border-slate-700 shadow-xs dark:shadow-none" x-text="t('devices.status_offline')"></span>
                    </template>
                  </td>

                  <!-- Action Buttons -->
                  <td class="py-3 px-4 text-right space-x-2 whitespace-nowrap">
                    <!-- Detail Modal Trigger -->
                    <button 
                      @click="openDeviceModal(dev)"
                      class="device-edit-button inline-flex items-center justify-center rounded-lg text-slate-400 hover:text-sky-400 hover:bg-sky-500/10 transition"
                      :title="t('devices.edit_rules')">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    </button>
                  </td>

                </tr>
              </template>

              <!-- Dynamic Empty State -->
              <template x-if="filteredDevices.length === 0">
                <tr class="device-empty-row">
                  <td :colspan="getActiveColumnsCount() + 2" class="py-12 px-4 text-center text-slate-500">
                    <div class="flex flex-col items-center justify-center space-y-2">
                      <svg class="w-8 h-8 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                      <span class="text-sm font-medium text-slate-400" x-text="t('devices.no_devices_found')"></span>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Devices Cards (Desktop >= md, when view mode is "cards") -->
      <div x-show="deviceViewMode === 'cards'" x-cloak class="device-cards hidden md:block">
        <div class="device-cards-grid grid grid-cols-3 xl:grid-cols-4 gap-3">
          <template x-for="dev in filteredDevices" :key="dev.mac || dev.mac_address">
            <div @click="openDeviceModal(dev)" @keydown.enter="openDeviceModal(dev)" tabindex="0" role="button"
                 class="device-card glass-panel rounded-xl p-2.5 border border-slate-200 dark:border-slate-800 shadow-sm hover:border-sky-500/40 hover:shadow-md transition cursor-pointer flex flex-col gap-2 min-w-0"
                 :data-activity="deviceActivityLevel(dev)"
                 :class="dev.connected ? '' : 'opacity-70'">

              <!-- Header: icon + live dot, name, category, status + edit -->
              <div class="flex items-start gap-3 min-w-0">
                <div class="relative shrink-0 w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-sky-600 dark:text-sky-400">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" :d="getDeviceIconPath(dev.custom_icon || dev.category || dev.device_type)"></path></svg>
                  <span class="absolute -top-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-white dark:border-slate-900"
                        :class="[dev.connected ? 'bg-emerald-500 shadow-xs shadow-emerald-500/50' : 'bg-slate-400', deviceActivityLevel(dev) > 0 ? 'device-live-dot' : '']"
                        :title="dev.connected ? t('devices.status_online') : t('devices.status_offline')"></span>
                </div>
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-1.5 min-w-0">
                    <span class="font-bold text-sm text-slate-900 dark:text-white truncate" :title="dev.custom_name || dev.nickname || dev.hostname || t('devices.generic_device')" x-text="dev.custom_name || dev.nickname || dev.hostname || t('devices.generic_device')"></span>
                    <template x-if="dev.is_favorite"><span class="text-amber-500 text-xs shrink-0" :title="t('devices.filter_favorites')">⭐</span></template>
                    <template x-if="dev.is_new">
                      <span @click.stop="if (can('action_edit_devices')) setDevicesSeen([dev.mac || dev.mac_address])"
                            class="shrink-0 text-[9px] font-black px-1.5 py-0.5 rounded uppercase tracking-wider bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border border-emerald-400/40 dark:border-emerald-500/40"
                            :title="can('action_edit_devices') ? t('devices.new_badge_click_hint') : ''" x-text="t('devices.new_badge')"></span>
                    </template>
                  </div>
                  <div class="flex items-center justify-between gap-2 text-[11px] text-slate-600 dark:text-slate-500 min-w-0">
                    <span class="truncate" :title="deviceVendorLabel(dev)" x-text="formatCategoryName(dev.category) + (deviceVendorLabel(dev) ? ' · ' + deviceVendorLabel(dev) : '')"></span>
                    <span class="font-mono text-[9px] text-slate-500 dark:text-slate-400 shrink-0" x-text="dev.mac || dev.mac_address"></span>
                  </div>
                </div>
                <div class="shrink-0 flex items-center gap-1.5">
                  <button type="button" @click.stop="openDeviceModal(dev)" :title="t('devices.edit_rules')" :aria-label="t('devices.edit_rules')"
                          class="inline-flex items-center justify-center p-1 rounded-lg text-slate-400 hover:text-sky-400 hover:bg-sky-500/10 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                  </button>
                </div>
              </div>

              <!-- Address: IP + Static/DHCP on the left, MAC on the right -->
              <div class="flex items-center gap-2 font-mono min-w-0" >
                <div class="flex items-center gap-2 min-w-0">
                  <span class="text-xs font-bold text-slate-900 dark:text-slate-200 shrink-0" x-text="dev.ip || '---'"></span>
                  <span class="px-1.5 py-0.5 rounded text-[9px] font-extrabold tracking-wider border shrink-0"
                        :class="dev.is_static ? 'bg-emerald-100 dark:bg-emerald-950/60 text-emerald-950 dark:text-emerald-300 border-emerald-400 dark:border-emerald-500/40' : 'bg-slate-200 dark:bg-slate-800 text-slate-900 dark:text-slate-200 border-slate-400 dark:border-slate-600'"
                        x-text="dev.is_static ? t('devices.badge_static') : t('devices.badge_dhcp')"></span>
                </div>
                <span class="ml-auto shrink-0 px-2 py-0.5 rounded-full text-[9px] font-extrabold border"
                      :class="dev.connected ? 'bg-emerald-100 dark:bg-emerald-950/60 text-emerald-950 dark:text-emerald-300 border-emerald-400 dark:border-emerald-500/40' : 'bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-300 border-slate-400 dark:border-slate-700'"
                      x-text="dev.connected ? t('devices.status_online') : t('devices.status_offline')"></span>
              </div>

              <!-- Connection + flag badges on one wrapping row -->
              <div class="flex flex-wrap items-center gap-x-1.5 gap-y-1 text-[10px]" :title="dev.wireless && (dev.phy_rate || (dev.connectivity && dev.connectivity.rx_bitrate)) ? 'PHY ' + (dev.phy_rate || dev.connectivity.rx_bitrate) : ''">
                <span class="px-2 py-0.5 rounded font-mono font-extrabold border"
                      :class="dev.wireless ? 'bg-indigo-100 dark:bg-indigo-950/60 text-indigo-950 dark:text-indigo-300 border-indigo-400 dark:border-indigo-500/40' : 'bg-emerald-100 dark:bg-emerald-950/60 text-emerald-950 dark:text-emerald-300 border-emerald-400 dark:border-emerald-500/40'"
                      x-text="deviceBandLabel(dev)"></span>
                <template x-if="dev.channel"><span class="font-mono font-bold text-slate-700 dark:text-slate-300">CH <span x-text="dev.channel"></span></span></template>
                <template x-if="dev.wireless && dev.signal_rssi">
                  <span class="inline-flex items-center gap-1 font-mono font-semibold text-slate-900 dark:text-slate-200">
                    <span class="rssi-bar" aria-hidden="true"><template x-for="n in 5" :key="n"><span :style="'height:' + (n * 20) + '%;' + (n <= deviceSignalBars(dev) ? 'background-color:#10b981' : '')"></span></template></span>
                    <span x-text="dev.signal_rssi + ' dBm'"></span>
                  </span>
                </template>
                <template x-if="dev.wireless && (dev.phy_rate || (dev.connectivity && dev.connectivity.rx_bitrate))">
                  <span class="font-mono text-slate-600 dark:text-slate-400" x-text="(dev.phy_rate || dev.connectivity.rx_bitrate).replace(' MBit/s', ' Mb').replace(' Mbit/s', ' Mb')"></span>
                </template>
                <template x-if="!dev.wireless">
                  <span class="font-mono font-bold text-emerald-700 dark:text-emerald-400" x-text="dev.ethernet_speed || t('dashboard.backhaul_wired')"></span>
                </template>
                <template x-if="dev.wireless && (dev.phy_type || dev.channel_width)">
                  <span class="font-mono text-slate-600 dark:text-slate-400" :title="t('device_modal.wifi_standard') + ' / ' + t('device_modal.channel_width')" x-text="[dev.phy_type, dev.channel_width].filter(Boolean).join(' ')"></span>
                </template>
                <template x-if="dev.is_guest">
                  <span class="px-1.5 py-0.5 rounded font-bold bg-violet-100 dark:bg-violet-950/60 text-violet-800 dark:text-violet-300 border border-violet-300 dark:border-violet-500/30" x-text="t('devices.badge_guest')" :title="t('device_modal.guest_network')"></span>
                </template>
                <template x-if="dev.is_paused || dev.paused || dev.is_local_paused">
                  <span class="px-1.5 py-0.5 rounded font-bold bg-rose-500/15 text-rose-700 dark:text-rose-300 border border-rose-300 dark:border-rose-500/30" x-text="'⏸'" :title="t('devices.badge_paused')"></span>
                </template>
                <template x-if="dev.is_low_latency_target">
                  <span class="px-1.5 py-0.5 rounded font-bold bg-rose-500/15 dark:bg-rose-500/20 text-rose-700 dark:text-rose-400 border border-rose-300 dark:border-rose-500/30" x-text="'🎮'" :title="t('devices.badge_gaming_target')"></span>
                </template>
                <template x-if="dev.roaming_advisor && dev.roaming_advisor.is_sticky">
                  <span class="px-1.5 py-0.5 rounded font-bold bg-amber-500/15 text-amber-700 dark:text-amber-400 border border-amber-300 dark:border-amber-500/30 cursor-help" :title="t('devices.sticky_roaming_badge') + ' — ' + localized(dev.roaming_advisor, 'advice')">🔄</span>
                </template>
                <template x-if="dev.ipv6 || (dev.ipv6_all && dev.ipv6_all.length)">
                  <span class="px-1.5 py-0.5 rounded font-bold bg-sky-100 dark:bg-sky-950/60 text-sky-800 dark:text-sky-300 border border-sky-300 dark:border-sky-500/30" :title="(dev.ipv6_all || [dev.ipv6]).join('\n')">IPv6</span>
                </template>
                <template x-if="dev.has_discovered_ips || (dev.ipv6_details && dev.ipv6_details.some(d => d.origin === 'ndp_discovered'))">
                  <span class="px-1.5 py-0.5 rounded font-bold bg-fuchsia-100 dark:bg-fuchsia-950/60 text-fuchsia-800 dark:text-fuchsia-300 border border-fuchsia-400 dark:border-fuchsia-500/40" :title="t('devices.badge_ula_enriched') + ' — ' + t('devices.badge_ula_enriched_tooltip')">ULA</span>
                </template>
              </div>

              <!-- Notes (only when set) -->
              <template x-if="dev.custom_notes">
                <div class="text-[11px] italic text-slate-500 dark:text-slate-400 truncate" :title="dev.custom_notes" x-text="dev.custom_notes"></div>
              </template>

              <!-- Live throughput, download and upload side by side: arrows bob, bars shimmer, card glows when moving data -->
              <div class="grid grid-cols-2 gap-2.5 font-mono">
                <div class="min-w-0" :title="t('devices.traffic_dl_total') + ' ' + formatBytes(dev.tx_bytes || 0)">
                  <div class="flex items-baseline justify-between gap-1 text-[11px]">
                    <span class="font-bold text-sky-600 dark:text-sky-400 truncate"><span class="device-arrow-down">↓</span> <span class="rounded px-0.5" x-text="dev.connected ? deviceRateLabel(dev.download_rate_mbps) : '0 Mbps'" x-effect="dev.download_rate_mbps; $el.classList.remove('rate-tick'); void $el.offsetWidth; if (dev.download_rate_mbps > 0.05) $el.classList.add('rate-tick')"></span></span>
                    <span class="text-[9px] text-slate-500 dark:text-slate-400 shrink-0" x-text="formatBytes(dev.tx_bytes || 0)"></span>
                    
                  </div>
                  <div class="device-activity-track mt-1"><div class="device-activity-fill is-down" :style="'width:' + (dev.connected ? deviceRatePercent(dev.download_rate_mbps) : 0) + '%'"></div></div>
                </div>
                <div class="min-w-0" :title="t('devices.traffic_ul_total') + ' ' + formatBytes(dev.rx_bytes || 0)">
                  <div class="flex items-baseline justify-between gap-1 text-[11px]">
                    <span class="font-bold text-emerald-600 dark:text-emerald-400 truncate"><span class="device-arrow-up">↑</span> <span class="rounded px-0.5" x-text="dev.connected ? deviceRateLabel(dev.upload_rate_mbps) : '0 Mbps'" x-effect="dev.upload_rate_mbps; $el.classList.remove('rate-tick'); void $el.offsetWidth; if (dev.upload_rate_mbps > 0.05) $el.classList.add('rate-tick')"></span></span>
                    <span class="text-[9px] text-slate-500 dark:text-slate-400 shrink-0" x-text="formatBytes(dev.rx_bytes || 0)"></span>
                    
                  </div>
                  <div class="device-activity-track mt-1"><div class="device-activity-fill is-up" :style="'width:' + (dev.connected ? deviceRatePercent(dev.upload_rate_mbps) : 0) + '%'"></div></div>
                </div>
              </div>

              <!-- Footer: profile, node, first seen on a single line -->
              <div class="mt-auto pt-2 border-t border-slate-200 dark:border-slate-800/60 flex items-center justify-between gap-2 min-w-0 text-[11px] text-slate-600 dark:text-slate-400">
                <div class="min-w-0 flex items-center gap-1.5 truncate">
                  <span class="truncate" :title="dev.profile_name || t('profiles.total_unassigned')">
                    <span>👤</span> <span :class="dev.profile_name ? 'font-semibold text-slate-700 dark:text-slate-300' : 'italic'" x-text="dev.profile_name || t('profiles.total_unassigned')"></span>
                  </span>
                  <span class="text-slate-400 dark:text-slate-600">•</span>
                  <span class="truncate" :title="t('devices.col_node')" x-text="dev.connected_eero_name || t('common.gateway')"></span>
                </div>
                <template x-if="!dev.connected && dev.last_active">
                  <div class="shrink-0 inline-flex items-center gap-1 text-[10px]" :title="t('device_modal.last_active') + ' ' + formatFirstSeenFull(dev.last_active)">
                    <span x-text="t('devices.last_seen_short')"></span>
                    <span class="font-mono" x-text="formatFirstSeenRelative(dev.last_active)"></span>
                  </div>
                </template>
                <template x-if="(dev.connected || !dev.last_active) && dev.first_seen">
                  <div class="shrink-0 inline-flex items-center gap-1 text-[10px]" :title="t('devices.first_seen_badge_tooltip') + ' ' + formatFirstSeenFull(dev.first_seen)">
                    <span class="font-mono" x-text="formatFirstSeenRelative(dev.first_seen)"></span>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
        <div x-show="filteredDevices.length === 0" class="py-12 text-center text-slate-500">
          <p class="text-sm font-semibold" x-text="t('devices.no_devices_found')"></p>
        </div>
      </div>

      <!-- MOBILE DEVICES CARDS LIST (< 768px) -->
      <div class="md:hidden space-y-2.5 select-none">
        <template x-for="dev in filteredDevices" :key="dev.mac || dev.mac_address">
          <div 
            @click="openDeviceModal(dev)"
            class="p-3.5 rounded-2xl bg-white dark:bg-[#262626] border border-black/[0.06] dark:border-white/[0.08] shadow-xs active:scale-[0.98] transition cursor-pointer hover:border-sky-500/40">
            
            <div class="flex items-center justify-between gap-3">
              <!-- Left: Device Icon with online/offline dot -->
              <div class="relative shrink-0 w-11 h-11 rounded-xl bg-slate-100 dark:bg-slate-800/90 border border-slate-200/60 dark:border-white/[0.06] flex items-center justify-center text-sky-600 dark:text-sky-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" :d="getDeviceIconPath(dev.category)"></path>
                </svg>
                <!-- Online status dot -->
                <span class="absolute -top-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-white dark:border-[#262626]" 
                      :class="dev.connected ? 'bg-emerald-500 shadow-xs shadow-emerald-500/50' : 'bg-slate-400'"></span>
              </div>

              <!-- Center: Device Main Info -->
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="font-bold text-sm text-slate-900 dark:text-white truncate" x-text="dev.custom_name || dev.nickname || dev.hostname || t('devices.generic_device')"></span>
                  <template x-if="dev.is_new">
                    <span
                      @click="if (can('action_edit_devices')) { $event.stopPropagation(); setDevicesSeen([dev.mac || dev.mac_address]); }"
                      class="text-[9px] font-black px-1.5 py-0.5 rounded uppercase tracking-wider bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border border-emerald-400/40 dark:border-emerald-500/40"
                      :title="can('action_edit_devices') ? t('devices.new_badge_click_hint') : ''"
                      x-text="t('devices.new_badge')"></span>
                  </template>
                  <template x-if="dev.is_favorite">
                    <span class="text-amber-500 text-xs">⭐</span>
                  </template>
                  <!-- Band / Wired badge -->
                  <span class="text-[9px] font-bold px-1.5 py-0.5 rounded uppercase whitespace-nowrap" 
                        :class="dev.wireless ? 'bg-sky-500/15 text-sky-700 dark:text-sky-300' : 'bg-slate-500/15 text-slate-700 dark:text-slate-300'"
                        x-text="dev.wireless ? (dev.frequency ? dev.frequency.replace(' ', '') : 'Wi-Fi') : t('devices.wired_tag')"></span>
                  <!-- Sticky Roaming badge -->
                  <template x-if="dev.roaming_advisor && dev.roaming_advisor.is_sticky">
                    <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-700 dark:text-amber-300 whitespace-nowrap" x-text="t('devices.sticky_badge')"></span>
                  </template>
                </div>
                
                <div class="flex items-center gap-1.5 text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                  <span class="font-mono text-[11px] text-slate-600 dark:text-slate-300 font-semibold" x-text="dev.ip || 'No IP'"></span>
                  <span>•</span>
                  <span class="truncate" x-text="dev.connected_eero_name || t('common.gateway')"></span>
                  <template x-if="dev.first_seen && formatFirstSeenRelative(dev.first_seen)">
                    <span class="inline-flex items-center gap-1 text-[10px] text-slate-400 dark:text-slate-500 shrink-0" :title="t('device_modal.first_seen') + ' ' + formatFirstSeenFull(dev.first_seen)">
                      <span>•</span>
                      <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                      <span x-text="formatFirstSeenRelative(dev.first_seen)"></span>
                    </span>
                  </template>
                </div>
              </div>

              <!-- Right: Real-time speed / signal & Chevron -->
              <div class="shrink-0 flex items-center gap-2 text-right">
                <div class="flex flex-col items-end">
                  <template x-if="dev.connected && (dev.rx_rate > 0.05 || dev.tx_rate > 0.05)">
                    <div class="flex flex-col items-end leading-tight">
                      <template x-if="dev.rx_rate > 0.05">
                        <span class="font-mono text-[11px] font-bold text-sky-600 dark:text-sky-400" x-text="'↓ ' + formatSpeed(dev.rx_rate)"></span>
                      </template>
                      <template x-if="dev.tx_rate > 0.05">
                        <span class="font-mono text-[10px] font-medium text-emerald-600 dark:text-emerald-400" x-text="'↑ ' + formatSpeed(dev.tx_rate)"></span>
                      </template>
                    </div>
                  </template>
                  <template x-if="dev.connected && dev.wireless && dev.signal_bars">
                    <span class="text-[11px] font-medium text-slate-500 dark:text-slate-400" x-text="'📶 ' + dev.signal_bars + '/5'"></span>
                  </template>
                  <template x-if="dev.connected && !dev.wireless">
                    <span class="text-[10px] font-medium text-slate-500 dark:text-slate-400">🔌 GbE</span>
                  </template>
                  <template x-if="!dev.connected">
                    <span class="text-[10px] text-slate-400 font-semibold uppercase" x-text="t('devices.status_offline')"></span>
                  </template>
                </div>
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              </div>
            </div>
          </div>
        </template>

        <!-- Empty state on mobile -->
        <div x-show="filteredDevices.length === 0" class="py-12 text-center text-slate-500">
          <p class="text-sm font-semibold" x-text="t('devices.no_devices_found')"></p>
        </div>
      </div>
    </div>
