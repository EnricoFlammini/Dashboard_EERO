                </div>
              </div>

                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- State B: Update Available (Strict Mutual Exclusion: only when !is_up_to_date) -->
          <template x-if="!eeroNewsData.is_up_to_date">
            <div class="rounded-2xl p-6 bg-gradient-to-r from-amber-500/15 via-sky-500/10 to-transparent border border-amber-500/30 backdrop-blur-xl shadow-sm space-y-4">
              <div class="flex items-start justify-between">
                <div class="flex items-center space-x-3.5">
                  <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-600 dark:text-amber-400 flex items-center justify-center shrink-0 border border-amber-500/40 animate-pulse">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                  </div>
                  <div>
                    <div class="flex flex-wrap items-center gap-2">
                      <h3 class="text-sm sm:text-base font-bold text-slate-900 dark:text-white" x-text="t('eero_news.update_avail_title').replace('{version}', eeroNewsData.target_firmware || eeroNewsData.latest_firmware)"></h3>
                      <span class="inline-flex items-center font-mono text-[9px] font-bold px-1.5 py-0.5 rounded-md bg-amber-500/20 text-amber-800 dark:text-amber-300 border border-amber-500/40 uppercase whitespace-nowrap shrink-0" x-text="t('eero_news.badge_rolling_release')"></span>
                    </div>
                    <p class="text-xs text-slate-600 dark:text-slate-300 mt-0.5 leading-relaxed" x-text="t('eero_news.update_avail_desc').replace('{current}', eeroNewsData.current_firmware || t('eero_news.firmware_unknown'))"></p>

                </div>
                <div class="hidden sm:flex items-center space-x-2 text-[11px] font-mono text-slate-400">

                  <span x-text="new Date(eeroNewsData.last_checked).toLocaleTimeString(dateLocale(), {hour: '2-digit', minute:'2-digit'})"></span>
                </div>
              </div>

                      <span class="font-mono text-[10px]" :class="node.os_version === (eeroNewsData.target_firmware || eeroNewsData.latest_firmware) ? 'text-emerald-500 font-bold' : 'text-amber-600 dark:text-amber-400 font-bold'" x-text="(node.os_version ? '(' + node.os_version + ')' : '')"></span>

                </div>
                <div class="text-xs text-slate-500 dark:text-slate-400 flex items-center space-x-3">
                  <div><span class="font-semibold text-slate-700 dark:text-slate-300" x-text="t('eero_news.installed_version')"></span> <span class="font-mono font-bold" x-text="eeroNewsData.current_firmware || t('eero_news.firmware_unknown')"></span></div>
                  <div>→</div>
                  <div><span class="font-semibold text-slate-700 dark:text-slate-300" x-text="t('eero_news.latest_release')"></span> <span class="font-mono font-bold text-sky-600 dark:text-sky-400" x-text="eeroNewsData.target_firmware || eeroNewsData.latest_firmware"></span></div>
                </div>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- Releases Accordion Filter Bar & Controls -->

          <button 
            @click="setEeroNewsFilter('all')"
            :class="eeroNewsFilter === 'all' ? 'bg-[#0067c0] text-white dark:bg-sky-500' : 'bg-black/[0.04] dark:bg-white/[0.06] text-slate-700 dark:text-slate-300 hover:bg-black/[0.08] dark:hover:bg-white/[0.1]'"
            class="px-3 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer"
            x-text="t('eero_news.filter_all')">
          </button>
          <button 
            @click="setEeroNewsFilter('security')"
            :class="eeroNewsFilter === 'security' ? 'bg-rose-600 text-white' : 'bg-black/[0.04] dark:bg-white/[0.06] text-slate-700 dark:text-slate-300 hover:bg-black/[0.08] dark:hover:bg-white/[0.1]'"

            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            <span x-text="t('eero_news.filter_security')"></span>
          </button>
          <button 
            @click="setEeroNewsFilter('wifi7')"
            :class="eeroNewsFilter === 'wifi7' ? 'bg-sky-600 text-white' : 'bg-black/[0.04] dark:bg-white/[0.06] text-slate-700 dark:text-slate-300 hover:bg-black/[0.08] dark:hover:bg-white/[0.1]'"
            class="px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center space-x-1 cursor-pointer">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path></svg>
            <span x-text="t('eero_news.filter_wifi7')"></span>
          </button>
          <button 
            @click="setEeroNewsFilter('stability')"
            :class="eeroNewsFilter === 'stability' ? 'bg-emerald-600 text-white' : 'bg-black/[0.04] dark:bg-white/[0.06] text-slate-700 dark:text-slate-300 hover:bg-black/[0.08] dark:hover:bg-white/[0.1]'"

            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            <span x-text="t('eero_news.filter_stability')"></span>
          </button>
        </div>

        <!-- Right Expand/Collapse All -->
        <div class="flex items-center space-x-2 w-full md:w-auto justify-end">
          <span class="text-xs text-slate-400 font-mono mr-2" x-text="!eeroNewsShowAllReleases && filteredEeroReleases.length > eeroNewsDefaultLimit ? t('eero_news.showing_count', { shown: visibleEeroReleases.length, total: filteredEeroReleases.length }) : t('eero_news.total_count', { total: filteredEeroReleases.length })"></span>
          <button 
            @click="expandAllReleases()" 
            class="px-2.5 py-1 text-xs font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white bg-black/[0.03] dark:bg-white/[0.05] rounded-lg transition cursor-pointer"
            x-text="t('eero_news.expand_all')">
          </button>
          <button 
            @click="collapseAllReleases()" 
            class="px-2.5 py-1 text-xs font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white bg-black/[0.03] dark:bg-white/[0.05] rounded-lg transition cursor-pointer"
            x-text="t('eero_news.collapse_all')">
          </button>
        </div>
      </div>

      <!-- Releases Accordion List -->
      <div class="space-y-3">
        <template x-for="rel in visibleEeroReleases" :key="rel.version">
          <div class="glass-panel rounded-2xl overflow-hidden transition-all duration-200 border border-black/[0.06] dark:border-white/[0.08] hover:border-black/[0.12] dark:hover:border-white/[0.15]">

            <button 
              @click="toggleReleaseAccordion(rel.version)"

                <div class="flex flex-wrap items-center gap-1.5 sm:gap-2 mb-1.5">
                  <!-- Version Pill -->

                    <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span x-text="rel.release_date"></span>
                  </span>

                  <!-- Installed on Local Fleet Badge -->
                  <template x-if="eeroNewsData && eeroNewsData.current_firmware === rel.version">
                    <span class="text-[9px] sm:text-[10px] font-bold px-1.5 sm:px-2 py-0.5 rounded-md bg-[#0067c0]/15 text-[#0067c0] dark:bg-sky-500/20 dark:text-sky-300 border border-[#0067c0]/30 dark:border-sky-500/40 inline-flex items-center space-x-1 whitespace-nowrap shrink-0">
                      <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                      <span x-text="t('eero_news.installed_on_network')"></span>
                    </span>
                  </template>

                    <span class="text-[9px] sm:text-[10px] font-bold px-1.5 sm:px-2 py-0.5 rounded-md bg-rose-500/15 text-rose-700 dark:text-rose-300 border border-rose-500/30 inline-flex items-center space-x-1 whitespace-nowrap shrink-0">
                      <svg class="w-3 h-3 text-rose-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>

                      x-text="newsTagLabel(tag)">

              <!-- Chevron Toggle -->
              <div class="shrink-0 p-1 rounded-lg text-slate-400 group-hover:text-slate-600 dark:group-hover:text-slate-200">
                <svg 
                  class="w-5 h-5 transition-transform duration-200" 
                  :class="eeroNewsExpandedVersions[rel.version] ? 'rotate-180 text-sky-500' : ''" 
                  fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
              </div>
            </button>

            <!-- Accordion Expanded Body -->
            <div 
              x-show="eeroNewsExpandedVersions[rel.version]"

            </div>

        <!-- Expand / Collapse More Releases Button (Fluent Design) -->
        <template x-if="filteredEeroReleases.length > eeroNewsDefaultLimit">

            <button 
              @click="toggleShowAllReleases()" 
              class="w-full sm:w-auto px-5 py-2.5 rounded-xl text-xs font-semibold bg-black/[0.03] dark:bg-white/[0.05] hover:bg-black/[0.06] dark:hover:bg-white/[0.08] text-slate-700 dark:text-slate-200 border border-black/[0.08] dark:border-white/[0.1] shadow-sm hover:shadow transition flex items-center justify-center space-x-2 cursor-pointer group">

                x-show="!eeroNewsShowAllReleases"

                class="w-4 h-4 text-slate-500 dark:text-slate-400 group-hover:text-slate-800 dark:group-hover:text-white transition-transform group-hover:-translate-y-0.5" 
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
