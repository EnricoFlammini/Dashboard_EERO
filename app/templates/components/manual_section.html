    <!-- =================================================================== -->
    <!-- TAB 6: BUILT-IN INTERACTIVE USER MANUAL -->
    <!-- =================================================================== -->
    <div x-show="currentTab === 'manual'" class="space-y-6 animate-fade-in" style="display: none;">
      
      <!-- Manual Header & Search Bar -->
      <div class="glass-panel rounded-2xl p-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div>
          <h2 class="text-xl font-bold text-white" x-text="t('manual.title')"></h2>
          <p class="text-xs text-slate-400 mt-1" x-text="t('manual.subtitle')"></p>
        </div>
        <div class="w-full md:w-80">
          <input 
            type="text" 
            x-model="manualSearchQuery" 
            :placeholder="t('manual.search_placeholder')"
            class="glass-input w-full px-4 py-2 rounded-xl text-xs">
        </div>
      </div>

      <!-- Manual Content Layout -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Sidebar: Chapter List -->
        <div class="glass-panel rounded-2xl p-4 space-y-1">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 px-3 py-2" x-text="t('manual.chapters_title')"></h3>
          <div class="space-y-1">
            <template x-for="section in filteredManualSections" :key="section.id">
              <button 
                @click="selectedManualSection = section"
                :class="selectedManualSection && selectedManualSection.id === section.id ? 'bg-sky-50 dark:bg-sky-500/15 text-sky-700 dark:text-sky-400 border-sky-300 dark:border-sky-500/30' : 'text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800/60 border-transparent'"
                class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold border transition flex items-center justify-between cursor-pointer">
                <span x-text="section.title"></span>
                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
              </button>
            </template>
          </div>
        </div>

        <!-- Right Content: Chapter Reading View -->
        <div class="lg:col-span-2 glass-panel rounded-2xl p-8">
          <template x-if="selectedManualSection">
            <div>
              <div class="border-b border-slate-200 dark:border-slate-800 pb-4 mb-6">
                <h2 class="text-2xl font-bold text-slate-900 dark:text-white" x-text="selectedManualSection.title"></h2>
                <p class="text-xs text-sky-600 dark:text-sky-400 mt-1" x-text="selectedManualSection.summary"></p>
              </div>
              <div class="manual-content text-sm" x-html="renderSimpleMarkdown(selectedManualSection.content)"></div>
            </div>
          </template>
        </div>

      </div>

    </div>
