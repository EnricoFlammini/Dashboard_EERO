          </button>

      <!-- SEZIONE 1: QUALITÀ SEGNALE WI-FI & COPERTURA MESH -->

              <span x-text="t('speedtest.signal_section_title')"></span>
            </h3>
            <p class="text-xs text-slate-600 dark:text-slate-400" x-text="t('speedtest.signal_section_subtitle')"></p>
          </div>
        </div>

        <!-- KPI & Distribution Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
          <!-- Average RSSI -->
          <div class="glass-panel rounded-2xl p-4 border border-sky-300 dark:border-sky-500/20 flex flex-col justify-between">
            <span class="text-slate-600 dark:text-slate-400 text-xs font-medium" x-text="t('speedtest.signal_avg_kpi')"></span>
            <div class="flex items-baseline space-x-1.5 my-2">
              <span class="text-2xl font-bold font-mono text-slate-900 dark:text-white" x-text="signalOverview.average_rssi ? signalOverview.average_rssi : '---'"></span>

            </div>
            <span 
              class="inline-block px-2 py-0.5 rounded text-[10px] font-bold text-center"
              :class="{
                'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30': signalOverview.average_rssi >= -50,
                'bg-sky-500/20 text-sky-400 border border-sky-500/30': signalOverview.average_rssi < -50 && signalOverview.average_rssi >= -65,
                'bg-amber-500/20 text-amber-400 border border-amber-500/30': signalOverview.average_rssi < -65 && signalOverview.average_rssi >= -75,
                'bg-rose-500/20 text-rose-400 border border-rose-500/30': signalOverview.average_rssi < -75
              }"
              x-text="signalOverview.average_rssi >= -50 ? t('speedtest.signal_excellent') : (signalOverview.average_rssi >= -65 ? t('speedtest.signal_good') : (signalOverview.average_rssi >= -75 ? t('speedtest.signal_fair') : t('speedtest.signal_weak')))">
            </span>
          </div>

          <!-- Excellent -->
          <div class="glass-panel rounded-2xl p-4 border border-slate-200 dark:border-slate-800 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center text-xs mb-1">
                <span class="text-emerald-600 dark:text-emerald-400 font-semibold flex items-center space-x-1">
                  <span class="w-2 h-2 rounded-full bg-emerald-500 dark:bg-emerald-400"></span>
                  <span x-text="t('speedtest.signal_excellent')"></span>
                </span>
                <span class="text-slate-800 dark:text-slate-300 font-mono font-bold text-xs" x-text="signalOverview.excellent_count + ' (' + signalOverview.excellent_pct + '%)'"></span>
              </div>
              <div class="text-[10px] text-slate-500 dark:text-slate-400 mb-2" x-text="t('speedtest.signal_range_excellent')">≥ -50 dBm</div>
            </div>
            <div class="w-full bg-slate-200 dark:bg-slate-800 rounded-full h-1.5 overflow-hidden">
              <div class="bg-emerald-500 h-1.5 rounded-full" :style="`width: ${signalOverview.excellent_pct}%`"></div>
            </div>
          </div>

          <!-- Good -->
          <div class="glass-panel rounded-2xl p-4 border border-slate-200 dark:border-slate-800 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center text-xs mb-1">
                <span class="text-sky-600 dark:text-sky-400 font-semibold flex items-center space-x-1">
                  <span class="w-2 h-2 rounded-full bg-sky-500 dark:bg-sky-400"></span>
                  <span x-text="t('speedtest.signal_good')"></span>
                </span>
                <span class="text-slate-800 dark:text-slate-300 font-mono font-bold text-xs" x-text="signalOverview.good_count + ' (' + signalOverview.good_pct + '%)'"></span>
              </div>
              <div class="text-[10px] text-slate-500 dark:text-slate-400 mb-2" x-text="t('speedtest.signal_range_good')">-51 to -65 dBm</div>
            </div>
            <div class="w-full bg-slate-200 dark:bg-slate-800 rounded-full h-1.5 overflow-hidden">
              <div class="bg-sky-500 h-1.5 rounded-full" :style="`width: ${signalOverview.good_pct}%`"></div>
            </div>
          </div>

          <!-- Fair -->
          <div class="glass-panel rounded-2xl p-4 border border-slate-200 dark:border-slate-800 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center text-xs mb-1">
                <span class="text-amber-600 dark:text-amber-400 font-semibold flex items-center space-x-1">
                  <span class="w-2 h-2 rounded-full bg-amber-500 dark:bg-amber-400"></span>
                  <span x-text="t('speedtest.signal_fair')"></span>
                </span>
                <span class="text-slate-800 dark:text-slate-300 font-mono font-bold text-xs" x-text="signalOverview.fair_count + ' (' + signalOverview.fair_pct + '%)'"></span>
              </div>
              <div class="text-[10px] text-slate-500 dark:text-slate-400 mb-2" x-text="t('speedtest.signal_range_fair')">-66 to -75 dBm</div>
            </div>
            <div class="w-full bg-slate-200 dark:bg-slate-800 rounded-full h-1.5 overflow-hidden">
              <div class="bg-amber-500 h-1.5 rounded-full" :style="`width: ${signalOverview.fair_pct}%`"></div>
            </div>
          </div>

          <!-- Weak / Critical -->
          <div class="glass-panel rounded-2xl p-4 border border-slate-200 dark:border-slate-800 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center text-xs mb-1">
                <span class="text-rose-600 dark:text-rose-400 font-semibold flex items-center space-x-1">
                  <span class="w-2 h-2 rounded-full bg-rose-500 dark:bg-rose-400"></span>
                  <span x-text="t('speedtest.signal_weak')"></span>
                </span>
                <span class="text-slate-800 dark:text-slate-300 font-mono font-bold text-xs" x-text="signalOverview.weak_count + ' (' + signalOverview.weak_pct + '%)'"></span>
              </div>
              <div class="text-[10px] text-slate-500 dark:text-slate-400 mb-2" x-text="t('speedtest.signal_range_weak')">&lt; -75 dBm</div>
            </div>
            <div class="w-full bg-slate-200 dark:bg-slate-800 rounded-full h-1.5 overflow-hidden">
              <div class="bg-rose-500 h-1.5 rounded-full" :style="`width: ${signalOverview.weak_pct}%`"></div>
            </div>
          </div>
        </div>

        <!-- Historical Signal Chart by Device -->
        <div class="glass-panel rounded-2xl p-6 space-y-4 w-full">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div class="min-w-[200px]">
              <h4 class="text-base font-bold text-slate-900 dark:text-white" x-text="t('speedtest.signal_chart_title')"></h4>
              <p class="text-xs text-slate-600 dark:text-slate-400" x-text="t('quality_analytics.chart_signal_subtitle')"></p>
            </div>

            <!-- Controls: Device selector & Time range -->
            <div class="flex flex-wrap items-center gap-2">
              <select 
                x-model="selectedSignalDeviceMac" 
                @change="loadDeviceSignalHistory()"
                class="glass-input px-3 py-1.5 rounded-xl text-xs bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-sky-500 max-w-xs">
                <template x-for="d in (signalOverview.devices || [])" :key="d.mac_address">
                  <option :value="d.mac_address" :selected="d.mac_address === selectedSignalDeviceMac" x-text="(d.hostname || d.mac_address) + ' (' + (d.signal_rssi ? d.signal_rssi + ' dBm' : '') + ')'"></option>
                </template>
              </select>

              <div class="flex rounded-xl bg-slate-100 dark:bg-slate-900/80 p-0.5 border border-slate-200 dark:border-slate-800 text-xs shrink-0">
                <button 
                  @click="signalHistoryHours = 24; loadDeviceSignalHistory()" 
                  :class="signalHistoryHours === 24 ? 'bg-sky-500/15 dark:bg-sky-500/20 text-sky-700 dark:text-sky-400 font-bold' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'"
                  class="px-2.5 py-1 rounded-lg transition cursor-pointer" x-text="t('speedtest.time_range_24h')">
                </button>
                <button 
                  @click="signalHistoryHours = 168; loadDeviceSignalHistory()" 
                  :class="signalHistoryHours === 168 ? 'bg-sky-500/15 dark:bg-sky-500/20 text-sky-700 dark:text-sky-400 font-bold' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'"
                  class="px-2.5 py-1 rounded-lg transition cursor-pointer" x-text="t('speedtest.time_range_7d')">
                </button>
              </div>
            </div>
          </div>

          <div class="chart-frame">
            <canvas id="deviceSignalChart" style="width: 100%; height: 100%; display: block;"></canvas>
          </div>
        </div>

        <!-- Weak Signal Watchlist Table -->
        <div class="glass-panel rounded-2xl p-6 space-y-4 w-full">
          <div>
            <h4 class="text-base font-bold text-slate-900 dark:text-white flex items-center space-x-2">
              <svg class="w-4 h-4 text-amber-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
              <span x-text="t('speedtest.weak_watchlist_title')"></span>
            </h4>
            <p class="text-xs text-slate-600 dark:text-slate-400" x-text="t('speedtest.weak_watchlist_desc')"></p>
          </div>

          <div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-800">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-100 dark:bg-slate-900/80 text-slate-700 dark:text-slate-400 uppercase font-semibold text-[10px] tracking-wider border-b border-slate-200 dark:border-slate-800">
                <tr>
                  <th class="py-3 px-4" x-text="t('speedtest.col_device')"></th>
                  <th class="py-3 px-4" x-text="t('speedtest.col_eero_node')"></th>
                  <th class="py-3 px-4" x-text="t('speedtest.col_band_channel')"></th>
                  <th class="py-3 px-4 text-center" x-text="t('speedtest.col_rssi_signal')"></th>
                  <th class="py-3 px-4" x-text="t('speedtest.col_recommendation')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200 dark:divide-slate-800/60">
                <template x-for="wd in (signalOverview.weak_devices || [])" :key="wd.mac_address">
                  <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors">
                    <td class="py-3 px-4 font-semibold text-slate-800 dark:text-slate-200">
                      <div class="flex items-center space-x-2">
                        <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
                        <span x-text="wd.hostname || wd.mac_address"></span>
                      </div>
                      <span class="text-[10px] text-slate-500 font-mono block mt-0.5" x-text="wd.mac_address"></span>
                    </td>
                    <td class="py-3 px-4 text-slate-700 dark:text-slate-300" x-text="wd.connected_eero_name || t('common.gateway')"></td>
                    <td class="py-3 px-4">
                      <span class="font-mono text-slate-700 dark:text-slate-300" x-text="(wd.frequency_band || 'Wi-Fi') + (wd.channel ? ' • CH ' + wd.channel : '')"></span>
                    </td>
                    <td class="py-3 px-4 text-center">
                      <span class="px-2 py-0.5 rounded-full text-[11px] font-mono font-bold bg-rose-50 text-rose-700 border border-rose-200 dark:bg-rose-500/20 dark:text-rose-400 dark:border-rose-500/30" x-text="wd.signal_rssi + ' dBm'"></span>
                    </td>
                    <td class="py-3 px-4 text-slate-600 dark:text-slate-400 italic" x-text="t('speedtest.rec_move_closer')"></td>
                  </tr>
                </template>
                <template x-if="!signalOverview.weak_devices || signalOverview.weak_devices.length === 0">
                  <tr>
                    <td colspan="5" class="py-8 px-4 text-center text-slate-400 font-medium">
                      <div class="flex items-center justify-center space-x-2 text-emerald-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span x-text="t('speedtest.no_weak_devices')"></span>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

      <!-- SEZIONE 2: ANALYTICS RETE & SLA ISP -->

            <svg class="w-5 h-5 text-[#0067c0] dark:text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            <span x-text="t('quality_analytics.analytics_section_title')"></span>
          </h3>
          <p class="text-xs text-slate-500 dark:text-slate-400" x-text="t('quality_analytics.analytics_section_subtitle')"></p>
        </div>

        <!-- 4 KPI Summary Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <!-- Card 1: ISP Reliability Score -->

            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400" x-text="t('analytics.kpi_isp_reliability')"></span>
              <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
              </svg>
            </div>
            <div class="flex items-baseline space-x-2">
              <span class="text-3xl font-extrabold text-slate-900 dark:text-white font-mono" x-text="analyticsSla ? (analyticsSla.reliability_score + '%') : '--'"></span>
              <span 
                class="px-2 py-0.5 rounded-full text-[10px] font-bold"
                :class="(analyticsSla && analyticsSla.reliability_score >= 90) ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-400' : 'bg-amber-50 text-amber-700 dark:bg-amber-500/20 dark:text-amber-400'"
                x-text="(analyticsSla && analyticsSla.reliability_score >= 90) ? t('analytics.sla_ok') : t('analytics.sla_degraded')">
              </span>
            </div>
            <div class="mt-2 text-xs text-slate-500 dark:text-slate-400" x-text="t('analytics.kpi_isp_reliability_sub')"></div>
          </div>

          <!-- Card 2: Avg WAN Speed -->
          <div class="glass-panel rounded-2xl p-5 border border-slate-200 dark:border-slate-800">
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400" x-text="t('analytics.kpi_avg_wan')"></span>
              <svg class="w-4 h-4 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
              </svg>
            </div>
            <div class="flex items-baseline flex-wrap gap-x-1.5 gap-y-0.5">
              <div class="inline-flex items-baseline space-x-1">
                <span class="text-2xl font-bold text-sky-600 dark:text-sky-400 font-mono" x-text="analyticsSla ? analyticsSla.avg_download_mbps : '--'"></span>
                <span class="text-xs text-slate-500 font-medium whitespace-nowrap">↓ Mbps</span>

              <span class="text-slate-400">/</span>
              <div class="inline-flex items-baseline space-x-1">
                <span class="text-lg font-bold text-emerald-600 dark:text-emerald-400 font-mono" x-text="analyticsSla ? analyticsSla.avg_upload_mbps : '--'"></span>
                <span class="text-xs text-slate-500 font-medium whitespace-nowrap">↑ Mbps</span>
              </div>
            </div>
            <div class="mt-2 text-xs text-slate-500 dark:text-slate-400" x-text="t('analytics.kpi_avg_wan_sub')"></div>
          </div>

          <!-- Card 3: Latency & Jitter -->
          <div class="glass-panel rounded-2xl p-5 border border-slate-200 dark:border-slate-800">
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400" x-text="t('analytics.kpi_latency_jitter')"></span>
              <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>

            <div class="flex items-baseline space-x-2">

            </div>
            <div class="mt-2 text-xs text-slate-500 dark:text-slate-400" x-text="t('analytics.kpi_latency_jitter_sub')"></div>
          </div>

          <!-- Card 4: Mesh Device Density -->
          <div class="glass-panel rounded-2xl p-5 border border-slate-200 dark:border-slate-800">
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400" x-text="t('analytics.kpi_mesh_density')"></span>
              <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
              </svg>
            </div>
            <div class="flex items-baseline space-x-2">

            </div>
          </div>

        <!-- 2x2 Network Distribution Charts Grid -->
