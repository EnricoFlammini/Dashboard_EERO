    <!-- =================================================================== -->
    <!-- TAB 6.1: CONTROLLI & OSPITI (settings-controls) -->
    <!-- =================================================================== -->
    <div x-show="currentTab === 'settings-controls' || currentTab === 'automations' || currentTab === 'controls'" class="space-y-6 animate-fade-in" style="display: none;">
      
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- 1. Smart Guest Wi-Fi & Dynamic QR Code (Top-Left) -->
        <div class="glass-panel rounded-2xl p-6 space-y-5">
          <div class="flex items-center justify-between border-b border-black/[0.06] dark:border-white/5 pb-3">
            <div class="flex items-center space-x-3">
              <div class="w-9 h-9 rounded-xl bg-sky-500/20 border border-sky-500/30 flex items-center justify-center text-sky-600 dark:text-sky-400 shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
              </div>
              <div>
                <h3 class="text-base font-bold text-slate-900 dark:text-white leading-tight" x-text="t('controls.guest_title')"></h3>
                <p class="text-xs text-slate-600 dark:text-slate-400 mt-0.5" x-text="t('controls.qr_desc')"></p>
              </div>
            </div>
            <button 
              @click="toggleGuestNetwork()"
              :disabled="!can('action_toggle_guest')"
              :class="[!can('action_toggle_guest') ? 'opacity-60 cursor-not-allowed' : 'cursor-pointer', guestNetwork.enabled ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/20' : 'bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-400']"
              class="px-3 py-1 rounded-full text-xs font-bold transition">
              <span x-text="guestNetwork.enabled ? t('controls.enabled') : t('controls.disabled')"></span>
            </button>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-center">
            <!-- QR Code Display -->
            <div class="flex flex-col items-center justify-center p-4 rounded-xl bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 shadow-xs dark:shadow-none">
              <template x-if="guestQrCodeUrl">
                <img :src="guestQrCodeUrl" :alt="t('guests_page.qr_alt')" class="w-44 h-44 rounded-lg shadow-md border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 transition-all duration-200">
              </template>
              <template x-if="!guestQrCodeUrl">
                <div class="w-44 h-44 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-xs text-slate-600 dark:text-slate-400 text-center p-2" x-text="t('controls.qr_disabled')">
                </div>
              </template>
              <span class="text-[11px] text-slate-600 dark:text-slate-400 mt-2 font-medium" x-text="t('controls.qr_desc')"></span>
            </div>

            <!-- Guest Network Credentials Form -->
            <div class="space-y-3 text-xs">
              <div>
                <label class="block text-slate-700 dark:text-slate-400 mb-1 font-semibold" x-text="t('controls.guest_name')"></label>
                <input type="text" x-model="guestNetwork.name" class="glass-input w-full px-3 py-1.5 rounded-lg font-semibold">
              </div>
              <div>
                <label class="block text-slate-700 dark:text-slate-400 mb-1 font-semibold" x-text="t('controls.guest_password')"></label>
                <div class="flex space-x-1">
                  <input type="text" x-model="guestNetwork.password" class="glass-input w-full px-3 py-1.5 rounded-lg font-mono">
                  <button x-show="can('action_toggle_guest')" @click="generateGuestPassword()" class="p-2 rounded-lg bg-white hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-sky-600 dark:text-sky-400 border border-slate-300 dark:border-transparent transition shadow-sm dark:shadow-none cursor-pointer" :title="t('controls.generate_password')">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                  </button>
                </div>
              </div>
              <button 
                x-show="can('action_toggle_guest')"
                @click="saveGuestSettings()"
                class="w-full py-2 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-bold transition cursor-pointer shadow-sm"
                x-text="t('controls.save_guest_btn')">
              </button>
            </div>
          </div>
        </div>

        <!-- 2. Multi-Engine DNS Synchronizer Card (Top-Right) -->
        <div class="glass-panel rounded-2xl p-6 space-y-4 flex flex-col justify-between">
          <div class="space-y-4">
            <div class="space-y-3 border-b border-black/[0.06] dark:border-white/5 pb-3">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="flex items-center space-x-3">
                  <div class="w-10 h-10 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-700 dark:text-emerald-400 shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                  </div>
                  <div>
                    <h3 class="text-base font-bold text-slate-900 dark:text-white leading-tight" x-text="t('controls.dns_title')"></h3>
                    <p class="text-xs text-slate-600 dark:text-slate-400 mt-0.5" x-text="t('controls.dns_subtitle')"></p>
                  </div>
                </div>

                <!-- Action Toolbar: Add Instance, Test All, Sync All -->
                <div x-show="can('action_sync_dns')" class="flex flex-wrap items-center gap-2">
                  <button 
                    @click="addDnsInstance()"
                    class="px-2.5 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-500/10 dark:hover:bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 text-xs font-semibold border border-emerald-200 dark:border-emerald-500/30 transition flex items-center cursor-pointer">
                    <span x-text="t('controls.dns_add_instance')"></span>
                  </button>
                  <button 
                    @click="testAllDns()"
                    :disabled="dnsTesting"
                    class="px-2.5 py-1.5 rounded-lg bg-slate-50 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold border border-slate-200 dark:border-slate-700 transition flex items-center space-x-1 cursor-pointer disabled:opacity-50">
                    <span x-show="dnsTesting && dnsTestingId === 'all'" class="animate-spin text-[10px]">⏳</span>
                    <span x-text="t('controls.dns_test_all')"></span>
                  </button>
                  <button 
                    @click="syncAllDns()"
                    :disabled="dnsSyncing"
                    class="px-3 py-1.5 rounded-lg bg-[#0067c0]/10 hover:bg-[#0067c0]/20 dark:bg-sky-500/20 dark:hover:bg-sky-500/30 text-[#0067c0] dark:text-sky-300 text-xs font-semibold border border-[#0067c0]/20 dark:border-sky-500/30 transition flex items-center space-x-1 cursor-pointer disabled:opacity-50">
                    <span x-show="dnsSyncing && dnsSyncingId === 'all'" class="animate-spin text-[10px]">🔄</span>
                    <span x-text="t('controls.dns_sync_all')"></span>
                  </button>
                </div>
              </div>
            </div>

            <!-- DNS Instances List Container -->
            <div class="space-y-3 max-h-[380px] overflow-y-auto pr-1">
              <template x-for="(inst, idx) in dnsSettings.instances" :key="inst.id">
                <div class="p-3.5 rounded-xl border border-slate-200 dark:border-white/[0.08] bg-slate-50 dark:bg-white/[0.03] space-y-3 transition">
                  
                  <!-- Instance Header Bar -->
                  <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center space-x-2 flex-1 min-w-0">
                      <!-- Engine Type Pill -->
                      <span 
                        :class="{
                          'bg-emerald-50 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300 border-emerald-200 dark:border-emerald-500/30': inst.engine === 'adguard',
                          'bg-rose-50 text-rose-700 dark:bg-rose-500/15 dark:text-rose-300 border-rose-200 dark:border-rose-500/30': inst.engine === 'pihole',
                          'bg-cyan-50 text-cyan-700 dark:bg-cyan-500/15 dark:text-cyan-300 border-cyan-200 dark:border-cyan-500/30': inst.engine === 'technitium'
                        }"
                        class="px-2 py-0.5 rounded-full text-[10px] font-bold border flex items-center space-x-1 shrink-0">
                        <span x-text="inst.engine === 'adguard' ? '🛡️ AdGuard' : (inst.engine === 'pihole' ? '🕳️ Pi-hole' : '⚡ Technitium')"></span>
                      </span>

                      <!-- Editable Friendly Name -->
                      <input 
                        type="text" 
                        x-model="inst.name" 
                        :placeholder="t('controls.dns_server_name_placeholder')"
                        class="glass-input px-2 py-0.5 rounded text-xs font-semibold flex-1 min-w-0">
                    </div>

                    <!-- Toggle & Remove -->
                    <div class="flex items-center space-x-2 shrink-0">
                      <label class="flex items-center space-x-1.5 text-[11px] text-slate-700 dark:text-slate-400 cursor-pointer select-none">
                        <input type="checkbox" x-model="inst.enabled" class="rounded border-slate-300 dark:border-slate-700 text-[#0067c0] dark:text-emerald-500 focus:ring-0 w-3.5 h-3.5">
                        <span x-text="inst.enabled ? t('controls.adguard_active') : t('controls.adguard_inactive')"></span>
                      </label>
                      <button 
                        @click="removeDnsInstance(inst.id)"
                        class="text-slate-400 hover:text-rose-600 p-1 rounded transition" 
                        :title="t('controls.dns_remove_instance')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                      </button>
                    </div>
                  </div>

                  <!-- Form Fields for this Instance -->
                  <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 text-xs">
                    <!-- Engine Selection -->
                    <div class="sm:col-span-4">
                      <label class="block text-slate-600 dark:text-slate-400 mb-0.5 text-[11px]" x-text="t('controls.dns_engine')"></label>
                      <select x-model="inst.engine" class="glass-input w-full px-2.5 py-1.5 rounded-lg font-medium text-xs">
                        <option value="adguard">🛡️ AdGuard Home</option>
                        <option value="pihole">🕳️ Pi-hole (v5 & v6)</option>
                        <option value="technitium">⚡ Technitium DNS (PTR)</option>
                      </select>
                    </div>

                    <!-- Server URL -->
                    <div class="sm:col-span-8">
                      <label class="block text-slate-600 dark:text-slate-400 mb-0.5 text-[11px]" x-text="t('controls.dns_url')"></label>
                      <input type="text" x-model="inst.url" @input="if (inst.insecure_tls && normalizeDnsUrl($event.target.value) !== inst.tls_url) inst.insecure_tls = false" placeholder="http://192.168.1.50:80" class="glass-input w-full px-2.5 py-1.5 rounded-lg font-mono text-xs">
                    </div>

                    <!-- Contextual Authentication / Parameters -->
                    <!-- 1. AdGuard: Username + Password -->
                    <template x-if="inst.engine === 'adguard'">
                      <div class="sm:col-span-12 grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div>
                          <label class="block text-slate-600 dark:text-slate-400 mb-0.5 text-[11px]" x-text="t('controls.dns_username')"></label>
                          <input type="text" x-model="inst.username" placeholder="admin" class="glass-input w-full px-2.5 py-1.5 rounded-lg font-mono text-xs">
                        </div>
                        <div>
                          <label class="block text-slate-600 dark:text-slate-400 mb-0.5 text-[11px]" x-text="t('controls.dns_password')"></label>
                          <input type="password" x-model="inst.password" :placeholder="inst.has_password ? ((inst.saved_url && normalizeDnsUrl(inst.url) !== inst.saved_url) ? t('controls.dns_password_reenter_url_changed') : t('controls.dns_password_unchanged')) : t('controls.dns_password_placeholder_adguard')" class="glass-input w-full px-2.5 py-1.5 rounded-lg font-mono text-xs">
                        </div>
                      </div>
                    </template>

                    <!-- 2. Pi-hole: API Token + Local Zone -->
                    <template x-if="inst.engine === 'pihole'">
                      <div class="sm:col-span-12 grid grid-cols-1 sm:grid-cols-12 gap-2">
                        <div class="sm:col-span-8">
                          <label class="block text-slate-600 dark:text-slate-400 mb-0.5 text-[11px]" x-text="t('controls.dns_token')"></label>
                          <input type="password" x-model="inst.token" :placeholder="inst.has_token ? ((inst.saved_url && normalizeDnsUrl(inst.url) !== inst.saved_url) ? t('controls.dns_password_reenter_url_changed') : t('controls.dns_password_unchanged')) : t('controls.dns_token_placeholder_pihole')" class="glass-input w-full px-2.5 py-1.5 rounded-lg font-mono text-xs">
                        </div>
                        <div class="sm:col-span-4">
                          <label class="block text-slate-600 dark:text-slate-400 mb-0.5 text-[11px]" x-text="t('controls.dns_zone')"></label>
                          <input type="text" x-model="inst.zone" :placeholder="t('controls.dns_zone_placeholder')" class="glass-input w-full px-2.5 py-1.5 rounded-lg font-mono text-xs">
                        </div>
                      </div>
                    </template>

                    <!-- 3. Technitium: Token/Pass + Zone Domain -->
                    <template x-if="inst.engine === 'technitium'">
                      <div class="sm:col-span-12 grid grid-cols-1 sm:grid-cols-12 gap-2">
                        <div class="sm:col-span-4">
                          <label class="block text-slate-600 dark:text-slate-400 mb-0.5 text-[11px]" x-text="t('controls.dns_username')"></label>
                          <input type="text" x-model="inst.username" placeholder="admin" class="glass-input w-full px-2.5 py-1.5 rounded-lg font-mono text-xs">
                        </div>
                        <div class="sm:col-span-4">
                          <label class="block text-slate-600 dark:text-slate-400 mb-0.5 text-[11px]" x-text="t('controls.dns_token')"></label>
                          <input type="password" x-model="inst.token" :placeholder="inst.has_token ? ((inst.saved_url && normalizeDnsUrl(inst.url) !== inst.saved_url) ? t('controls.dns_password_reenter_url_changed') : t('controls.dns_password_unchanged')) : t('controls.dns_token_placeholder_generic')" class="glass-input w-full px-2.5 py-1.5 rounded-lg font-mono text-xs">
                        </div>
                        <div class="sm:col-span-4">
                          <label class="block text-slate-600 dark:text-slate-400 mb-0.5 text-[11px]" x-text="t('controls.dns_zone')"></label>
                          <input type="text" x-model="inst.zone" placeholder="lan" class="glass-input w-full px-2.5 py-1.5 rounded-lg font-mono text-xs">
                        </div>
                      </div>
                    </template>

                    <!-- Options: Intelligent Address Pruning & IPv6 Exclusion (v1.5.0 - Issue #31) -->
                    <div class="sm:col-span-12 pt-1.5 border-t border-black/[0.04] dark:border-white/5 flex flex-wrap gap-4 text-xs">
                      <label class="flex items-center space-x-2 cursor-pointer text-slate-700 dark:text-slate-300">
                        <input type="checkbox" x-model="inst.prune_stale_ips" class="rounded text-sky-600 focus:ring-sky-500 border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900">
                        <span class="text-[11px]" x-text="t('controls.dns_prune_stale_ips')"></span>
                      </label>
                      <label class="flex items-center space-x-2 cursor-pointer text-slate-700 dark:text-slate-300">
                        <input type="checkbox" x-model="inst.drop_ipv6" class="rounded text-sky-600 focus:ring-sky-500 border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900">
                        <span class="text-[11px]" x-text="t('controls.dns_drop_ipv6')"></span>
                      </label>
                      <!-- Certificato HTTPS non verificato: visibile per URL https:// (o se già attivo), verifica attiva di default, tolto se il server (URL normalizzato) cambia -->
                      <label x-show="(inst.url || '').trim().toLowerCase().startsWith('https://') || inst.insecure_tls" class="flex items-center space-x-2 cursor-pointer text-slate-700 dark:text-slate-300">
                        <input type="checkbox" x-model="inst.insecure_tls" @change="inst.tls_url = normalizeDnsUrl(inst.url)" class="rounded text-amber-600 focus:ring-amber-500 border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900">
                        <span class="text-[11px]" x-text="t('controls.dns_insecure_tls')"></span>
                      </label>
                      <p x-show="inst.insecure_tls" class="w-full text-[11px] text-amber-600 dark:text-amber-400" x-text="t('controls.dns_insecure_tls_warning')"></p>
                    </div>
                  </div>

                  <!-- Footer per Istanza: Last Sync info + Test/Sync individuali -->
                  <div class="pt-2 border-t border-black/[0.04] dark:border-white/5 flex flex-wrap items-center justify-between gap-2 text-[11px]">
                    <div class="text-slate-600 dark:text-slate-400 flex items-center space-x-1.5">
                      <span class="w-1.5 h-1.5 rounded-full" :class="inst.last_sync_time ? 'bg-emerald-500' : 'bg-slate-400'"></span>
                      <span x-text="inst.last_sync_time ? (t('controls.dns_last_sync_prefix') + formatLocalDateTime(inst.last_sync_time, true)) : t('controls.dns_never_synced')"></span>
                      <template x-if="inst.last_sync_count > 0">
                        <span class="font-mono text-[10px] px-1.5 py-0.2 rounded bg-black/[0.05] dark:bg-white/[0.05]" x-text="t('controls.dns_sync_hosts', { n: inst.last_sync_count })"></span>
                      </template>
                    </div>

                    <div x-show="can('action_sync_dns')" class="flex items-center space-x-2">
                      <button 
                        @click="testDnsInstance(inst)"
                        :disabled="dnsTesting && dnsTestingId === inst.id"
                        class="px-2.5 py-1 rounded bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 transition flex items-center space-x-1 cursor-pointer disabled:opacity-50">
                        <span x-show="dnsTesting && dnsTestingId === inst.id" class="animate-spin text-[10px]">⏳</span>
                        <span x-text="t('controls.dns_test_single')"></span>
                      </button>
                      <button 
                        @click="syncDnsInstance(inst)"
                        :disabled="dnsSyncing && dnsSyncingId === inst.id"
                        class="px-2.5 py-1 rounded bg-[#0067c0]/10 dark:bg-sky-500/20 hover:bg-[#0067c0]/20 dark:hover:bg-sky-500/30 text-[#0067c0] dark:text-sky-300 border border-[#0067c0]/20 dark:border-sky-500/30 transition flex items-center space-x-1 cursor-pointer disabled:opacity-50">
                        <span x-show="dnsSyncing && dnsSyncingId === inst.id" class="animate-spin text-[10px]">🔄</span>
                        <span x-text="t('controls.dns_sync_single')"></span>
                      </button>
                    </div>
                  </div>

                </div>
              </template>

              <!-- Empty State -->
              <template x-if="!dnsSettings.instances || dnsSettings.instances.length === 0">
                <div class="p-4 rounded-xl border border-dashed border-slate-300 dark:border-white/[0.1] text-center text-xs text-slate-600 dark:text-slate-400">
                  <p x-text="t('controls.dns_no_instances')"></p>
                </div>
              </template>
            </div>
            
            <!-- Global Periodic Sync Toggle & Global Save Button -->
            <div class="pt-2 border-t border-black/[0.06] dark:border-white/5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <label class="flex items-center space-x-2 text-xs text-slate-700 dark:text-slate-300 cursor-pointer select-none">
                <input type="checkbox" x-model="dnsSettings.enabled" class="rounded border-slate-300 dark:border-slate-700 text-[#0067c0] dark:text-emerald-500 focus:ring-0 w-4 h-4">
                <span class="font-medium" x-text="t('controls.dns_auto_sync')"></span>
              </label>

              <button 
                x-show="can('action_sync_dns')"
                @click="saveDnsSettings()"
                class="px-4 py-1.5 rounded-xl bg-gradient-to-r from-[#0067c0] to-indigo-600 hover:from-[#1975c5] hover:to-indigo-500 text-white font-bold text-xs shadow-md shadow-sky-500/20 transition cursor-pointer"
                x-text="t('controls.dns_save_btn')">
              </button>
            </div>
          </div>
        </div>

        <!-- 3. Telegram & Webhook Alert Configuration (Bottom-Left) -->
        <div id="notification-card" class="glass-panel rounded-2xl p-6 space-y-4 flex flex-col justify-between">
          <div class="space-y-3 text-xs">
            <div class="flex items-center justify-between border-b border-black/[0.06] dark:border-white/5 pb-3">
              <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-indigo-50/90 dark:bg-indigo-500/15 border border-indigo-200 dark:border-indigo-500/30 flex items-center justify-center text-indigo-700 dark:text-indigo-400 shrink-0">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                </div>
                <div>
                  <h3 class="text-base font-bold text-slate-900 dark:text-white leading-tight" x-text="t('controls.notifications_title')"></h3>
                  <p class="text-xs text-slate-600 dark:text-slate-400 mt-0.5" x-text="t('controls.notifications_desc')"></p>
                </div>
              </div>
              <button x-show="can('action_manage_rules')" @click="testNotifications()" class="px-2.5 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 dark:bg-indigo-500/20 dark:hover:bg-indigo-500/30 dark:text-indigo-300 dark:border-indigo-500/30 text-xs font-semibold transition cursor-pointer" x-text="t('controls.send_test')">
              </button>

        <!-- 5. Sicurezza Sessione & Disconnessione Automatica -->

              <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-amber-600 dark:text-amber-400 shrink-0">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>

                <div>

                </div>

                <template x-for="mins in [5, 10, 15, 30, 60, 0]" :key="mins">
                  <button

                    :class="sessionTimeoutMinutes === mins 
                      ? 'bg-[#0067c0] text-white border-[#0067c0] dark:bg-sky-500 dark:border-sky-500 shadow-md shadow-sky-500/20 ring-2 ring-sky-500/30' 
                      : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'">
                    <span class="text-sm font-extrabold" x-text="mins === 0 ? t('controls.session_never') : t('common.minutes_short', { n: mins })"></span>
                    <span class="text-[9px] font-normal opacity-80" x-text="mins === 15 ? t('controls.session_default') : (mins === 0 ? t('controls.session_disabled') : t('controls.session_inactivity'))"></span>
                  </button>
                </template>
              </div>
            </div>
          </div>

          <div class="pt-2 border-t border-black/[0.06] dark:border-white/5 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-[11px] text-slate-500">

              <span class="w-2 h-2 rounded-full" :class="sessionTimeoutMinutes > 0 ? 'bg-emerald-500 animate-pulse' : 'bg-slate-400'"></span>
              <span x-text="sessionTimeoutMinutes > 0 ? t('controls.session_watchdog_on') : t('controls.session_watchdog_off')"></span>
            </span>
            <span class="font-mono text-[10px] text-slate-400" x-text="t('controls.session_last_activity', { time: new Date(lastUserActivity).toLocaleTimeString(dateLocale()) })"></span>
          </div>
        </div>

        <!-- 6. Parental Scheduling & Time Rules Card (Module 3) -->
        <div class="lg:col-span-2 glass-panel rounded-2xl p-6 space-y-5 border border-sky-500/20 shadow-md">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-black/[0.06] dark:border-white/5 pb-4">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-sky-500/20 shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              </div>
              <div>
                <h3 class="text-base font-bold text-slate-900 dark:text-white" x-text="t('schedules.title')"></h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5" x-text="t('schedules.subtitle')"></p>

            </div>

            <div class="flex items-center space-x-2">
              <button 
                x-show="can('action_manage_rules')"
                @click="evaluateSchedulesNow()" 
                class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold border border-slate-300 dark:border-slate-700 transition cursor-pointer flex items-center space-x-1.5"

                <span>⚡</span>
                <span x-text="t('schedules.evaluate_btn')"></span>
              </button>
              <button 
                x-show="can('action_manage_rules')"
                @click="openScheduleModal()" 
                class="px-4 py-2 rounded-xl bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-bold text-xs shadow-md shadow-sky-500/20 transition cursor-pointer flex items-center space-x-1.5">
                <span>+</span>
                <span x-text="t('schedules.add_btn')"></span>
              </button>
            </div>
          </div>

          <!-- Schedules List Grid -->
          <div x-show="schedulesLoading" class="py-8 text-center text-xs text-slate-400">

          </div>

          <div x-show="!schedulesLoading">
            <template x-if="schedulesList && schedulesList.length > 0">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-for="s in schedulesList" :key="s.id">
                  <div class="p-4 rounded-xl border transition-all duration-200 flex flex-col justify-between space-y-3 bg-white/70 dark:bg-slate-900/60"
                       :class="s.is_active ? 'border-sky-500/30 shadow-sm' : 'border-slate-200 dark:border-slate-800 opacity-60'">
                    <div class="flex items-start justify-between gap-2">
                      <div>
                        <div class="flex items-center space-x-2">
                          <span class="w-2.5 h-2.5 rounded-full" :class="s.is_active ? 'bg-emerald-500 ring-2 ring-emerald-500/20' : 'bg-slate-400'"></span>
                          <span class="font-bold text-sm text-slate-900 dark:text-white" x-text="s.name"></span>
                        </div>
                        <div class="text-[11px] text-slate-500 dark:text-slate-400 mt-1 flex items-center space-x-1.5 font-mono">
                          <span>⏰</span>
                          <span class="font-semibold text-slate-700 dark:text-slate-300" x-text="isRebootSchedule(s) ? s.start_time : (s.start_time + ' - ' + s.end_time)"></span>
                          <span>•</span>
                          <span class="px-1.5 py-0.5 rounded text-[10px] uppercase font-bold"
                                :class="['pause', 'turn_off'].includes(s.action) ? 'bg-rose-500/15 text-rose-700 dark:text-rose-300' : (s.action === 'reboot' ? 'bg-amber-500/15 text-amber-700 dark:text-amber-300' : 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-300')"
                                x-text="formatScheduleAction(s)"></span>
                        </div>
                      </div>

                      <!-- Toggle Switch -->
                      <button 
                        @click="toggleSchedule(s.id)"
                        :disabled="!can('action_manage_rules')"
                        :class="[!can('action_manage_rules') ? 'opacity-60 cursor-not-allowed' : 'cursor-pointer', s.is_active ? 'bg-[#0067c0] dark:bg-sky-500' : 'bg-slate-300 dark:bg-slate-700']"
                        class="relative inline-flex h-6 w-11 shrink-0 rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none">
                        <span :class="s.is_active ? 'translate-x-5' : 'translate-x-0'" class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow-md ring-0 transition duration-200 ease-in-out"></span>
                      </button>
                    </div>

                    <!-- Target and Days Badges -->
                    <div class="space-y-1.5 pt-2 border-t border-black/[0.04] dark:border-white/5">
                      <div class="flex items-center space-x-2 text-xs">
                        <span class="text-slate-400 text-[11px]" x-text="t('schedules.target_type')"></span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-sky-500/10 text-sky-700 dark:text-sky-300 border border-sky-500/20"
                              x-text="formatScheduleTarget(s)"></span>
                      </div>
                      
                      <div class="flex flex-wrap gap-1 pt-1">
                        <template x-for="d in ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun']" :key="d">
                          <span class="px-1.5 py-0.5 rounded text-[10px] font-mono font-bold"
                                :class="s.days && s.days.includes(d) ? 'bg-[#0067c0]/15 text-[#0067c0] dark:bg-sky-500/20 dark:text-sky-300 font-bold' : 'text-slate-400 line-through opacity-40'"

                        </template>
                      </div>
                    </div>

                    <!-- Edit / Delete Buttons -->
                    <div x-show="can('action_manage_rules')" class="flex items-center justify-end space-x-2 pt-2 border-t border-black/[0.04] dark:border-white/5">
                      <button

                        class="p-1.5 rounded-lg text-slate-500 hover:text-sky-600 hover:bg-sky-50 dark:hover:bg-sky-500/10 transition cursor-pointer text-xs"
                        :title="t('schedules.edit')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                      </button>
                      <button 
                        @click="deleteSchedule(s.id)"
                        class="p-1.5 rounded-lg text-slate-500 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-500/10 transition cursor-pointer text-xs"
                        :title="t('schedules.delete')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                      </button>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <template x-if="!schedulesList || schedulesList.length === 0">
              <div class="p-8 rounded-xl border border-dashed border-slate-300 dark:border-slate-800 text-center space-y-2">

                <div class="text-xs font-semibold text-slate-700 dark:text-slate-300" x-text="t('schedules.no_schedules')"></div>
                <p class="text-[11px] text-slate-500" x-text="t('schedules.empty_desc')"></p>
              </div>
            </template>
          </div>
        </div>

        <!-- 7. Gestione Log di Sistema & Diagnostica Avanzata (v1.6.0 Modulo 4) -->
        <div class="lg:col-span-2 glass-panel rounded-2xl p-6 space-y-6 border border-cyan-500/20 shadow-md">
          
          <!-- Card Header & Status Toggle -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-black/[0.06] dark:border-white/5 pb-4">
            <div class="flex items-center space-x-3.5">
              <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-cyan-600 to-sky-500 flex items-center justify-center text-white shadow-md shadow-cyan-500/20 shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
              </div>
              <div>
                <div class="flex items-center space-x-2">
                  <h3 class="text-base font-bold text-slate-900 dark:text-white" x-text="t('logs.title')"></h3>
                  <span 
                    :class="logConfig.enabled ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border-emerald-500/30' : 'bg-rose-500/15 text-rose-600 dark:text-rose-400 border-rose-500/30'"
                    class="px-2 py-0.5 rounded-full text-[10px] font-bold border"
                    x-text="logConfig.enabled ? t('logs.status_active') : t('logs.status_muted')">
                  </span>
                </div>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5" x-text="t('logs.subtitle')"></p>
              </div>
            </div>

            <!-- Master Toggle Switch -->
            <div class="flex items-center space-x-3 shrink-0">
              <span class="text-xs font-semibold text-slate-600 dark:text-slate-300" x-text="logConfig.enabled ? t('controls.enabled') : t('controls.disabled')"></span>
              <label class="relative inline-flex items-center cursor-pointer" :class="!can('action_manage_rules') ? 'opacity-60 cursor-not-allowed' : ''">
                <input

                  x-model="logConfig.enabled"

                  class="sr-only peer">
                <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-slate-600 peer-checked:bg-cyan-600"></div>
              </label>
            </div>
          </div>

          <!-- Controls Section: Depth & Retention -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-1">
            
            <!-- 1. Profondità di Analisi (Livelli di Dettaglio) -->

              <div>
                <label class="block text-xs font-bold text-slate-800 dark:text-slate-200" x-text="t('logs.depth_title')"></label>

              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-1">
                <!-- DEBUG -->

                  @click="setLogLevel('DEBUG')"

                  :class="logConfig.level === 'DEBUG'

                    : 'bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 border-slate-300 dark:border-slate-700 hover:bg-purple-50 dark:hover:bg-purple-950/30'"

                  <span class="text-[10px] font-medium opacity-90" x-text="t('logs.lvl_short_debug')"></span>
                </button>

                <!-- INFO -->
                <button 
                  type="button"
                  @click="setLogLevel('INFO')"
                  :disabled="!can('action_manage_rules') || !logConfig.enabled"

                    : 'bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 border-slate-300 dark:border-slate-700 hover:bg-sky-50 dark:hover:bg-sky-950/30'"
                  class="py-2.5 px-3 text-center rounded-xl text-xs font-bold border transition cursor-pointer flex flex-col items-center justify-center space-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed shadow-xs">
                  <span class="text-xs font-extrabold">INFO</span>
                  <span class="text-[10px] font-medium opacity-90" x-text="t('logs.lvl_short_info')"></span>

                <!-- WARNING -->

                  type="button"
                  @click="setLogLevel('WARNING')"
                  :disabled="!can('action_manage_rules') || !logConfig.enabled"
                  :class="logConfig.level === 'WARNING'

                    : 'bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 border-slate-300 dark:border-slate-700 hover:bg-amber-50 dark:hover:bg-amber-950/30'"

                  <span class="text-xs font-extrabold">WARNING</span>
                  <span class="text-[10px] font-medium opacity-90" x-text="t('logs.lvl_short_warning')"></span>

                  type="button"
                  @click="setLogLevel('ERROR')"
                  :disabled="!can('action_manage_rules') || !logConfig.enabled"
                  :class="logConfig.level === 'ERROR' 
                    ? 'bg-rose-600 text-white shadow-md shadow-rose-600/25 ring-2 ring-rose-500/40 border-rose-600' 
                    : 'bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 border-slate-300 dark:border-slate-700 hover:bg-rose-50 dark:hover:bg-rose-950/30'"
                  class="py-2.5 px-3 text-center rounded-xl text-xs font-bold border transition cursor-pointer flex flex-col items-center justify-center space-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed shadow-xs">
                  <span class="text-xs font-extrabold">ERROR</span>
                  <span class="text-[10px] font-medium opacity-90" x-text="t('logs.lvl_short_error')"></span>
                </button>
              </div>
            </div>

            <!-- 2. Politica di Conservazione (Retention Temporale) -->
            <div class="space-y-3 p-4 rounded-xl bg-slate-50/70 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800">
              <div>
                <label class="block text-xs font-bold text-slate-800 dark:text-slate-200" x-text="t('logs.retention_title')"></label>

              <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 pt-1">

                  @click="setLogRetention(1)"
                  :disabled="!can('action_manage_rules') || !logConfig.enabled"

                    ? 'bg-cyan-600 text-white shadow-md shadow-cyan-600/25 ring-2 ring-cyan-500/40 border-cyan-600'

                  <span class="text-xs font-extrabold">24h</span>
                  <span class="text-[9px] font-normal opacity-80" x-text="t('logs.retention_24h')"></span>
                </button>

                <!-- 7gg -->
                <button 
                  type="button"
                  @click="setLogRetention(7)"
                  :disabled="!can('action_manage_rules') || !logConfig.enabled"
                  :class="!showCustomRetention && logConfig.retention_days === 7 
                    ? 'bg-cyan-600 text-white shadow-md shadow-cyan-600/25 ring-2 ring-cyan-500/40 border-cyan-600' 
                    : 'bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 border-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'"
                  class="py-2 px-2 text-center rounded-xl text-xs font-bold border transition cursor-pointer flex flex-col items-center justify-center space-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed shadow-xs">
                  <span class="text-xs font-extrabold" x-text="t('logs.retention_short_7d')"></span>
                  <span class="text-[9px] font-normal opacity-80" x-text="t('logs.retention_7d')"></span>
                </button>

                <!-- 15gg -->
                <button 
                  type="button"
                  @click="setLogRetention(15)"
                  :disabled="!can('action_manage_rules') || !logConfig.enabled"
                  :class="!showCustomRetention && logConfig.retention_days === 15 
                    ? 'bg-cyan-600 text-white shadow-md shadow-cyan-600/25 ring-2 ring-cyan-500/40 border-cyan-600' 
                    : 'bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 border-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'"
                  class="py-2 px-2 text-center rounded-xl text-xs font-bold border transition cursor-pointer flex flex-col items-center justify-center space-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed shadow-xs">
                  <span class="text-xs font-extrabold" x-text="t('logs.retention_short_15d')"></span>
                  <span class="text-[9px] font-normal opacity-80" x-text="t('logs.retention_15d')"></span>
                </button>

                <!-- 1 mese (30gg) -->
                <button 
                  type="button"
                  @click="setLogRetention(30)"
                  :disabled="!can('action_manage_rules') || !logConfig.enabled"
                  :class="!showCustomRetention && logConfig.retention_days === 30 
                    ? 'bg-cyan-600 text-white shadow-md shadow-cyan-600/25 ring-2 ring-cyan-500/40 border-cyan-600' 
                    : 'bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 border-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'"
                  class="py-2 px-2 text-center rounded-xl text-xs font-bold border transition cursor-pointer flex flex-col items-center justify-center space-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed shadow-xs">
                  <span class="text-xs font-extrabold" x-text="t('logs.retention_short_30d')"></span>
                  <span class="text-[9px] font-normal opacity-80" x-text="t('logs.retention_30d')"></span>
                </button>

                <!-- Altro / Custom -->
                <button 
                  type="button"
                  @click="setLogRetention('custom')"
                  :disabled="!can('action_manage_rules') || !logConfig.enabled"
                  :class="showCustomRetention 
                    ? 'bg-cyan-600 text-white shadow-md shadow-cyan-600/25 ring-2 ring-cyan-500/40 border-cyan-600' 
                    : 'bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 border-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'"
                  class="py-2 px-2 text-center rounded-xl text-xs font-bold border transition cursor-pointer flex flex-col items-center justify-center space-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed shadow-xs">
                  <span class="text-xs font-extrabold">✏️</span>
                  <span class="text-[9px] font-normal opacity-80" x-text="t('logs.retention_custom')"></span>
                </button>
              </div>

              <!-- Custom Retention Input (visible when Custom is selected) -->
              <div x-show="showCustomRetention" class="pt-2 flex items-center space-x-2">
                <input 
                  type="number" 
                  min="0" 
                  max="3650"
                  x-model.number="customRetentionInput" 
                  :placeholder="t('logs.retention_days_placeholder')" 
                  class="glass-input w-28 px-3 py-1.5 rounded-lg text-xs font-mono font-bold text-center border-slate-300 dark:border-slate-700">
                <span class="text-xs text-slate-600 dark:text-slate-400 font-medium" x-text="t('logs.retention_days_unit')"></span>
                <button 
                  type="button"
                  @click="applyCustomRetention()"
                  class="px-3 py-1.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs transition cursor-pointer shadow-xs">
                  <span x-text="t('logs.apply_btn')"></span>
                </button>
              </div>
            </div>

          </div>

          <!-- Action Toolbar: Download, Clear, Refresh, Auto-Refresh -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-2 border-t border-black/[0.06] dark:border-white/5">
            <div class="flex flex-wrap items-center gap-2">
              
              <!-- Download .log -->
              <button 
                type="button"
                @click="downloadSystemLogs('log')"
                class="px-3.5 py-1.5 rounded-xl bg-white hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold text-xs border border-slate-300 dark:border-slate-700 transition cursor-pointer flex items-center space-x-1.5 shadow-xs">
                <span>⬇️</span>
                <span x-text="t('logs.download_log')"></span>
              </button>

              <!-- Download .json -->
              <button 
                type="button"
                @click="downloadSystemLogs('json')"
                class="px-3.5 py-1.5 rounded-xl bg-white hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold text-xs border border-slate-300 dark:border-slate-700 transition cursor-pointer flex items-center space-x-1.5 shadow-xs">
                <span>📦</span>
                <span x-text="t('logs.download_json')"></span>
              </button>

              <!-- Refresh Button -->
              <button 
                type="button"
                @click="fetchSystemLogs(); fetchLogConfig()"
                :disabled="logLoading"
                class="px-3.5 py-1.5 rounded-xl bg-[#0067c0]/10 hover:bg-[#0067c0]/20 dark:bg-sky-500/15 dark:hover:bg-sky-500/25 text-[#0067c0] dark:text-sky-300 font-bold text-xs border border-[#0067c0]/30 dark:border-sky-500/40 transition cursor-pointer flex items-center space-x-1.5 disabled:opacity-50 shadow-xs">
                <span :class="logLoading ? 'animate-spin' : ''">🔄</span>
                <span x-text="t('logs.refresh_btn')"></span>
              </button>

              <!-- Auto-Refresh Toggle -->
              <label class="flex items-center space-x-1.5 text-xs text-slate-700 dark:text-slate-300 font-semibold cursor-pointer select-none px-2 py-1">
                <input type="checkbox" x-model="logAutoRefresh" class="rounded border-slate-300 dark:border-slate-700 text-cyan-600 focus:ring-0 w-3.5 h-3.5">
                <span x-text="t('logs.auto_refresh')"></span>
              </label>
            </div>

            <!-- Clear Logs Button -->
            <button 
              type="button"
              x-show="can('action_manage_rules')"
              @click="openClearLogsModal()"
              class="px-3.5 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 dark:bg-rose-500/15 dark:hover:bg-rose-500/25 text-rose-700 dark:text-rose-300 font-bold text-xs border border-rose-300 dark:border-rose-500/40 transition cursor-pointer flex items-center space-x-1.5 self-start sm:self-auto shadow-xs">
              <svg class="w-4 h-4 text-rose-600 dark:text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              <span x-text="t('logs.clear_btn')"></span>
            </button>
          </div>

          <!-- Live Log Viewer Console Container -->
          <div class="space-y-2.5 pt-2">
            
            <div class="flex items-center justify-between">
              <h4 class="text-xs font-extrabold text-slate-800 dark:text-slate-200 uppercase tracking-wider flex items-center space-x-1.5">
                <svg class="w-4 h-4 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <span x-text="t('logs.viewer_title')"></span>
              </h4>
            </div>

            <!-- Console Filter Bar -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-1">
              
              <!-- Quick Search Input -->
              <div class="relative flex-1 max-w-md">
                <input 
                  type="text" 
                  x-model.debounce.300ms="logSearchQuery"
                  :placeholder="t('logs.search_placeholder')" 
                  class="glass-input w-full pl-8 pr-3 py-1.5 rounded-lg text-xs font-mono font-medium border-slate-300 dark:border-slate-700">
                <svg class="w-4 h-4 text-slate-400 absolute left-2.5 top-2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
              </div>

              <!-- Level Chips Selector -->
              <div class="flex items-center space-x-1.5 overflow-x-auto pb-1 sm:pb-0 text-xs font-bold">
                <template x-for="lvl in ['ALL', 'DEBUG', 'INFO', 'WARNING', 'ERROR']" :key="lvl">
                  <button 
                    type="button"
                    @click="logLevelFilter = lvl"
                    :class="logLevelFilter === lvl 
                      ? 'bg-sky-600 text-white border-sky-600 shadow-sm' 
                      : 'bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 border-slate-300 dark:border-slate-700'"
                    class="px-3 py-1 rounded-lg border transition cursor-pointer shrink-0 font-bold shadow-2xs"
                    x-text="lvl === 'ALL' ? t('logs.filter_all') : lvl">
                  </button>
                </template>
              </div>

              <!-- Storage & Records Stats Pills -->
              <div class="flex items-center space-x-2 text-xs text-slate-800 dark:text-slate-200 font-mono font-semibold shrink-0">
                <button 
                  @click="toggleLogTimezone()"
                  type="button"
                  class="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 shadow-2xs hover:bg-slate-100 dark:hover:bg-slate-700 transition cursor-pointer flex items-center space-x-1"
                  :title="t('logs.tz_toggle_tooltip')">
                  <span>⏱️</span>
                  <span class="font-bold text-[11px]" x-text="logTimezoneMode === 'local' ? t('logs.tz_local') : t('logs.tz_utc')"></span>
                </button>
                <span class="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 shadow-2xs" :title="t('logs.file_size')">
                  💾 <span x-text="(logStats.file_size_mb || 0) + ' MB'"></span>
                </span>
                <span class="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 shadow-2xs" :title="t('logs.total_records')">
                  📑 <span x-text="logTotalCount || 0"></span>
                </span>
              </div>
            </div>

            <!-- Dark Acrylic Terminal Output Box with Theme-Immune High Contrast -->
            <div class="log-console-terminal rounded-xl p-3.5 border shadow-inner max-h-[420px] overflow-y-auto space-y-1.5 select-text">
              
              <template x-if="logLoading && logsList.length === 0">
                <div class="py-12 text-center text-slate-400">
                  <span class="animate-spin inline-block mr-2">⏳</span> <span x-text="t('logs.loading')"></span>
                </div>
              </template>

              <template x-if="!logLoading && logsList.length === 0">
                <div class="py-12 text-center text-slate-400 space-y-1.5">
                  <div class="text-2xl">📋</div>
                  <div class="font-medium text-slate-300" x-text="t('logs.no_logs')"></div>
                </div>
              </template>

              <template x-for="l in logsList" :key="l.id">
                <div class="py-1 px-1.5 rounded hover:bg-white/[0.06] transition flex flex-col space-y-1 border-b border-white/[0.04]">
                  <div class="flex items-start space-x-2 text-[11px] leading-snug">
                    <!-- Timestamp -->
                    <span class="log-time shrink-0 select-all font-mono" x-text="formatLogTimestamp(l.timestamp)" :title="l.timestamp + ' (UTC)'"></span>

                    <!-- Level Badge -->
                    <span 
                      :class="{
                        'log-badge-debug': l.level === 'DEBUG',
                        'log-badge-info': l.level === 'INFO',
                        'log-badge-warning': l.level === 'WARNING',
                        'log-badge-error': l.level === 'ERROR' || l.level === 'CRITICAL'
                      }"
                      class="px-1.5 py-0.2 rounded text-[10px] uppercase font-bold border shrink-0 tracking-wide"
                      x-text="l.level">
                    </span>

                    <!-- Module / Logger Name -->
                    <span class="log-logger shrink-0 font-bold font-mono" x-text="l.logger_name + ':'"></span>

                    <!-- Message Body -->
                    <span class="log-message break-all select-all flex-1 font-mono" x-text="l.message"></span>

                    <!-- Details expander button if details_json exists -->
                    <template x-if="l.details_json">
                      <button 
                        type="button"
                        @click="toggleLogDetail(l.id)" 
                        class="text-[10px] text-amber-300 hover:text-amber-200 underline font-bold shrink-0 cursor-pointer ml-1"
                        x-text="expandedLogDetails[l.id] ? t('logs.hide_details') : t('logs.show_details')">
                      </button>
                    </template>
                  </div>

                  <!-- Collapsible Stacktrace / Details JSON -->
                  <div x-show="expandedLogDetails[l.id]" class="log-detail-box mt-1 p-2.5 rounded-lg border text-[11px] whitespace-pre-wrap select-all font-mono leading-relaxed">
                    <span x-text="l.details_json"></span>
                  </div>
                </div>
              </template>
            </div>

          </div>

        </div>

        <!-- 8. IPv6 Firewall Rules (Pinhole), Placement Test, Guardian VPN & Serial Claim (v1.7.0 - Issue #90) -->
        <div class="lg:col-span-2 grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- 8A. IPv6 Firewall Rules (Pinhole) -->
          <div class="glass-panel rounded-2xl p-6 space-y-4 flex flex-col justify-between border border-indigo-500/20">
            <div class="space-y-3">
              <div class="flex items-center justify-between border-b border-black/[0.06] dark:border-white/5 pb-3">
                <div class="flex items-center space-x-3">
                  <div class="w-9 h-9 rounded-xl bg-indigo-500/15 border border-indigo-500/30 flex items-center justify-center text-indigo-600 dark:text-indigo-400 shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                  </div>
                  <div>
                    <h3 class="text-base font-bold text-slate-900 dark:text-white leading-tight" x-text="t('controls.ipv6_fw_title')"></h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5" x-text="t('controls.ipv6_fw_desc')"></p>
                  </div>
                </div>
                <button type="button" @click="fetchIpv6FirewallRules()" class="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs transition cursor-pointer" :title="t('header.refresh')">🔄</button>
              </div>

              <!-- Existing IPv6 Rules List -->
              <div class="space-y-2 max-h-44 overflow-y-auto pr-1 text-xs">
                <template x-for="r in ipv6FirewallRules" :key="r.id">
                  <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                    <div class="min-w-0">
                      <div class="font-bold text-slate-800 dark:text-slate-200 truncate" x-text="r.device_name || r.mac"></div>
                      <div class="text-[11px] font-mono text-slate-500">
                        <span class="uppercase font-bold text-indigo-600 dark:text-indigo-400" x-text="r.protocol"></span>
                        <span> • </span>
                        <span x-text="r.ports"></span>
                        <span x-show="r.mac" x-text="' (' + r.mac + ')'"></span>
                      </div>
                    </div>
                    <button x-show="can('action_manage_rules')" type="button" @click="deleteIpv6FirewallRule(r.id)" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 transition cursor-pointer" :title="t('schedules.delete')">🗑️</button>
                  </div>
                </template>
                <template x-if="!ipv6FirewallRules || ipv6FirewallRules.length === 0">
                  <div class="p-4 rounded-xl border border-dashed border-slate-300 dark:border-slate-800 text-center text-slate-500" x-text="t('controls.ipv6_fw_empty')"></div>
                </template>
              </div>

              <!-- Add Rule Form -->
              <div x-show="can('action_manage_rules')" class="pt-2 border-t border-black/[0.06] dark:border-white/5 grid grid-cols-1 sm:grid-cols-12 gap-2 text-xs">
                <input type="text" x-model="ipv6RuleForm.device_name" :placeholder="t('controls.ipv6_fw_device_placeholder')" class="sm:col-span-4 glass-input px-2.5 py-1.5 rounded-lg">
                <input type="text" x-model="ipv6RuleForm.mac" placeholder="aa:bb:cc:dd:ee:ff" class="sm:col-span-4 glass-input px-2.5 py-1.5 rounded-lg font-mono">
                <select x-model="ipv6RuleForm.protocol" class="sm:col-span-2 glass-input px-2 py-1.5 rounded-lg font-mono">
                  <option value="tcp">TCP</option>
                  <option value="udp">UDP</option>
                  <option value="both">BOTH</option>
                </select>
                <input type="text" x-model="ipv6RuleForm.ports" placeholder="443" class="sm:col-span-2 glass-input px-2.5 py-1.5 rounded-lg font-mono">
              </div>
            </div>
            <div x-show="can('action_manage_rules')" class="pt-2">
              <button type="button" @click="addIpv6FirewallRule()" class="w-full py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-md shadow-indigo-600/20 transition cursor-pointer" x-text="t('controls.ipv6_fw_add_btn')"></button>
            </div>
          </div>

          <!-- 8B. RF Placement Test, Guardian VPN & Hardware Serial Onboarding -->
          <div class="glass-panel rounded-2xl p-6 space-y-4 flex flex-col justify-between border border-emerald-500/20">
            <div class="space-y-4 text-xs">
              <div class="flex items-center justify-between border-b border-black/[0.06] dark:border-white/5 pb-3">
                <div class="flex items-center space-x-3">
                  <div class="w-9 h-9 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-600 dark:text-emerald-400 shrink-0">📡</div>
                  <div>
                    <h3 class="text-base font-bold text-slate-900 dark:text-white leading-tight" x-text="t('controls.mesh_tools_title')"></h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5" x-text="t('controls.mesh_tools_desc')"></p>
                  </div>
                </div>
              </div>

              <!-- Placement Test Row -->
              <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 space-y-3">
                <div class="flex items-center justify-between gap-3">
                  <div>
                    <span class="font-bold text-slate-800 dark:text-slate-200" x-text="t('controls.placement_test_title')"></span>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5" x-text="t('controls.mesh_tools_desc')"></p>
                  </div>
                  <button type="button" 
                          @click="runPlacementTest()" 
                          :disabled="placementTestLoading" 
                          class="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold transition cursor-pointer disabled:opacity-50 flex items-center gap-2 shadow-sm shrink-0">
                    <svg x-show="placementTestLoading" class="animate-spin h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24">
                      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span x-text="placementTestLoading ? t('controls.placement_test_running') : t('controls.placement_test_btn')"></span>
                  </button>
                </div>

                <!-- Placement Test Detailed Results Panel -->
                <div x-show="placementTestResult" class="pt-2 border-t border-slate-200/80 dark:border-slate-800/80 space-y-3">
                  <!-- Overall Score Banner -->
                  <div class="p-3 rounded-xl flex items-center justify-between gap-3"
                       :class="{
                         'bg-emerald-500/10 border border-emerald-500/20 text-emerald-800 dark:text-emerald-300': (placementTestResult?.score || 0) >= 80,
                         'bg-amber-500/10 border border-amber-500/20 text-amber-800 dark:text-amber-300': (placementTestResult?.score || 0) >= 60 && (placementTestResult?.score || 0) < 80,
                         'bg-rose-500/10 border border-rose-500/20 text-rose-800 dark:text-rose-300': (placementTestResult?.score || 0) < 60
                       }">
                    <div class="space-y-1">
                      <div class="flex items-center gap-2">
                        <span class="text-xs uppercase tracking-wider font-bold opacity-80" x-text="t('controls.placement_score_label')"></span>
                        <span class="text-xs px-2 py-0.5 rounded-full font-bold uppercase"
                              :class="{
                                'bg-emerald-500/20 text-emerald-700 dark:text-emerald-300': (placementTestResult?.score || 0) >= 80,
                                'bg-amber-500/20 text-amber-700 dark:text-amber-300': (placementTestResult?.score || 0) >= 60 && (placementTestResult?.score || 0) < 80,
                                'bg-rose-500/20 text-rose-700 dark:text-rose-300': (placementTestResult?.score || 0) < 60
                              }"
                              x-text="(placementTestResult?.rating || 'optimal').toUpperCase()"></span>
                      </div>
                      <div class="text-[11px] leading-relaxed opacity-90"
                           x-text="(placementTestResult?.score || 0) >= 80 ? t('controls.placement_advice_optimal') : ((placementTestResult?.score || 0) >= 60 ? t('controls.placement_advice_good') : t('controls.placement_advice_poor'))"></div>
                    </div>
                    <div class="flex items-center gap-3 shrink-0">
                      <div class="text-right">
                        <div class="text-2xl font-black tracking-tight" x-text="placementTestResult ? (placementTestResult.score + '/100') : ''"></div>
                      </div>
                      <button type="button" @click="placementTestResult = null" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs px-2 py-1 rounded border border-slate-200 dark:border-slate-700 cursor-pointer" :title="t('controls.placement_close')">✕</button>
                    </div>
                  </div>

                  <!-- Nodes Breakdown List -->
                  <div class="space-y-2">
                    <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400" x-text="t('controls.placement_nodes_title')"></div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
                      <template x-for="n in (placementTestResult?.nodes || [])" :key="n.name">
                        <div class="p-2.5 rounded-lg bg-white/70 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 flex items-center justify-between gap-2 shadow-xs">
                          <div class="min-w-0">
                            <div class="flex items-center gap-1.5">
                              <span class="text-sm shrink-0" x-text="n.is_echo_node ? '🔊' : (n.wired ? '🔌' : '📡')"></span>
                              <span class="font-bold text-xs text-slate-800 dark:text-slate-200 truncate" x-text="n.name || 'eero Node'"></span>
                              <span x-show="n.is_echo_node" class="text-[9px] px-1 rounded bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 font-bold shrink-0">Echo</span>
                            </div>
                            <div class="text-[10px] text-slate-500 dark:text-slate-400 truncate mt-0.5" x-text="n.model || 'eero'"></div>
                            <div class="mt-1">
                              <span x-show="n.wired" class="text-[9px] px-1.5 py-0.5 rounded font-medium bg-sky-500/10 text-sky-600 dark:text-sky-400" x-text="t('controls.placement_wired_backhaul')"></span>
                              <span x-show="!n.wired" class="text-[9px] px-1.5 py-0.5 rounded font-medium bg-emerald-500/10 text-emerald-600 dark:text-emerald-400" x-text="t('controls.placement_mesh_backhaul') + ' (' + (n.mesh_quality_bars || 5) + '/5)'"></span>
                            </div>
                          </div>
                          <div class="text-right shrink-0">
                            <div class="font-bold text-xs"
                                 :class="{
                                   'text-emerald-600 dark:text-emerald-400': n.placement_score >= 80,
                                   'text-amber-600 dark:text-amber-400': n.placement_score >= 60 && n.placement_score < 80,
                                   'text-rose-600 dark:text-rose-400': n.placement_score < 60
                                 }"
                                 x-text="n.placement_score + '/100'"></div>
                            <div class="text-[9px] uppercase font-bold text-slate-400" x-text="n.rating"></div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Guardian VPN Row (eero Plus) -->
              <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 space-y-3">
                <div class="flex items-start justify-between gap-3">
                  <div class="space-y-1">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="font-bold text-slate-800 dark:text-slate-200" x-text="t('controls.guardian_vpn_title')"></span>
                      <!-- Subscription Badge -->
                      <span x-show="guardianVpn.supported" class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5"></span>
                        <span x-text="t('controls.guardian_vpn_supported')"></span>
                      </span>
                      <span x-show="!guardianVpn.supported" class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-500/10 text-slate-500 dark:text-slate-400 border border-slate-500/20">
                        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 mr-1.5"></span>
                        <span x-text="t('controls.guardian_vpn_unsupported')"></span>
                      </span>
                    </div>
                    <div class="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed" x-text="t('controls.guardian_vpn_desc')"></div>
                  </div>

                  <!-- Toggle Switch + Status Label -->
                  <div class="flex items-center gap-3 shrink-0">
                    <span class="text-xs font-bold flex items-center gap-1.5"
                          :class="guardianVpn.enabled ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-500 dark:text-slate-400'">
                      <span x-show="guardianVpn.enabled" class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                      </span>
                      <span x-show="!guardianVpn.enabled" class="inline-flex rounded-full h-2 w-2 bg-slate-400"></span>
                      <span x-text="guardianVpn.enabled ? t('controls.vpn_active') : t('controls.vpn_inactive')"></span>
                    </span>

                    <label class="relative inline-flex items-center cursor-pointer select-none"
                           :class="(!guardianVpn.supported || guardianVpnLoading) ? 'opacity-50 cursor-not-allowed' : ''">
                      <input type="checkbox"
                             x-model="guardianVpn.enabled" 
                             :disabled="!guardianVpn.supported || guardianVpnLoading" 
                             @change="toggleGuardianVpn()" 
                             class="sr-only peer">
                      <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-slate-600 peer-checked:bg-emerald-600"></div>
                    </label>
                  </div>
                </div>

                <!-- Info message when not supported -->
                <div x-show="!guardianVpn.supported" class="text-[11px] p-2.5 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-700 dark:text-amber-400 flex items-center gap-2">
                  <span>ℹ️</span>
                  <span x-text="t('controls.guardian_vpn_req_plus')"></span>
                </div>
              </div>

              <!-- Hardware Serial Claim / Onboarding -->
              <div x-show="can('action_manage_rules')" class="p-3 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 space-y-2">
                <div class="font-bold text-slate-800 dark:text-slate-200" x-text="t('controls.serial_claim_title')"></div>
                <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
                  <input type="text" x-model="serialClaimForm.serial" :placeholder="t('controls.serial_placeholder')" class="sm:col-span-5 glass-input px-2.5 py-1.5 rounded-lg font-mono uppercase">
                  <input type="text" x-model="serialClaimForm.location" :placeholder="t('controls.location_placeholder')" class="sm:col-span-4 glass-input px-2.5 py-1.5 rounded-lg">
                  <button type="button" @click="registerEeroNodeBySerial()" class="sm:col-span-3 py-1.5 px-2 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-bold transition cursor-pointer" x-text="t('controls.serial_claim_btn')"></button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 9. eero AI Diagnostic Assistant (SSE Streaming Chat - v1.7.0) -->
        <div class="lg:col-span-2 glass-panel rounded-2xl p-6 space-y-4 border border-sky-500/20 shadow-md">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-black/[0.06] dark:border-white/5 pb-3">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-md shrink-0">🤖</div>
              <div>
                <h3 class="text-base font-bold text-slate-900 dark:text-white" x-text="t('controls.ai_assistant_title')"></h3>
                <p class="text-xs text-slate-500 dark:text-slate-400" x-text="t('controls.ai_assistant_subtitle')"></p>
              </div>
            </div>
          </div>

          <div x-show="assistantReply" class="p-4 rounded-xl bg-slate-50 dark:bg-slate-900/70 border border-slate-200 dark:border-slate-800 text-xs text-slate-800 dark:text-slate-200 whitespace-pre-wrap leading-relaxed font-medium" x-text="assistantReply"></div>

          <form @submit.prevent="askNetworkAssistant()" class="flex items-center gap-2 text-xs">
            <input type="text" x-model="assistantPrompt" :placeholder="t('controls.ai_assistant_placeholder')" class="flex-1 glass-input px-3.5 py-2.5 rounded-xl">
            <button type="submit" :disabled="assistantLoading || !assistantPrompt" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-bold transition cursor-pointer disabled:opacity-50" x-text="assistantLoading ? t('header.refreshing') : t('controls.ai_assistant_send')"></button>
          </form>
        </div>

      </div>

    </div>
