    <!-- =================================================================== -->
    <!-- SUB-TAB 6.3: BACKUP & RIPRISTINO -->
    <!-- =================================================================== -->
    <div x-show="currentTab === 'settings-backup'" class="space-y-6 animate-fade-in" style="display: none;">
      <!-- Header -->
      <div class="glass-panel rounded-2xl p-6">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-sky-600 flex items-center justify-center text-white shadow-md shadow-emerald-500/20 shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          </div>
          <div>
            <h2 class="text-lg font-bold text-slate-900 dark:text-white" x-text="t('settings_backup.title')"></h2>
            <p class="text-xs text-slate-500 dark:text-slate-400" x-text="t('settings_backup.subtitle')"></p>
          </div>
        </div>
      </div>

      <!-- Admin Login Required Notice (when not logged in or missing action_system_backup) -->
      <div x-show="!can('action_system_backup')" class="p-6 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-xs">
        <div class="flex items-center space-x-3">
          <span class="text-3xl shrink-0">🔐</span>
          <div>
            <span class="font-bold text-amber-900 dark:text-amber-200 block text-sm" x-text="t('auth_local.admin_required_title')"></span>
            <p class="text-slate-600 dark:text-slate-400 mt-1" x-text="t('auth_local.admin_required_desc')"></p>
          </div>
        </div>
        <button 
          type="button" 
          @click="openLocalLoginModal()"
          class="shrink-0 px-4 py-2.5 rounded-xl bg-[#0067c0] hover:bg-[#005299] text-white font-bold transition shadow-sm shadow-sky-500/20 cursor-pointer flex items-center space-x-1.5 self-start sm:self-auto active:scale-95">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
          <span x-text="t('auth_local.login_as_admin_btn')"></span>
        </button>
      </div>

      <div x-show="can('action_system_backup')" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- 1. Export Card -->
        <div class="glass-panel rounded-2xl p-6 space-y-4 text-xs">
          <div class="flex items-center space-x-3 border-b border-black/[0.06] dark:border-white/5 pb-3">
            <div class="w-8 h-8 rounded-lg bg-sky-500/10 text-sky-600 dark:text-sky-400 flex items-center justify-center text-base shrink-0">
              📦
            </div>
            <div>
              <h3 class="font-bold text-slate-900 dark:text-white text-sm" x-text="t('backup_modal.export_title')"></h3>
              <span class="text-[11px] text-slate-500" x-text="t('backup_modal.export_format_hint')"></span>
            </div>
          </div>
          <p class="text-slate-600 dark:text-slate-400 leading-relaxed" x-text="t('backup_modal.export_desc')"></p>
          <div class="pt-2">
            <button 
              @click="downloadBackup()" 
              class="px-5 py-2.5 rounded-xl bg-[#0067c0] hover:bg-[#005299] text-white font-bold transition shadow-sm cursor-pointer flex items-center space-x-2 active:scale-95">
              <span>⬇️</span>
              <span x-text="t('backup_modal.export_btn')"></span>
            </button>
          </div>
        </div>

        <!-- 2. Restore Card -->
        <div class="glass-panel rounded-2xl p-6 space-y-4 text-xs border border-amber-500/20">
          <div class="flex items-center space-x-3 border-b border-black/[0.06] dark:border-white/5 pb-3">
            <div class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-600 dark:text-amber-400 flex items-center justify-center text-base shrink-0">
              📥
            </div>
            <div>
              <h3 class="font-bold text-amber-900 dark:text-amber-300 text-sm" x-text="t('backup_modal.restore_title')"></h3>
              <span class="text-[11px] text-slate-500" x-text="t('backup_modal.restore_format_hint')"></span>
            </div>
          </div>
          <p class="text-slate-600 dark:text-slate-400 leading-relaxed" x-text="t('backup_modal.restore_desc')"></p>
          
          <div class="p-3 rounded-xl bg-amber-500/10 text-amber-800 dark:text-amber-200 text-[11px] font-medium" x-text="t('backup_modal.restore_warning')"></div>

          <div class="space-y-2">
            <label class="block text-slate-700 dark:text-slate-300 font-semibold" x-text="t('backup_modal.select_file')"></label>
            <input 
              type="file" 
              accept=".json" 
              @change="uploadBackup($event)"
              :disabled="backupLoading"
              class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-sky-50 file:text-[#0067c0] hover:file:bg-sky-100 dark:file:bg-sky-500/20 dark:file:text-sky-300 cursor-pointer disabled:opacity-50">
          </div>

          <template x-if="backupRestoreStatus">
            <div class="p-3 rounded-xl text-xs font-semibold"
                 :class="backupRestoreIsError ? 'bg-rose-500/15 text-rose-700 dark:text-rose-400' : 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-400'"
                 x-text="backupRestoreStatus"></div>
          </template>
        </div>

        <!-- 3. SQLite Database Health & Compaction (Full Width) -->
        <div class="lg:col-span-2 glass-panel rounded-2xl p-6 space-y-4 text-xs">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-black/[0.06] dark:border-white/5 pb-3">
            <div class="flex items-center space-x-3">
              <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-base shrink-0">
                🗄️
              </div>
              <div>
                <h3 class="font-bold text-slate-900 dark:text-white text-sm" x-text="t('settings_backup.db_health_title')"></h3>
                <span class="text-[11px] text-slate-500 font-mono" x-text="dbStats?.db_path || './data/metrics.db'"></span>
              </div>
            </div>

            <button 
              @click="triggerDbCompaction()" 
              :disabled="dbCompacting"
              class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold transition shadow-sm cursor-pointer flex items-center space-x-2 disabled:opacity-50 active:scale-95">
              <span :class="dbCompacting ? 'animate-spin' : ''">🔄</span>
              <span x-text="dbCompacting ? t('settings_backup.compacting') : t('settings_backup.compact_btn')"></span>
            </button>
          </div>

          <p class="text-slate-600 dark:text-slate-400 leading-relaxed" x-text="t('settings_backup.db_description')"></p>

          <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 pt-2">
            <div class="p-3.5 rounded-xl bg-black/[0.02] dark:bg-white/[0.02] border border-slate-200 dark:border-slate-800">
              <span class="text-slate-500 dark:text-slate-400 block text-[11px]" x-text="t('settings_backup.db_size')"></span>
              <span class="font-bold text-sm font-mono text-slate-900 dark:text-white" x-text="dbStats?.size_mb ? dbStats.size_mb + ' MB' : '---'"></span>
            </div>
            <div class="p-3.5 rounded-xl bg-black/[0.02] dark:bg-white/[0.02] border border-slate-200 dark:border-slate-800">
              <span class="text-slate-500 dark:text-slate-400 block text-[11px]" x-text="t('settings_backup.wal_size')"></span>
              <span class="font-bold text-sm font-mono text-slate-900 dark:text-white" x-text="dbStats?.wal_size_mb !== undefined ? dbStats.wal_size_mb + ' MB' : '---'"></span>
            </div>
            <div class="p-3.5 rounded-xl bg-black/[0.02] dark:bg-white/[0.02] border border-slate-200 dark:border-slate-800">
              <span class="text-slate-500 dark:text-slate-400 block text-[11px]" x-text="t('settings_backup.total_size')"></span>
              <span class="font-bold text-sm font-mono text-emerald-600 dark:text-emerald-400" x-text="dbStats?.total_size_mb ? dbStats.total_size_mb + ' MB' : '---'"></span>
            </div>
            <div class="p-3.5 rounded-xl bg-black/[0.02] dark:bg-white/[0.02] border border-slate-200 dark:border-slate-800">
              <span class="text-slate-500 dark:text-slate-400 block text-[11px]" x-text="t('settings_backup.last_compaction')"></span>
              <span class="font-bold text-xs font-mono text-slate-700 dark:text-slate-300" x-text="dbStats?.last_retention_run ? dbStats.last_retention_run.replace('T', ' ').replace('Z', '') : t('settings_backup.auto_interval')"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
