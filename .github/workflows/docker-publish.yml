name: Publish Multi-Arch Docker Image to Docker Hub

on:
  push:
    branches:
      - main
      - test
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Tag Docker Hub da generare (es. test, 1.5.0-test, pre-release)'
        required: false
        default: 'test'
        type: string
      custom_build_number:
        description: 'Numero di build specifico (opzionale, es. 1). Se omesso, calcolato automaticamente.'
        required: false
        type: string

env:
  IMAGE_NAME: enricoflammini/eero-dashboard

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate Branch-Specific Build Number
        id: versioning
        run: |
          APP_VER="1.5.0"
          REPO_BUILD=$(cat BUILD_NUMBER 2>/dev/null | tr -d ' \r\n' || echo "1")
          if [ -z "$REPO_BUILD" ]; then REPO_BUILD="1"; fi

          # Pulizia tokenizzata dei tag legacy temporanei (>= 90) su Docker Hub se credenziali disponibili
          DH_TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"${{ secrets.DOCKERHUB_USERNAME }}\", \"password\": \"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token 2>/dev/null || true)
          if [ -n "$DH_TOKEN" ] && [ "$DH_TOKEN" != "null" ]; then
            for old_tag in 1.5.0 v1.5.0 1.5.0-build.93 1.5.0-build.96 v1.5.0-build.94 v1.5.0-build.97 test-build.92 test-build.95; do
              curl -s -X DELETE -H "Authorization: JWT $DH_TOKEN" "https://hub.docker.com/v2/repositories/${{ env.IMAGE_NAME }}/tags/${old_tag}/" >/dev/null 2>&1 || true
            done
          fi

          # 1. Override manuale via workflow_dispatch
          if [ -n "${{ inputs.custom_build_number }}" ]; then
            BUILD_NUM="${{ inputs.custom_build_number }}"
            echo "Numero di build manuale impostato: ${BUILD_NUM}"
          # 2. Rilascio su MAIN o Tag di Release: parte da 1 per questa versione e non dipende da dev/test
          elif [ "${{ github.ref }}" = "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS_JSON=$(curl -s "https://hub.docker.com/v2/repositories/${{ env.IMAGE_NAME }}/tags?page_size=100")
            DH_LATEST=$(echo "$TAGS_JSON" | jq -r '.results[].name' 2>/dev/null | \
              grep -E "^${APP_VER}-build\.[0-9]+$" | \
              sed -E "s/^${APP_VER}-build\.//" | \
              awk '$1 < 90' | \
              sort -n | tail -n 1)

            if [ -z "$DH_LATEST" ]; then
              BUILD_NUM=${REPO_BUILD:-1}
            else
              if [ "$REPO_BUILD" -gt "$DH_LATEST" ]; then
                BUILD_NUM=$REPO_BUILD
              else
                BUILD_NUM=$((DH_LATEST + 1))
              fi
            fi
            echo "Build number calcolato per MAIN: ${BUILD_NUM}"
          # 3. Rilascio su TEST: numerazione indipendente da main
          elif [ "${{ github.ref }}" = "refs/heads/test" ]; then
            TAGS_JSON=$(curl -s "https://hub.docker.com/v2/repositories/${{ env.IMAGE_NAME }}/tags?page_size=100")
            DH_TEST_LATEST=$(echo "$TAGS_JSON" | jq -r '.results[].name' 2>/dev/null | \
              grep -E "^test-build\.[0-9]+$" | \
              sed -E "s/^test-build\.//" | \
              awk '$1 < 90' | \
              sort -n | tail -n 1)

            if [ -z "$DH_TEST_LATEST" ]; then
              BUILD_NUM=1
            else
              BUILD_NUM=$((DH_TEST_LATEST + 1))
            fi
            echo "Build number calcolato per TEST: ${BUILD_NUM}"
          else
            BUILD_NUM=1
          fi

          echo "app_version=${APP_VER}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "full_version=${APP_VER} build ${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "build_tag=${APP_VER}-build.${BUILD_NUM}" >> $GITHUB_OUTPUT

      - name: Set up QEMU (Multi-Architecture Support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ steps.versioning.outputs.build_tag }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/test' }}
            type=raw,value=test-build.${{ steps.versioning.outputs.build_number }},enable=${{ github.ref == 'refs/heads/test' }}
            type=raw,value=${{ inputs.custom_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.custom_tag != '' }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.versioning.outputs.app_version }}
            BUILD_NUMBER=${{ steps.versioning.outputs.build_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
