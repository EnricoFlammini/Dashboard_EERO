name: Publish Multi-Arch Docker Image to Docker Hub

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Tag Docker Hub da generare (es. test, 1.5.0-test, pre-release)'
        required: false
        default: 'test'
        type: string
      custom_build_number:
        description: 'Numero di build specifico (opzionale, es. 1). Se omesso, calcolato automaticamente.'
        required: false
        type: string

env:
  IMAGE_NAME: enricoflammini/eero-dashboard
  NODE_OPTIONS: "--no-deprecation"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Optimize Network Stack (Force IPv4 for Docker Hub)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true

      - name: Calculate Branch-Specific Build Number
        id: versioning
        run: |
          # Estrae dinamicamente la versione dell'applicazione da app/__init__.py
          APP_VER=$(grep -E '^__version__' app/__init__.py | cut -d'"' -f2 || true)
          if [ -z "$APP_VER" ]; then
            APP_VER=$(grep -E '^__version__' app/__init__.py | cut -d"'" -f2 || true)
          fi
          if [ -z "$APP_VER" ]; then APP_VER="1.6.0"; fi


          # 1. Override manuale via workflow_dispatch
          if [ -n "${{ inputs.custom_build_number }}" ]; then
            BUILD_NUM="${{ inputs.custom_build_number }}"
            echo "Numero di build manuale impostato: ${BUILD_NUM}"
          # 2. Rilascio su MAIN: numerazione progressiva legata unicamente a main per la versione corrente
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS_JSON=$(curl -s -H "Cache-Control: no-cache" "https://hub.docker.com/v2/repositories/${{ env.IMAGE_NAME }}/tags?page_size=100&ts=$(date +%s)")
            DH_LATEST=$(echo "$TAGS_JSON" | jq -r '.results[].name' 2>/dev/null | \
              grep -E "^${APP_VER}-build\.[0-9]+$" | \
              sed -E "s/^${APP_VER}-build\.//" | \
              awk '$1 < 90' | \
              sort -n | tail -n 1)

            if [ -z "$DH_LATEST" ]; then
              BUILD_NUM=1
            else
              BUILD_NUM=$((DH_LATEST + 1))
            fi
            echo "Build number calcolato per MAIN: ${BUILD_NUM}"
          # 3. Rilascio su TEST: numerazione progressiva specifica per versione test (es. 1.6.0-test.1)
          elif [ "${{ github.ref }}" = "refs/heads/test" ]; then
            TAGS_JSON=$(curl -s -H "Cache-Control: no-cache" "https://hub.docker.com/v2/repositories/${{ env.IMAGE_NAME }}/tags?page_size=100&ts=$(date +%s)")
            DH_TEST_LATEST=$(echo "$TAGS_JSON" | jq -r '.results[].name' 2>/dev/null | \
              grep -E "^${APP_VER}-test\.[0-9]+$" | \
              sed -E "s/^${APP_VER}-test\.//" | \
              awk '$1 < 90' | \
              sort -n | tail -n 1)

            if [ -z "$DH_TEST_LATEST" ]; then
              BUILD_NUM=1
            else
              BUILD_NUM=$((DH_TEST_LATEST + 1))
            fi
            echo "Build number calcolato per TEST: ${BUILD_NUM}"
          else
            BUILD_NUM=1
          fi

          echo "app_version=${APP_VER}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "full_version=${APP_VER} test ${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "build_tag=${APP_VER}-build.${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "test_tag=${APP_VER}-test.${BUILD_NUM}" >> $GITHUB_OUTPUT

      - name: Set up QEMU (Multi-Architecture Support)
        uses: docker/setup-qemu-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.versioning.outputs.build_tag }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/test' }}
            type=raw,value=${{ steps.versioning.outputs.test_tag }},enable=${{ github.ref == 'refs/heads/test' }}
            type=raw,value=${{ inputs.custom_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.custom_tag != '' }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.versioning.outputs.app_version }}
            BUILD_NUMBER=${{ steps.versioning.outputs.build_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune Docker Hub Tags (Keep 5 Main, 1 Test)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MAX_MAIN_TAGS: 5
          MAX_TEST_TAGS: 1
        run: python3 scripts/prune_docker_tags.py
