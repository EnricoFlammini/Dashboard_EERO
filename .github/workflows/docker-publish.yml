name: Publish Multi-Arch Docker Image to Docker Hub

on:
  push:
    branches:
      - main
      - test
    paths-ignore:
      - 'ROADMAP.md'
      - 'roadmap.md'
      - 'docs/**'
      # Workflow-only changes must not publish a new image (and burn a build number);
      # run the workflow manually via workflow_dispatch when needed.
      - '.github/**'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Tag Docker Hub da generare (es. test, 1.5.0-test, pre-release)'
        required: false
        default: 'test'
        type: string
      custom_build_number:
        description: 'Numero di build specifico (opzionale, es. 1). Se omesso, calcolato automaticamente.'
        required: false
        type: string

env:
  IMAGE_NAME: enricoflammini/eero-dashboard

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate Branch-Specific Build Number
        id: versioning
        run: |
          # Estrae dinamicamente la versione dell'applicazione da app/__init__.py
          APP_VER=$(grep -E '^__version__' app/__init__.py | cut -d'"' -f2 || true)
          if [ -z "$APP_VER" ]; then
            APP_VER=$(grep -E '^__version__' app/__init__.py | cut -d"'" -f2 || true)
          fi
          if [ -z "$APP_VER" ]; then APP_VER="1.6.0"; fi

          # 1. Override manuale via workflow_dispatch
          if [ -n "${{ inputs.custom_build_number }}" ]; then
            BUILD_NUM="${{ inputs.custom_build_number }}"
            echo "Numero di build manuale impostato: ${BUILD_NUM}"
          # 2. Rilascio su MAIN: the build number comes from the repo's BUILD_NUMBER file, the same
          #    source the test branch and the running app use, so main's version tag always matches
          #    the build the app reports. Counting Docker Hub tags instead let main drift ahead of
          #    BUILD_NUMBER, and every test install then saw a phantom update (e.g. "Build 7" while
          #    the repo was on Build 5). An existing version tag is never overwritten.
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if [ -f BUILD_NUMBER ]; then
              BUILD_NUM=$(tr -d '[:space:]' < BUILD_NUMBER)
            fi
            if ! echo "$BUILD_NUM" | grep -Eq '^[1-9][0-9]*$'; then
              echo "::error file=BUILD_NUMBER::BUILD_NUMBER must contain a positive integer (found '${BUILD_NUM}')."
              exit 1
            fi
            TAG_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "Cache-Control: no-cache" \
              "https://hub.docker.com/v2/repositories/${{ env.IMAGE_NAME }}/tags/${APP_VER}-build.${BUILD_NUM}?ts=$(date +%s)")
            if [ "$TAG_STATUS" = "200" ]; then
              echo "::error file=BUILD_NUMBER::${{ env.IMAGE_NAME }}:${APP_VER}-build.${BUILD_NUM} is already published. Bump BUILD_NUMBER (or app/__init__.py __version__) before releasing to main."
              exit 1
            fi
            echo "Build number per MAIN (da BUILD_NUMBER): ${BUILD_NUM}"
          # 3. Rilascio su TEST: verra' generato esclusivamente il tag flottante 'test' usando il BUILD_NUMBER del repo
          elif [ "${{ github.ref }}" = "refs/heads/test" ]; then
            if [ -f BUILD_NUMBER ]; then
              BUILD_NUM=$(tr -d '[:space:]' < BUILD_NUMBER)
            fi
            if [ -z "$BUILD_NUM" ]; then
              BUILD_NUM="test"
            fi
            echo "Build su branch TEST (build ${BUILD_NUM}): sara' generato solo il tag 'test' (senza tag di versione dedicato)"
          else
            BUILD_NUM=1
          fi

          echo "app_version=${APP_VER}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "full_version=${APP_VER} (${BUILD_NUM})" >> $GITHUB_OUTPUT
          echo "build_tag=${APP_VER}-build.${BUILD_NUM}" >> $GITHUB_OUTPUT

      - name: Set up QEMU (Multi-Architecture Support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.versioning.outputs.build_tag }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/test' }}
            type=raw,value=${{ inputs.custom_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.custom_tag != '' }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.versioning.outputs.app_version }}
            BUILD_NUMBER=${{ steps.versioning.outputs.build_number }}
            GIT_BRANCH=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Aqua Security Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'test' }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Prune older Docker Hub tags (Retention Policy)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          python3 scripts/prune_docker_tags.py --keep-main 5
